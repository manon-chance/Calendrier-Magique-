var D_MAI=[{"date":"Mai","month":"Mai","type":"mois","title":"Mois de Mai — Activez votre plus haut potentiel","sub":"Mois CINQ · Vierge Marie · Mois magnétique · 5 = l'homme réalisé","content":[{"b":"eileen","t":"« N'aie crainte. Passe à travers le nuage de l'ignorance dans la lumière glorieuse du soleil et sois conscient de ma réalité et de ma divine présence, car je suis partout. Il n'existe aucun lieu où je ne suis pas. »\n\nImage : Une montagne dont le sommet est enveloppé dans un nuage. Arrivé au sommet, traversez-vous le nuage ou hésitez-vous et avez-vous peur de passer au travers."},{"b":"text","l":"MAI vient de Maïa, déesse mère de Mercure","t":"C'est un Mois Cosmique, Magique et Magnétique. Mois CINQ — « 5 » est le nombre de l'homme réalisé. L'homme est en harmonie avec le mois de Mai. 5 = Nombre du changement, de l'aventure et du mouvement. En positif : découverte - élévation - exploration. 2 (matière) + 3 (divin) = 5. Nombre d'union et d'harmonie. C'est le milieu des 9 nombres.\n\nSigne : TAUREAU. Élément : AIR. Couleurs : Rose - Bleu.\n\nFleurs : Muguet = mutation (muter = changer) / Rose = oser (il faut oser non ce que vous voulez, mais ce qui doit être fait) / Lys = fleur de l'union de la force (est aussi la rose du Christ, d'où sa puissance). Ce sont les fleurs de la déesse mère."},{"b":"text","l":"MAI, c'est le Mois","t":"— De Grâce : « Aime » et d'Amour Cosmique : la Mère se donne à l'humain\n— De miracle et d'élévation si vous profitez en conscience de la puissance colossale de Vierge Marie dans la joie\n— De changement de votre vie, de votre personnalité : repartir à zéro comme un enfant du bon pied\n— De concrétisation\n— Du mystère et des secrets par excellence\n— En Mai, les choses se mettent en place"},{"b":"text","l":"Vierge Marie — supérieure à l'Énergie Divine","t":"MOIS DE LA VIERGE MARIE, Mère de notre Dieu, celui de la Mère qui donne la vie, crée et construit. Vierge Marie est supérieure à l'Énergie Divine qui est en vous. Elle est hors de notre univers ; donc, elle est plus « puissante » que votre Dieu et que notre Univers. Ce qui est génial : la Vierge Marie irradie également pour tous ceux qui ne sont pas catholiques. Vierge Marie possède 9 noms, dont « Aset ». Elle vient de Sirius. Isis, c'est le nom donné à « Aset » par les Égyptiens. C'est la mère de Tout, de tous les Dieux, de tous les mondes, de tout l'Univers."},{"b":"pratique","l":"ACTIONS de Mai","items":["Attirer car Mai est un mois où votre magnétisme est plus fort. Le but est de ne pas faire des efforts, mais d'attirer !","Vivre au jour le jour","Se libérer de ses croyances. Si vous vous cramponnez à vos croyances, c'est impossible de recevoir les Énergies bienfaitrices","S'aimer plus. Se faire un compliment par jour","Changer vos stratégies","Privilégier les mots d'amour et de douceur"]},{"b":"text","l":"ATTITUDES","t":"— Être comme l'enfant qui se laisse porter par la mère\n— Savoir ce qui est bon pour vous, non pas vos croyances, ni vos émotions\n— Avoir une vision spatiale, ce qui permet de réaliser tous vos vœux"},{"b":"text","l":"CONSEILS","t":"— Faire moins\n— Recevoir plus\n— S'ouvrir pour mieux recevoir\n— Divine Providence communiquera mieux si vous êtes dans la sérénité\n— Demandez à Vierge Marie de vous remplir d'Amour et de Compassion\n— Considérez Mai, comme le Tabernacle (Y H V H)\n— Offrez à Vierge Marie, votre âme, votre esprit et votre corps\n— Attention au Mai (s) : dire : « Je suis en conscience » car tout ce que vous pensez en inconscient ne se réalise pas"},{"b":"text","l":"QUESTIONS","t":"— Êtes-vous sur le chemin de la Rose (Oser) ou des épines ?\n— Avez-vous un bon Eros ?\n— Où en êtes-vous dans la matière ? Osez-vous encore ?\n— Est-ce que vous offrez suffisamment à Dieu ?\n— Qu'allez-vous faire avec la Force de la Vierge Marie ?\n— Qu'allez-vous vous permettre de faire durant ce mois ?"},{"b":"text","l":"MOTS-CLÉS","t":"Ouverture · Amour · Douceur"},{"b":"text","l":"DICTON initiatique","t":"« En Mai, fais ce qu'il te plaît » = initiatiquement « Laisser faire ». C'est laisser agir cette Force Supérieure à vous. Faites moins de recherche. La Mère Nature, la Kundalini, vous nourrit de l'intérieur et de l'extérieur.\n\nAttention : « mais » = mai avec un « S » et le « S », c'est le serpent. Si vous vous cramponnez à vos peurs, vous ne pouvez pas recevoir les énergies bienfaitrices du mois de Mai.\n\nMai est « aimer » : le mois commence par le « M » c'est aimer. C'est la 13ème lettre de l'alphabet, située au milieu de l'alphabet, suivie de N (haine) donc Aime/haine. Attention quand on aime, la haine peut venir. Fais ce qu'il te plaît parce que c'est un mois qui facilite."},{"b":"serge","t":"Nouveau secret du mois de Mai pour réussir — Ramener le Cosmos à vous ! Quel est le nombre du mois de Mai dans l'année ? Cinq. Quel est le nombre de l'être humain ? Cinq. Une tête, deux bras, deux jambes.\n\nEn prenant les doigts de la main :\n— Janvier : le pouce\n— Février : l'index\n— Mars : le majeur\n— Avril : l'annulaire\n— Mai : le petit doigt\n\nMai est le petit doigt — Élément AIR. Vous êtes en harmonie avec ce mois-là. Vous êtes un aimant quadripolaire : le feu, l'air, l'eau, la terre. Votre magnétisme est plus fort que votre électro. Profitez-en pour attirer."},{"b":"serge","t":"Note de Serge (Mai 2018) : Mai est un mois dangereux ; d'ailleurs il le dit « MAIS ». Le mois de Mai est le dernier mois avant d'entrer dans la densité et les illusions de l'été. C'est le dernier mois pour se renouveler. De juin à septembre, on est dans la densité.\n\nRévélations Dominicales 2019 : En mai, il faut jouer pour s'aimer car Mai égale « aime ». Il faut jouer car vous remarquerez que le tout petit enfant et la maman, tous les deux jouent sans cesse. Le jeu, c'est dans la tête. Jouez avec la Vierge Marie."},{"b":"serge","t":"Note de Serge sur le mois de Mai — Et si vous profitiez de ce mois pour être celui qui sème le bonheur ?\n\nLe bonheur se répand avec quelques gestes, quelques sourires supplémentaires, un peu d'imagination. Amplifiez votre chaleureuse personnalité, il sera impossible de ne pas la remarquer.\n\nPlus vous serez détaché du monde, plus vous aimerez ceux qui l'habitent. Le désir d'aimer est plus fort que celui de détester.\n\nAimer, c'est dégager un puissant sentiment de chaleur, de sensibilité et de compassion. Aimer est un nectar que vous pouvez donner en ce joli mois de Mai sans réserve. Aimer pour aimer, pour ce seul plaisir. N'attendez rien en retour, vous serez mille fois plus comblé.\n\nDans mes recherches, j'ai un jour découvert, avec stupéfaction, que le flot du temps était un flot d'amour incessant. N'importe qui, à n'importe quel moment, peut — en conscience — se glisser dedans. Un instant d'amour vécu dans ce flux cosmique encore inconnu vaut mieux que mille savoirs et mille pouvoirs."},{"b":"serge","t":"Secret des Énergies Divines de la Lettre « M » :\n\nLa lettre M de l'alphabet va avec la lettre N. M = Aime ; N = Haine. La lettre « M » est solide sur ses deux jambes et deux pieds. La lettre « N » boite ; elle n'est pas solide. Prenez la solidité de la lettre « M ».\n\nJ'ajouterai que la lettre « m » en minuscule a la forme d'une ONDE. Il a fallu beaucoup de temps avant que les scientifiques se rendent compte que l'énergie dans l'Univers circule sous forme d'ondes. Donc, nous vivons dans un Océan d'Ondes d'Amour."},{"b":"mantra","l":"Phrases de Mai — Vierge Marie","t":"« Vierge Marie, je te rends grâce de m'avoir transmis plus d'Amour et de Compassion dans ma vie. »\n\n« Vierge Marie, je t'offre mon âme, mon esprit et mon corps. »\n\nAvec ces phrases, Vierge Marie travaille dans votre vie de façon concrète. Rappel de la loi : plus vous donnez, plus vous recevez. Si vous transmettez du bonheur, vous recevrez du bonheur."},{"b":"text","l":"L'image de la Vierge Marie","t":"Les Énergies de la Vierge Marie arrivent sur Terre à travers l'Archange de la Terre. Elle est debout, les pieds sur le serpent : avec Elle, le mal ne peut pas vous atteindre. Elle tient un enfant : notre Univers, notre Dieu. Elle donne la Vie, le premier souffle et le dernier soupir. Liée à l'Élément AIR, c'est la Force de Vie, d'Amour, de Joie et de Construction."},{"b":"serge","t":"**Jouez !** Mai, c'est le mois de la mère, et le premier compagnon de jeu du bébé, c'est la maman. Alors comportez-vous comme des bébés et jouez avec la Vierge Marie : vous prenez la religion et la spiritualité trop au sérieux. Vierge Marie, Divine Providence et Christ sont bien plus joyeux que les humains."},{"b":"pratique","l":"Pour les mères et les pères","items":["Chaque parent accueille des âmes qui lui sont destinées selon le karma de chacun : impossible de généraliser","Chaque parent élève ses enfants au mieux de ses capacités et de sa conscience","Profiter de Mai pour se déculpabiliser : offrir à Vierge Marie ce sentiment de culpabilité ou d'échec — vous avez fait ce que vous avez pu"]},{"b":"eileen","t":"Page du 10 mai : « N'oublie jamais de remercier pour chaque leçon que tu apprends, aussi difficile soit-elle… Ne sois jamais comme une aiguille de tourne-disque coincée dans un sillon, à répéter sans cesse les mêmes vieilles erreurs. »\nDécodage de Serge : rends grâce quand une leçon difficile te tombe dessus — cela pourrait être pire. Ces leçons sont souvent le seul moyen de te faire progresser. Dans ta pensée, et pas ailleurs, se trouve la liberté d'évoluer."},{"b":"eileen","t":"Page du 12 mai : « Vous ne pouvez Me connaître, marcher sur Mon chemin et faire Ma volonté si vous ne M'aimez pas ; et vous ne pouvez pas M'aimer à moins de vous aimer les uns les autres. »\nDécodage de Serge : quand on aime quelqu'un, on cherche à tout savoir de lui ; pourquoi pas avec Dieu ? Chercher à Le connaître vous purifie et vous harmonise. La clé est toujours l'amour : aimer ce que l'on fait, les âmes, l'air que l'on respire. Pour purifier votre cœur, étudiez un peu plus Dieu ou la Petite Voix."},{"b":"hi","t":"Mai est excellent pour les mariages et les baptêmes : votre magnétisme est plus fort que votre électro. Profitez-en pour attirer. « Qui atteint le Fils atteint la Mère. »"}]},{"date":"1er mai","month":"Mai","type":"cosm","title":"1er Mai — Fête de la Vierge Marie et de TOUTES les mères","sub":"Journée des femmes · Mois magnétique · 7 jours avant","content":[{"b":"serge","t":"Tout le monde se contente de dire que c'est la maman de Jésus et c'est tout. Le 1er Mai, c'est la journée de la VIERGE MARIE. Jésus a dit plusieurs fois : « Mon Père et moi, nous sommes UN ». Comme chaque être humain est à l'image de Dieu, la Vierge Marie est la Mère de tous les humains. Donc, le 1er Mai, chaque année, c'est la FÊTE des femmes, car toute femme est mère. Toute femme est respectable car elle est la mère de Dieu.\n\nLe 1er Mai est un jour très important ; Jour de la Vierge Marie, Mère de toutes les Grâces. Acheter un brin de muguet, le bénir et l'offrir à Vierge Marie en lui demandant de vous aider. Journée magique pendant laquelle vous êtes protégé."},{"b":"hi","t":"Les Énergies du 1er Mai commencent **7 jours avant**. Méfiez-vous de ne pas tomber. Voyez ce qui ne va pas en vous pour vous en débarrasser."},{"b":"text","l":"Les trois Énergies de Mai avec Vierge Marie","t":"Sérénité · Bonheur · Joie\n\nComment prier la Vierge Marie pour que ce soit le plus efficace possible ?\n— Lui adresser sa prière : « Je vous salue Marie »\n— Pendant ce mois de Mai, c'est un mois de matière ; si vous la priez à cette époque-là, Elle va vous aider dans la matière\n— Parce qu'au mois de Mai, vous pouvez mieux agir dans la Matière à travers l'Élément AIR car il va dans les 3 autres Éléments. C'est le seul."},{"b":"mantra","l":"Prière à la Vierge Marie","t":"« Je vous salue Marie, pleine de grâces, le Seigneur est avec vous. Vous êtes bénie entre toutes les femmes et Jésus, le fruit de vos entrailles, est béni. Sainte Marie, Mère de Dieu, priez pour nous pauvres pécheurs, maintenant et à l'heure de notre mort. Amen. »"},{"b":"text","l":"3 mai — Fête de la Sainte Croix","t":"Journée dédiée à la Sainte Croix."},{"b":"text","l":"31 mai — La Visitation","t":"Marie = Nouvelle Arche d'Alliance. Marie dit : « Mon âme exalte le Seigneur, exulte mon Esprit en Dieu, Mon Sauveur ; Il s'est penché sur son humble servante... » Cette visite à Elizabeth renvoie à l'arrivée de l'Arche d'Alliance à Jérusalem sous le Roi David. Désormais Dieu habite notre humanité : « Le Verbe s'est fait chair et Il a habité parmi nous. »"},{"b":"text","l":"Note sur la Visitation (Luc 1, 39-56)","t":"Le voyage de Marie suit celui de l'Arche d'Alliance, dans les collines de Judée : Marie est la Nouvelle Arche, elle porte la présence de Dieu. Dans le Magnificat, presque chaque phrase reprend des psaumes. Double leçon : l'humilité (Marie reprend simplement la prière de son peuple) et le sens communautaire (le croyant n'oublie jamais qu'il fait partie d'un peuple)."}]},{"date":"14 mai","month":"Mai","type":"litu","title":"L'Ascension","sub":"40 jours après Pâques · Expansion de l'Âme Divine","content":[{"b":"text","l":"Ce que c'est","t":"La montée au Ciel intervient 40 jours après la résurrection de Jésus-Christ. Fête cardinale qui a lieu 40 jours après Pâques. C'est : l'expansion de son Âme Divine, sortir de son ego pour être illimité, laisser agir son Âme Divine à notre place.\n\nÀ l'Ascension, nous sommes aspirés à la Pentecôte. C'est l'expansion, c'est aller vers les autres, c'est transmettre."},{"b":"hi","t":"Ce chiffre 40 clôt le grand cycle : Carême (40 avant Pâques) → Pâques → Ascension (40 après Pâques). La mort = une porte."},{"b":"text","l":"Les Rogations — le « carême du loup »","t":"Fête cardinale qui a lieu le jeudi de la 5ème semaine après Pâques, soit 40 jours après Pâques. Elle tombe obligatoirement un jeudi. Elle se situe entre le 30 avril et le 3 juin.\n\nLes lundi, mardi et mercredi qui précèdent l'Ascension s'appellent les « Rogations ». Ce sont trois jours de processions avec chants, litanies et prières et d'abstinence. On les appelle aussi « le carême du loup ».\n\nL'Ascension est, avec Noël, l'Assomption et la Toussaint, une des quatre solennités liturgiques reconnues officiellement par l'État républicain.\n\nL'Ascension, c'est : l'Élévation de Jésus-Christ — les hommes sont appelés à rejoindre Dieu et à vivre dans la Gloire Céleste ; l'achèvement de la présence de Dieu sur terre mais Il est en chaque être humain et en tout lieu (cf. Matthieu : « Je suis avec vous jusqu'à la fin du monde ») ; rejoindre en soi la présence de Dieu, universelle et éternelle ; l'expansion de son Âme Divine ; la libération."},{"b":"pratique","l":"Questions et Actions de l'Ascension","items":["QUESTIONS — Où grimpe-t-on ? Où en êtes-vous dans votre recherche personnelle ?","Est-ce que vous montez ou vous vous enfermez ? Où en êtes-vous dans votre propre libération ?","Osez-vous être ? Quelle est la part de prison que vous créez chaque jour ?","Avez-vous un esprit de sécurité ou d'abondance ? Croyez-vous réellement à une Force qui est en vous ?","ACTIONS — Se libérer de ses peurs · Oser · Ne pas s'occuper des échecs","S'élever, donc échapper à son ego · Être aspiré vers le haut","Prendre de la hauteur vis-à-vis de chaque situation","Travailler la Force Supérieure en vous, celle qui agit en vous et à votre place","Laisser agir son Âme Divine à notre place · Aller vers les autres · Transmettre"]},{"b":"quote","t":"Le thème de l'Ascension est peu évoqué dans le Nouveau Testament : les Actes des Apôtres relatent l'Ascension de Jésus (1,9-11) ; l'Évangile de Jean y fait allusion : « Je monte vers mon Père » (20,17) ; l'Épître aux Éphésiens : « En le faisant asseoir à sa droite dans les régions célestes » (1,20) ; l'Épître aux Philippiens (2,9) : « Dieu l'a souverainement exalté » ; l'Épître aux Colossiens (3,1) : « Regardez les choses d'en haut, où le Christ est assis à la droite de Dieu ».\n\nFranz Bardon : « En effet, sans la connaissance de soi, il n'est pas d'ascension véritable. »\n\nLa descente de l'âme dans la matière préfigure l'ascension spirituelle. Cela est valable pour toutes les âmes incarnées."},{"b":"text","l":"L'Arc-en-ciel — lien entre le ciel et la terre","t":"À l'Ascension : tout votre être est dès la naissance (et même avant) un magnifique et harmonieux arc-en-ciel. Ensuite, cette harmonie tend à disparaître mais la Grâce Divine et la Magie peuvent réharmoniser le mieux possible vos couleurs intérieures.\n\nL'Arc-en-ciel : 7 couleurs. C'est un lien puissant qui relie le ciel et la terre. C'est le retour de la lumière après la tristesse de la pluie. Il part d'un point et finit vers un autre point en décrivant un arc parfait.\n\nIl ne se produit que si le soleil se situe entre 42 et 54° de hauteur. La décomposition résulte de la réflexion et de la réfraction des rayons solaires à travers les gouttes de pluie qui se comportent comme des milliards de prismes minuscules. On retrouve : le soleil (feu – plexus – Divine Providence – Tiphereth) et l'Eau (la Vie).\n\nConseil de Serge : chaque fois que vous voyez un arc-en-ciel, réjouissez-vous et rendez grâce à Divine Providence. Grâce à l'Arc-en-Ciel, vous pouvez être votre propre héros, le héros de votre vie."},{"b":"text","l":"Les Sept Lumières du Christ-Soleil","t":"Le livre du Zohar glorifie ces Sept Lumières : « Sept Lumières il y a dans le Très-Haut et c'est là qu'habite l'Ancien des Anciens, le mystérieux des mystérieux, le caché des cachés : Ain-Soph. »\n\nLes Sept Lumières sont : Rouge, Orange, Jaune, Verte, Bleue, Indigo, Violette. Traversant le prisme qui est 3, la lumière qui est une devient 7. Comme le prisme qui est 3, l'humain est la Trinité : son intellect, son cœur, sa volonté.\n\n— La Lumière rouge est la Lumière de vie (mais le rouge moins brillant signifie sensualité, colère)\n— La Lumière jaune ou or est l'Esprit de Sagesse\n— La Lumière verte est l'Esprit d'Éternité et d'Évolution, couleur de l'espérance\n— La Lumière bleue est l'Esprit de Vérité, liée à la religion, la paix, la musique\n— La Lumière indigo est l'Esprit de Force, l'Esprit de la Royauté\n— La Lumière violette est l'Esprit de la toute Puissance Divine, de l'amour spirituel, de l'Esprit du Sacrifice\n\nDéveloppez votre intellect, votre cœur, votre volonté par la Lumière du Christ-Soleil et vous posséderez les sept couleurs. La Lumière du Christ-Soleil commande notre Univers et notre monde."}]},{"date":"24 mai","month":"Mai","type":"litu","title":"Pentecôte","sub":"50 jours après Pâques · Descente du Saint-Esprit · Concrétisation","content":[{"b":"text","l":"Ce que c'est","t":"Fête qui a lieu 10 jours après l'Ascension. 50 jours après Pâques. Descente de l'Esprit Saint sur les Apôtres. Naissance de l'Église. « L'Esprit-Saint descend sur les Apôtres ». C'est Dieu qui descend sur vous pour agir à votre place. C'est le jour où les Apôtres sont pénétrés par l'Esprit-Saint. La Pentecôte est un moment très puissant car c'est vraiment, grâce à l'Esprit Saint, la période de concrétisation."},{"b":"text","l":"Le Lundi de Pentecôte","t":"Jour dédié à Vierge Marie."},{"b":"text","l":"La Fête de la Sainte Trinité","t":"La Fête de la Sainte Trinité a lieu le dimanche suivant la Pentecôte. La Sainte Trinité : « Dieu, trois fois Unique »"},{"b":"quote","t":"« Fortifie-nous avec son corps et son sang, remplis-nous de son Esprit-Saint pour que nous soyons un seul cœur et une seule âme dans le Christ. »"},{"b":"text","l":"La Pentecôte — Fête du don de l'Esprit","t":"Fête qui a lieu 10 jours après l'Ascension et 50 jours après Pâques (temps pendant lequel la résurrection de Jésus était restée confidentielle). Elle se situe entre le 10 mai et le 13 juin.\n\nJuive, elle commémore la remise des Tables de la Loi à Moïse sur le mont Sinaï. Chrétienne, elle célèbre la descente du Saint-Esprit sur les apôtres et clôt la période pascale.\n\nL'amour du Père + l'Amour du Fils = le Saint Esprit. C'est un moment très puissant car c'est vraiment, grâce à l'Esprit Saint, la période de concrétisation.\n\nSignes = Vent – langues de feu – huile – colombe. On reçoit la Force de l'Esprit Saint.\n\nLa Pentecôte, c'est : le jour où l'Esprit-Saint descend sur les Apôtres ; Dieu qui descend sur vous pour agir à votre place ; la fête de l'accomplissement du projet de Dieu ; la fête du don de l'amour — l'Esprit de Dieu, c'est l'Amour personnifié ; la Fête du don de soi. Chacun s'exprime selon le don de l'Esprit et doit trouver sa juste place. Vous êtes tous indispensables à ce grand corps du Christ."},{"b":"text","l":"Pour les Initiés — la situation d'avant la Tour de Babel","t":"C'est le jour où les Apôtres sont pénétrés par l'Esprit-Saint, cela tout le monde le sait. Initiatiquement, à ce moment-là, les Apôtres se retrouvent dans la situation d'avant la Tour de Babel. Ils parlent de nouveau le Verbe, le Un, l'Unique Langage qu'un jour, tous, nous reparlerons.\n\nLe Saint Esprit est une manifestation de Dieu ; on ne peut pas différencier Dieu du Saint Esprit.\n\nLuc se réfère à 3 textes de l'Ancien Testament : le mont Sinaï avec Moïse (le Seigneur descend sous forme de fumée), la Parole du Prophète Joël, la Tour de Babel (Dieu intervient pour épargner l'humanité de la pensée unique).\n\nMessage : la véritable unité de l'amour ne peut se trouver que dans la diversité. Objectif de la Pentecôte : « Qu'ils soient un pour que le monde croit ». Son commandement : « Si vous êtes des fils de Dieu, aimez-vous les uns les autres comme je vous ai aimés. » Votre vrai bonheur : se laisser modeler chaque jour par l'amour de Dieu, à Son Image."},{"b":"serge","t":"Note de Serge sur la Force, don de l'Esprit Saint :\n\nLa Force est la vertu morale qui assure, dans les difficultés, la fermeté et la constance dans la poursuite du Bien. Elle affermit la résolution de résister aux tentations, de surmonter les obstacles dans la vie morale.\n\nLa vertu de la Force rend capable de vaincre la peur, même de la mort, d'affronter l'épreuve et les persécutions. Examinez le martyrologue à travers toute l'histoire : vous comprendrez que la Force n'est nullement proportionnelle à l'âge ou à la constitution physique. Combien d'enfants et de vieillards ont donné leur vie pour le Christ !\n\nMais un don s'étiole si on ne l'exerce pas. Il faut apprendre à affronter les difficultés ; ne pas oublier sa peur mais la vaincre, cela ne s'apprend que face à l'obstacle. On ne participe pas à un concours hippique avec un cheval qui n'a jamais franchi une barrière.\n\nLa Force consiste aussi à cohabiter avec sa peur. Le courage n'est pas d'ignorer la peur, mais de la vaincre."},{"b":"mantra","l":"Mantra de la Pentecôte (Séminaire 2000)","t":"« Merci Christ d'avoir fait descendre l'Esprit Saint sur chaque être humain, qu'il soit incarné ou désincarné et sur nous-même. »\n\n« Merci d'avoir transmis l'Esprit Saint dans chaque être humain et dans moi-même. »"},{"b":"serge","t":"Chacun est une fille et un fils unique de Dieu. Que vous receviez l'Esprit Saint comme les Apôtres l'ont reçu, car ce qui a été déjà accompli sur un être humain peut s'accomplir sur d'autres êtres humains.\n\nJésus-Christ a ouvert la voie... sur le chemin, tout ce qu'il a vécu, nous pouvons le vivre. Si vous n'avez pas la conscience de l'Instant Présent, vous passez à côté de ce que vous vivez.\n\nJe suis ouvert, je reçois l'Esprit Saint. C'est ça la bonne attitude. Et l'Esprit Saint circule partout où Il doit aller ; on n'a pas la prétention de garder l'Esprit Saint, Il va où Il doit aller.\n\nC'est la façon dont vous connaissez la chose et que vous vivez la chose qui fait la différence. Cela s'appelle la conscience."},{"b":"serge","t":"Note de Serge (séminaire 2000) : Jésus-Christ a ouvert la voie ; ce qu'Il a vécu, nous pouvons le vivre. Christ vous offre la même expérience qu'aux Apôtres : vous recevez l'Esprit Saint comme eux. Étudiez leur expérience mystique, puis recevez en conscience : « Je suis ouvert, je reçois l'Esprit Saint comme les Apôtres l'ont reçu. »"}]},{"month":"Mai","date":"31 mai","type":"litu","title":"La Sainte Trinité","sub":"Dimanche qui suit la Pentecôte · Dieu Unique en trois personnes","content":[{"b":"text","l":"Une tentative de définition de Dieu","t":"Fête chrétienne mobile, célébrée le dimanche qui suit la Pentecôte, soit le 8ème dimanche après Pâques. On célèbre ce jour le Dieu Unique en trois personnes.\n\nLa Sainte Trinité est une tentative de définition de Dieu, avec le danger de vouloir définir Dieu qui est au-delà de toute capacité intellectuelle humaine.\n\nHermétisme — Livre XI, Sloca 265 dans le Karanany-Yoga : « La sainte syllabe primitive composée des trois lettres A.U.M. dans laquelle la triade védique est comprise doit être gardée secrète. » Ceci environ 12 000 ans avant l'ère chrétienne.\n\nLes Anciens Égyptiens ont fait de la Trinité leur dogme le plus important, avec celui de la transmigration des âmes : le Tibet, la Chine, le Japon l'ont reçu de Bouddha ; la Perse tenait cette croyance de Zoroastre ; de même les Druides gaulois ; Pythagore en fera la base de son enseignement ; Socrate, Platon spéculant dessus. Il faut attendre le Concile de Nicée pour que cette croyance soit condamnée, ce qui ne l'empêche pas d'exister.\n\nMarie, la Vierge est l'ensemble des Trois. Elle est : Fille du Père, Mère du Fils, Épouse du Saint-Esprit."},{"b":"serge","t":"L'Initiation est le chemin le plus efficace qui permet à votre âme de mieux s'épanouir en vous.\n\nAvec elle, vous quitterez votre trinité inférieure : Penser – Sentir – Agir, pour vous élever vers votre Trinité Supérieure : Connaissance – Amour – Puissance.\n\nLa trinité ordinaire n'est qu'un reflet de la Trinité Supérieure, un bien pâle reflet. Vous n'avez aucun intérêt à fusionner avec cette trinité mais TOUT à attendre de la fusion avec votre Trinité Supérieure.\n\nDans la Trinité, seul le Père a un rôle immuable qui ne changera jamais : Il est le Créateur. Le Fils est Amour et aussi Sagesse. Le Saint-Esprit est Sagesse et aussi Amour. Pour ma part, j'ai adopté cette définition de la Trinité :\n\nL'Amour du Père + l'Amour du Fils = le Saint-Esprit."},{"b":"mantra","l":"Mantra du dimanche — face à l'Est, le matin ou à midi","t":"« Sainte Trinité de la Sphère bénie de Tiphereth rentre en moi. »\n\nVous renforcerez et illuminerez le soleil de votre Plexus Solaire.\n\nLa Sphère Bénie de Tiphereth comprend, en Elle, la Trinité : Père-Fils et Saint Esprit. Que serait la Terre sans le soleil ? Le centre de notre univers c'est le soleil, divin, puissant, nourrissant, généreux, protecteur, guérisseur et multiplicateur."},{"b":"text","l":"Les Trinités du monde","t":"Quelle est la Trinité hindoue ? Brahma, Vishnou, Shiva. Brahma est dans le plexus solaire ; Vishnou, dans le cœur ; Shiva dans le cerveau (parce qu'il est le destructeur de la réalité).\n\nQuelle est la Trinité du Soufisme ? Jabarût, Malakût, Mulk — soit : Omnipotence, Royauté, Royaume. L'Omnipotence étant l'Amour divin.\n\nKether – Hochmah – Binah : ce sont les Trois Séphiroths de la Trinité Supérieure de l'Arbre de Vie.\n\nLe symbole de la Haute Égypte, c'est la pyramide. Le haut de la pyramide = le nombre 3, Trinité = amour – sagesse – vérité. Sa base enfoncée dans la Terre = le nombre 4. La Trinité qui est le UN crée le 4 avec les quatre principes : Cœur – Intellect – âme – esprit. La pyramide deviendra plus tard la croix, c'est aussi simple que cela."},{"b":"text","l":"Le Saint-Esprit, la Divine Mère et le nombre parfait","t":"Le Saint-Esprit est directement lié à la Divine Mère, ce qui expliquerait cette interprétation ésotérique : l'humanité a vécu en premier l'âge du PÈRE (époque de Moïse et des prophètes de l'Ancien Testament) ; ensuite avec la venue de Jésus, celui du Fils ; maintenant, ce serait celui du Saint Esprit.\n\nSi le Saint-Esprit fait partie d'une famille Père, Fils, Saint-Esprit, il manquerait une part féminine ; toute famille humaine est composée du nombre 4, comme le Nom de Dieu est composé de 4 lettres. Ces 4 lettres correspondent à une division quaternaire retrouvable dans l'existence humaine et dans les cycles de la nature.\n\nPour l'initié Pythagore, le quaternaire (Tétraktys) était une figure sacrée qui lui expliquait les mystères de l'univers. Donc le Saint-Esprit est 3 et 4 à la fois. Dieu est 1 et 4 à la fois : 1 en haut, 4 en bas. Pour Pythagore, le 4 était assimilé au 10 (1+2+3+4=10).\n\nLe 10 est le nombre parfait car il est composé du 1, principe masculin et du 0, principe féminin."}]},{"date":"Fête des Mères","month":"Mai","type":"litu","title":"Fête des Mères","sub":"Mantra de Serge","content":[{"b":"mantra","l":"Mantra donné par Serge pour la Fête des Mères","t":"« En Vierge Marie, Bonheur et Fête à toutes les mamans du monde. »"}]}];
var D_JUIN=[{"date":"Juin","month":"Juin","type":"mois","title":"Mois de Juin — CLARTÉ · ENTHOUSIASME · JOIE","sub":"Mois SIX = JOIE · Archange Ouriel · Cycle matériel culmine","content":[{"b":"eileen","t":"« Utilise de plus en plus l'huile de l'amour, car c'est l'amour qui facilite les choses ! C'est l'amour qui trouvera toujours un chemin. Ouvre ton cœur et laisse l'amour couler librement. »\n\nImage : Une grosse et lourde porte très difficile à ouvrir car les gonds étaient rouillés. Puis, je vis que l'on mettait quelques gouttes d'huile sur les gonds et qu'on manœuvrait doucement la porte jusqu'à ce qu'elle puisse être ouverte par une simple pression du doigt.\n\nD'où : Ouverture sur la Nature, la Lumière. Goutte d'huile = goutte d'amour — Ouvrir son cœur et laisser l'amour couler."},{"b":"text","l":"JUIN doit son nom à Junius Brutus","t":"JUIN : Mois SIX = JOIE. Tout autour de vous invite à la Joie et à l'expansion. Les journées atteignent leur durée maximum.\n\nLe seul mot que l'on découvre : « UNI » ou « NUI ». Soit le « JU » unit, soit en prenant la dernière lettre « N », la haine divise. Attention de ne pas semer la division ! Comment échapper à la division intérieure ? Amour, Paix, Sérénité Divine et Christique. Fermeté : capacité de dire « non » à soi-même ou aux autres."},{"b":"text","l":"Archange OURIEL","t":"C'est l'Archange Ouriel qui gouverne cette période où la nature est en feu. Son nom signifie : DIEU EST MA LUMIÈRE. Ouriel est l'Archange de la Sphère de MALKUT, la Terre. À ce titre, il communique avec le Feu de la Planète, le feu intérieur. Cet Archange dirige des Anges spécialisés dans le travail des métaux et des pierres précieuses. Début du signe du Cancer. Planète : Vénus."},{"b":"text","l":"JUIN, c'est le Mois","t":"— Des jours les plus longs\n— Des roses\n— De la fauchaison et de la fenaison\n— De la clarté par excellence : il permet d'éclaircir et de recevoir des informations, pour y voir clair dans sa vie\n— Du début de l'Été et de ses embrasements\n— De maturation et de flânerie"},{"b":"pratique","l":"ACTIONS","items":["Découvrir les secrets de la Nature qui est au summum de son expansion","Exercer son libre-arbitre","Faire le point","Récolter ce que vous avez semé","Faire le tri à l'intérieur de soi par rapport à l'entraide","Ne pas remettre à demain ce que l'on peut faire le jour même"]},{"b":"text","l":"ATTITUDES","t":"— Être joyeux\n— Se laisser porter"},{"b":"text","l":"QUESTIONS","t":"— Qu'avez-vous fait depuis le début de l'année ?\n— Dans quel état d'esprit vivez-vous chaque jour en conscience ?\n— Qu'avez-vous fait des chances que vous avez reçues ?"},{"b":"text","l":"MOTS-CLÉS","t":"Clarté · Enthousiasme"},{"b":"text","l":"DICTON","t":"« En juin, n'en fais pas un foin, sois coquin. » / « En juin, de l'Esprit Saint, tu prendras soin. »\n\nProfitez du mois de juin pour écarter les négativités, l'Esprit Saint permet d'avoir une clarté mentale et de voir les choses que l'on doit lâcher. En juin, l'Esprit Saint c'est le feu qui ouvre à la Sagesse."},{"b":"serge","t":"Révélation de Serge sur la santé et le bonheur : Aujourd'hui, beaucoup de jeunes ont de l'enthousiasme et ne réussissent pas. Parce qu'un déséquilibre s'est créé avec le surplus de Feu. Le Feu donne une fausse volonté.\n\nVotre enthousiasme doit passer par la Paix et la Tranquillité. Enthousiasme + Paix + Tranquillité = volonté et réussite."},{"b":"mantra","l":"Mantra de rééquilibrage (à dire TOUS les jours)","t":"« Paix et Tranquillité »"},{"b":"serge","t":"Réflexion du Mois de Juin :\n\nQuand l'humain choisit de vivre, en lui, le bonheur, il vit, sans pouvoir l'expliquer, une sensation de liberté. Quand il vit dans le malaise, il se sent prisonnier. L'humain est donc totalement libre de ses choix. Sans liberté, il n'y a pas de choix.\n\nQu'avez-vous choisi ?\n\nLe Bonheur que vous cherchez n'est pas dans l'autre ou dans la possession, mais Uniquement en Vous ! Vous en serez mille fois plus heureux.\n\n« Votre Vie, c'est ce qu'il vous reste à vivre, alors faites le compte... » Réfléchissez à ce que vous allez mettre en place dès cet instant. Luttez pour vivre avec intensité. Pensez et agissez différemment des autres et vous serez libre ! Prenez le temps de la réflexion et saisissez votre chance à tout moment. Tous les jours, vous recevez cette fabuleuse Énergie. Alors pourquoi ne la voit-on pas ? Pourquoi vous échappe-t-elle ? À vous de trouver les réponses et de dire « Plus jamais cela ! »"},{"b":"text","l":"Jean-Baptiste — naissance miraculeuse","t":"Zacharie est prêtre du groupe Abia. Sa mère Élisabeth est descendante du grand prêtre Aaron. Tous deux sont « Justes » au regard de Dieu mais n'ont pas d'enfants. Un jour, Zacharie entre dans le Sanctuaire du Temple. L'Ange Gabriel lui apparaît et annonce la naissance d'un fils nommé Jean. Zacharie doute — l'Ange le rend muet jusqu'à la naissance.\n\nLors de la circoncision, l'assistance veut appeler le bébé Zacharie. Élisabeth prend la parole : « Il s'appellera Jean ». Zacharie écrit sur une tablette : « Jean est son nom » — et aussitôt retrouve la parole.\n\nDouble création comme pour Adam : l'identité de Jean lui vient de Dieu, puis de la mère. Jean-le-Baptiste : dernier grand personnage de l'Ancien Testament et premier du Nouveau. Pont entre deux temps, deux testaments, porteur d'un espoir à venir : Christ ! Tel Moïse, il n'entrera pas en Terre Promise."},{"b":"text","l":"Jean révèle Jésus par quatre fois","t":"1) La Visitation : l'enfant remue de joie dans le ventre d'Élisabeth — « Qui suis-je pour que la mère de mon Seigneur vienne chez moi ? » (Luc 1,41-45). 2) Au baptême dans le Jourdain : l'Esprit Saint descend comme une colombe — « Tu es mon fils bien-aimé » (Marc 1,9-10). 3) La Transfiguration sur le Mont Thabor — mêmes mots. 4) À la mort sur la Croix — acte de foi du centurion : « Vraiment cet homme était le Fils de Dieu ».\n\nEn réalité, une seule et même annonce faite par l'Esprit Saint, dont Jean est le héraut. Il sera mort avant la Nouvelle Alliance, offert en sacrifice pour la danse d'une fille perverse. La décapitation racontée par Matthieu au chapitre 14 : après avoir appris cette triste nouvelle, Jésus, en barque, se retire dans un lieu désert. A-t-il pleuré son cousin Jean comme il a pleuré Lazare ?"},{"b":"eileen","t":"Petite Voix du 30 mai que Serge invite à méditer en Juin : « Rien n'est le fruit du hasard. Il y a un dessein et un plan parfaits sous-jacents à toute vie, et tu fais partie de cette globalité ; tu fais donc partie de ce dessein et de ce plan parfait.\n\nLorsque tu vois d'étranges choses se passer et que tu te demandes pourquoi elles t'arrivent, prend du temps pour voir comment tout cela s'articule, et tu verras qu'il y a une raison à toute chose.\n\nLa vie devrait se dérouler sans effort. Une fleur ne lutte pas pour s'épanouir au soleil, alors pourquoi devrais-tu lutter pour t'épanouir par la grâce de Mon amour infini ? Si c'est le cas, cela vient de toi, et cela ne fait pas partie de mon dessein et plan parfaits pour toi.\n\nLa simplicité est Mon sceau, alors garde la vie simple. Reste sans cesse en contact avec Moi et regarde-toi te déployer dans Mon amour. »"},{"b":"serge","t":"Note sur Jean-le-Baptiste (Lettre de février 2015) : Jean-le-Baptiste, lui aussi vêtu de peaux de bêtes, tels Adam et Ève chassés du Paradis. Mais lui baptise dans le Jourdain, purifie les âmes et les esprits. Il prêche aux puissants et au peuple un baptême de pénitence. Il actualise les mots du prophète Isaïe : « Préparez les chemins du Seigneur... et tout le monde verra le salut accordé par Dieu. »\n\nLe monde entier entre dans un temps nouveau, celui du Salut. Temps béni de la Réconciliation éternelle entre Dieu et l'humain."}]},{"date":"14-21 juin","month":"Juin","type":"cosm","title":"SAS des 7 jours — Préparation au Solstice d'Été","sub":"14 au 21 juin · Déstructuration des Éléments","content":[{"b":"pratique","l":"Phrase du 14 juin — Éphéméride intemporel","items":["« Créez votre Paradis sur la Terre »"]},{"b":"hi","t":"Se référer au chapitre SAS Cosmiques pour le protocole complet. Ces 7 jours précèdent la fête de la Saint Jean et le Solstice d'Été."}]},{"date":"21 juin","month":"Juin","type":"cosm","title":"Solstice d'Été — Fête du Feu · Saint Jean","sub":"Point culminant du cycle matériel · Nuit la plus puissante","content":[{"b":"text","l":"Le Solstice d'Été","t":"Le 21 juin est le point culminant du premier cycle « matériel » de l'année. Cette date marque le début de l'été pour ceux qui vivent dans l'Hémisphère Nord. Le soleil brille intensément, les Énergies en activité sont orientées vers des résultats d'ordre matériel. La Tradition veut que l'on allume un feu afin que les Entités œuvrant sur le Plan Astral captent le message ou désir de chaque participant et le réalisent, si cela est permis par le Karma du demandeur."},{"b":"text","l":"Archange Ouriel — DIEU EST MA LUMIÈRE","t":"L'ARCHANGE OURIEL gouverne cette date où la nature est en feu, l'été avec ses embrasements. La fête de Saint Jean est célébrée au moment où le soleil entre en Cancer, signe dominé par Vénus. Ce n'est pas un hasard, croyez-le bien."},{"b":"text","l":"La nuit de la Saint Jean est très importante","t":"Cette nuit-là, les ténèbres reculent fortement, même en vous si vous le désirez. Les conditions cosmiques idéales sont réunies afin de vous permettre d'évoluer. Ne laissez pas passer cette chance ! Liez amitié avec Ouriel et cet Archange du Feu va tout sublimer en vous. Tous vos Nadis seront épurés si vous vous ouvrez consciemment aux merveilleux courants de Lumière que le ciel vous envoie. Faites des vœux pour les autres et également pour vous. Dites-vous bien : Dieu sait exactement ce qu'il vous faut."},{"b":"text","l":"À propos du 24 Juin","t":"Durant le mois de juin, le 24 juin, avez-vous pensé à Jean-le-Baptiste, jour où le soleil est au plus haut dans le ciel ? « Il faut qu'il croisse pour que je diminue. » Ce jour est le dernier de l'ascension solaire et le premier de la partie descendante."},{"b":"text","l":"Un des secrets du 21","t":"Le 12. Les 12 apôtres : les forces du mal font l'inverse. Donc il se passe des choses dont vous n'avez pas la moindre idée, le 21. La Magie, c'est le même monde mais vu d'une manière différente, vécu différemment."},{"b":"danger","t":"**Ce jour du 21 Juin**, les confréries démoniaques ou « Loges noires » utilisent certaines forces de l'Univers dans un autre but que l'Évolution et sont très actives. L'activité Cosmique des Forces étant essentiellement matérielle, ces confréries vont utiliser ces courants pour renforcer l'aspect matériel, inconscient et involutif de notre planète. Ce centre occulte noir perdra toute sa puissance provisoire ; il sera détruit par l'Anneau désintégrateur de la Terre, « celui que l'on ne passe pas... »"},{"b":"pratique","l":"Protocole du Rituel du 24 juin — Feu de la Saint Jean","items":["État d'esprit : JOYEUX","Soit faire un feu, soit allumer une bougie (laisser le feu s'éteindre naturellement)","Lieu propre et organisé, toutes les conditions de sécurité réunies","Préparez une bougie blanche et des allumettes","Une feuille de papier blanche sur laquelle écrire votre vœu","Prenez une douche","Offrez cette fête à Divine Providence","Placez la bougie face à l'Est — allumée toute la nuit. Bénissez-la","Écrivez sur une page blanche un vœu en y pensant fortement (vœu matériel — par ex : se débarrasser d'un défaut)","Installez-vous face à l'Est, assis confortablement ou debout, yeux ouverts, bras et jambes décroisés, bougie ou feu DEVANT vous"]},{"b":"mantra","l":"Mantra du Rituel Saint Jean","t":"« En Christ, je suis l'Amour et la Pureté du Feu de la Saint Jean. »"},{"b":"mantra","l":"Après avoir brûlé votre vœu écrit","t":"« En Christ, je rends grâce à Saint Jean d'avoir réalisé mon vœu dans la matière. »"},{"b":"pratique","l":"Règle de base pour votre vœu","items":["Vous demandez d'abord pour les autres et ensuite seulement pour vous","De nombreuses personnes ne réussissent pas dans la vie car elles ne demandent pas suffisamment pour les autres de peur de manquer","Il faut oser passer cette barrière","Boire un grand verre d'eau. Rendre grâce"]}]}];
var D_JUILLET=[{"date":"Juillet","month":"Juillet","type":"mois","title":"Mois de Juillet — LIBERTÉ · Densité · Maturation","sub":"Mois SEPT · Signe Cancer · Planète Lune · « Le jus y est »","content":[{"b":"eileen","t":"« Lorsque tu es à ta place et que tu joues ton rôle particulier, il ne peut y avoir aucun conflit et mon plan peut se déployer en une véritable perfection. »\n\nImage : Un puzzle éparpillé sur toute la surface d'une table où chaque pièce se met à sa juste place."},{"b":"text","l":"JUILLET, c'est une période de","t":"— Pleine densité. Plus la densité se fait, plus les gens rentrent dans les illusions (amour de vacances, etc.) et en septembre et octobre, tout disparaît\n— Maturation\n— Flânerie\n— Récolte\n\nJuillet : « le jus y est » — formule donnée par Serge lors d'un séminaire. La Nature est arrivée à maturation et va donner le « jus » dont nous avons besoin."},{"b":"pratique","l":"ACTIONS","items":["Laisser tout passé, peur ou incertitude","Avoir la foi","Vivre chaque moment pleinement","Réaliser l'Unité avec Divine Providence, créateur de la Vie","Faire le point"]},{"b":"text","l":"ATTITUDE","t":"— Se laisser porter\n— Savoir que vous êtes éternellement vivant en Christ\n— Être un petit enfant libre et joyeux"},{"b":"text","l":"QUESTIONS","t":"— Votre puissance spirituelle est-elle assez forte pour arrêter l'illusion de l'été ?"},{"b":"text","l":"CONSEILS","t":"— Avoir un état d'esprit de Paix - tranquillité - sérénité\n— Ce n'est pas le moment de faire des projets. Tout se nettoie."},{"b":"text","l":"MOT-CLÉ","t":"Liberté\n\nRéflexion du Mois : Jouez toujours avec les situations extérieures ; croyez-moi, vous pouvez, en ce domaine, faire mieux... Ce jeu permet d'explorer de nouvelles situations, de découvrir de nouvelles données, bien mieux qu'en étant stressé."},{"b":"text","l":"Le Nombre 7 — Juillet est le 7ème mois","t":"Étymologie : Latin : septem / Grec : Hepta. En Kabbale (Franz Bardon) : 7 est le Nombre de l'harmonie, de la fécondité, de la multiplication des espèces, de la croissance. 7 est également l'amour sous toutes ses formes.\n\nLe Nombre 7 est lié à : la clémence, la bonté, la vertu et la joie / la pureté et l'harmonie / Netzach-Vénus, donc à toutes les Magies vénusiennes / au premier nombre du chiffre 79 (l'Or). L'Or : 7 + 9 = 16 = 1+6 = 7.\n\n« 7 » est un chiffre sacré par excellence partout sur la planète :\n— 7 ans : âge de raison\n— Périodes lunaires de 7 jours, soit 4×7 = 28 jours, cycle lunaire\n— 7 jours dans une semaine\n— La Création s'est achevée en 7 jours\n— Le mot « semaine » vient du latin « septimana »\n— La Fête des Saturnales durait 7 jours\n— 7 fois 7 jours du dimanche précédant le Mardi Gras jusqu'à Pâques\n— 7 fois 7 jours de Pâques à Pentecôte\n\n7 renferme les éléments indispensables à la vie : 4 (les 4 Éléments) + 3 (les 3 astres : Terre-Soleil-Lune)\n\nLes 7 portes de l'Homme : deux yeux, deux oreilles, deux narines, une bouche."}]},{"date":"8 juil","month":"Juillet","type":"ense","title":"8 Juillet — Page de la Petite Voix décodée par Serge","sub":"En 452 : Le Pape Léon le Grand arrête les Huns devant Rome","content":[{"b":"eileen","t":"« Commence la journée de la bonne façon, dans l'Unité avec Moi. Alors rien en pourra te déséquilibrer au cours de cette journée. Au début, lorsque tu commences à vivre cette vie spirituelle, tu dois faire un effort conscient pour réharmoniser, mais au fur et à mesure que tu la vis de plus en plus et qu'elle devient partie de toi, elle ne demande plus d'effort et tu vis d'une telle manière qu'elle est toi.\n\nTu trouves une grande joie et une grande liberté. Tu n'as pas à passer la moitié de ton temps en prière à rechercher le pardon, à avoir peur de faire ce qu'il ne faut pas, ou inquiet au cas où tu serais sur le mauvais chemin et irais à contre-courant.\n\nLorsque tu fais des erreurs, tu acceptes le pardon, tout de suite et tu es déterminé à ne pas refaire les mêmes erreurs. Tu avances jusqu'à ce que vivre de cette façon cesse de constituer un effort et devienne une vraie joie. Et tu sais ce que c'est de faire un avec Moi et d'être parfaitement en paix ! »"},{"b":"serge","t":"Vos croyances vous tiennent. Est-ce que vous voyez la différence ? Vous êtes incapable de vous arrêter de prier pendant un mois. Vous avez réussi l'exploit d'être prisonnier de Dieu. Prenez de la distance avec tout.\n\nSerge a eu l'idée de dire : ce que je crois n'existe pas. Je vais sortir de ma croyance avec des mots nouveaux pour explorer de nouvelles pistes."},{"b":"eileen","t":"Page du 16 Juillet décodée par Serge : « Beaucoup d'âmes cherchent une réponse à tout le chaos et toute la confusion du monde à notre époque. Jour après jour, il empire, mais n'aie pas peur, car les choses devront empirer avant de s'améliorer.\n\nUn abcès mûrit avant d'éclater et puis, tout le poison est libéré et nettoyé. Les choses doivent mûrir dans le monde avant que les poisons de la haine, de la convoitise, de la jalousie et de l'égoïsme soient libérés et que la guérison puisse se faire.\n\nJ'ai besoin de toi dans une paix intérieure parfaite. Tu la trouveras si tu laisses ton mental reposer en Moi et si tu peux élever ta conscience, ne voyant que le meilleur. Tu ne peux pas améliorer la situation dans laquelle se trouve le monde si tu acceptes de plonger dedans. Tu dois être immunisé contre la maladie ou, toi aussi, tu la contracteras, et alors tu ne seras d'aucune aide. J'ai besoin de toi libre. J'ai besoin que tu sois parfaitement en paix. Alors, Je peux t'utiliser. »\n\nDécodage : Vous devez rester libre, vide dans votre tête pour être rempli de la Lumière Divine. La libération se fait dans votre tête. Faire la paix à l'intérieur, c'est amener plus de paix dans tout le monde. Rester libre pour que Dieu puisse agir à travers vous."},{"b":"hi","t":"En 452 : Le Pape Léon le Grand arrête les Huns devant Rome ! Il convainc Attila de ne pas envahir la Ville. D'où puissance du spirituel sur la matière."},{"b":"eileen","t":"Page du 4 Juillet décodée par Serge : « Bénis soient ceux qui ont faim et soif de justice car ils seront comblés.\n\nLorsque ton désir est assez fort, il sera comblé car tu chercheras et chercheras encore la réponse et ne seras pas satisfait tant que tu ne l'auras pas trouvée. Tu auras la détermination, la patience, la persévérance et la persistance pour mettre tout en œuvre jusqu'à ce que tu aies trouvé ce que tu cherches au long de ce chemin spirituel : la réalisation de ton Unité avec Moi.\n\nCela vaut la peine de surmonter tout obstacle pour atteindre le but, alors sois déterminé à trouver la manière de le faire. »\n\nDécodage : Tout désir qui prend sa graine en Dieu verra sa réalisation. Mais ta volonté mise dans un souhait est déterminante même celle de t'unifier à Dieu. Seuls les faibles se découragent et ainsi s'affaiblissent encore plus. Si tu as la foi, comment peux-tu croire une seconde que Dieu ne puisse t'aider ?"},{"b":"eileen","t":"Page du 12 Juillet décodée par Serge : « La beauté te transforme et t'inspire en ce qu'il y a de plus élevé et meilleur en toi ! Elle tire le meilleur de toi et t'unit avec le plus haut.\n\nLa beauté qui est en toi ne peut être contenue, alors laisse-la briller au-dehors. Emplis ton cœur et ton esprit de belles pensées et reflète-Moi, car JE SUIS beauté !\n\nCherche la beauté en tout et lorsque tu regarderas assez profondément et assez longtemps, tu la verras. L'amour et la beauté vont main dans la main, alors laisse Mon amour universel couler librement en toi et à travers toi apportant unité et unification. »"},{"b":"text","l":"27 juillet — Fête des Sept Dormants","t":"Cette fête célèbre sept jeunes chrétiens qui, selon la légende, s'endormirent dans une caverne pour fuir la persécution et se réveillèrent des siècles plus tard."},{"b":"serge","t":"Secret initiatique : Pourquoi tourner sa langue SEPT fois dans la bouche ?\n\nAu lieu de répondre, tournez RÉELLEMENT 7 fois votre langue dans la bouche et vous verrez que vous ne répondrez pas la même chose. Vous répondrez beaucoup plus sagement. C'est toujours magique et évident.\n\nVous avez une pensée que vous croyez cent pour cent bonne. Tournez votre langue 7 fois dans la bouche. Si elle reste, c'est qu'elle est bonne. La qualité de votre avenir dépend peut-être de cela.\n\nC'est un secret initiatique qui remonte à l'aube des temps. C'est la clé de la réussite à votre portée, que vous croyez ou non en Dieu. Bien sûr, il y a d'autres clés, mais c'est à la portée de n'importe qui, la clé la plus simple qui existe."}]}];
var D_AOUT=[{"date":"Août","month":"Août","type":"mois","title":"Mois d'Août — JOIE · LÉGÈRETÉ · Densité forte","sub":"Mois HUIT · Signe Lion · Planète Soleil · Élément FEU","content":[{"b":"eileen","t":"« Il y a un bon moment et une bonne saison pour tout. Ne remets jamais à demain ce que tu sais avoir à faire maintenant, mais coule avec le rythme de toute vie et soir parfaitement en paix. »\n\nImage : Un champ de maïs mûr prêt à être récolté."},{"b":"text","l":"Décodage de Serge","t":"— Faites les choses justes au moment juste\n— Inutile de vous agiter, de faire des efforts stériles alors qu'à l'intérieur de vous, vous possédez la force et la sagesse de vivre en paix et en rythme avec le flot de la Vie"},{"b":"text","l":"AOÛT, c'est le Mois","t":"— De la Vierge Marie avec la fête de l'Assomption le 15, au milieu du mois\n— De farniente par excellence, la nature paraît alanguie\n— De densité très forte, celui de l'illusion\n— Chargé de secrets puisque le 15 août est dans une période de grande densité\n— De la pré-rentrée\n— Des grandes marées, donc un afflux d'eau pour se nettoyer\n— De rencontres passionnées qui, en général, mourront avec le retour à la ville\n— Où, en Occident, on déclenchait les guerres, avant et pendant les récoltes"},{"b":"pratique","l":"ACTIONS","items":["À partir du 15 août, on entre dans la rentrée ; on remet de l'ordre, période pour changer les habitudes","Bien préparer la rentrée durant les 15 derniers jours d'Août","Restructurer, réorganiser l'emploi du temps pour un retour en septembre dans une ambiance différente"]},{"b":"text","l":"ATTITUDE","t":"Joie et Légèreté, surtout fin Août pour la rentrée.\n\nJoie : Feu qui brûle les scories. 1er Élément (Fiat Lux). Lumière qui éclaire. Force - Clarification des idées.\n\nLégèreté : Air, soit échange, bouffée d'oxygène. Élévation de la pensée et de la conscience. Il est partout où que nous soyons. Parachute. Silence.\n\nLes deux réunis = plus d'imagination, mais aussi complémentarité : l'air permet aux braises de s'envoler."},{"b":"text","l":"QUESTIONS de Août","t":"— Qu'avez-vous récolté cette année ? En plus et en moins.\n— Comment vous purifier réellement si vous ne pardonnez pas ?"},{"b":"serge","t":"Extrait de la lettre de Mai 2014 — Transfiguration et orientation :\n\nJésus vient de l'Orient. Ce qui explique que l'orient-ation soit d'une telle importance. Le langage positif, la recherche et la compréhension du symbole divin réorientent l'individu. La Transfiguration dépend d'une bonne orientation, ainsi que toute saine transmutation. Bien orienté, l'humain chargé de meilleures vibrations peut aider le monde. Le monde et les autres bénéficient toujours de vos changements positifs, comme la personne négative maléfie le monde et les autres. Il vous faut donc, un jour ou l'autre, choisir votre camp."},{"b":"text","l":"MOTS-CLÉS","t":"Joie · Légèreté\n\nRéflexion du Mois : Chacun en vous porte une personne supérieure. Joie et enthousiasme font d'un humain banal, un plus grand humain. Est-ce votre cas ?"},{"b":"text","l":"AOÛT et sa signification symbolique","t":"Mois HUIT — Mois aux trois voyelles : A-O-U. Le mois d'août est consacré à la déesse Cérès, déesse romaine de la Terre. Ce mois est dans la continuité symbolique du mois de juillet. Août, mois dédié à l'empereur Auguste, petit neveu de César.\n\nAfin de ne pas provoquer d'injustice entre eux, le mois de juillet et d'août comportent tous les deux 31 jours. Ce mois était considéré comme néfaste aux mariages. Formés en ce mois, les couples étaient prédisposés à se disputer, à se quereller sans répit. Probablement parce que c'est le mois le plus torride de l'année, donc supposé échauffer les cœurs et les esprits.\n\nEn ce mois d'août, se marier le jour de l'Assomption fut longtemps considéré comme une véritable provocation. Encore aujourd'hui, on dit qu'un mariage célébré le 15 août attire la malédiction.\n\nLes enfants nés ce mois sont supposés sensibles et passionnés, mais aussi nerveux et instables."}]},{"date":"6 août","month":"Août","type":"litu","title":"Transfiguration de Jésus","sub":"6 août · Magie Christique à son apogée · Dieu Guérisseur","content":[{"b":"quote","t":"Six jours après, Jésus prit avec Lui, Pierre, Jacques et Jean, son frère et les conduisit à l'écart sur une haute montagne. Il fut transfiguré devant eux. Son visage resplendit comme le soleil et Ses vêtements devinrent blancs comme la lumière. Et voici, Moïse et Élie leur apparurent, s'entretenant avec Lui.\n\nEt une voix fit entendre de la nuée ces paroles : « Celui-ci est Mon Fils bien-aimé, en qui j'ai mis toute mon affection ; écoutez-Le ! »\n\nMais Jésus s'approchant, les toucha, et dit : « Levez-vous, n'ayez pas peur ! »"},{"b":"serge","t":"Son Nom signifie Dieu Guérisseur, Dieu guérisseur dans la Matière ! Vous voulez vous régénérer ? C'est le moment. Vous voulez régénérer vos proches ? Oui à distance avec la Magie Christique, cela est possible. Vous voulez régénérer vos affaires de cœur ou d'argent ?\n\nChrist avec Pâques étant les symboles cosmiques de la Renaissance, du Rajeunissement et de la Régénération. La Magie Christique, à cette époque de l'année, atteint son apogée !"},{"b":"text","l":"Le Corps de Gloire — Extrait d'un article de 2004","t":"Quand, au moment de la Transfiguration sur le Mont Thabor, Jésus est apparu à ses disciples, Il était tellement lumineux et rayonnant qu'ils n'ont pu supporter cette lumière et sont tombés la face contre terre. Cette Transfiguration était une irruption de son corps spirituel, son corps de gloire, dans le corps physique.\n\nQuelques personnes ont pu voir le corps glorieux de certains Initiés quand ils étaient dans des états de ravissement et d'extase. Leur visage rayonnait, la lumière jaillissait de tout leur être.\n\nC'est grâce à ce corps que les Initiés peuvent voyager dans l'espace, traverser les montagnes. Même si son corps physique est malade, un Initié peut toujours travailler et envoyer de l'aide car le corps physique et le corps de gloire sont deux réalités tout à fait différentes. Même si un Initié est mourant, même s'il est mort, son corps de gloire est là, vivant, rayonnant.\n\nAlors, qu'attendez-vous pour vous servir du corps de gloire de Jésus le Christ toujours vivant."},{"b":"quote","t":"Évangile de Philippe : « Ceux qui disent que le Seigneur est mort d'abord puis ressuscité se trompent, car il est ressuscité avant de mourir. Si quelqu'un ne ressuscite pas d'abord, aussi vrai que Dieu est vivant, il ne pourra pas, il est déjà mort. »\n\nCeux qui disent qu'ils vont d'abord mourir et ensuite ressusciter se trompent. S'ils n'obtiennent pas d'abord la résurrection pendant la vie, ils n'obtiendront rien une fois morts.\n\nAu final, Philippe dit que la transfiguration de l'homme vers un monde spirituel doit s'amorcer dès son passage dans le monde terrestre. C'est lors de votre passage sur la Terre et non dans l'Au-delà que vous progressez. Vous êtes la clé de votre transmutation. Le processus de transfiguration se fait de votre vivant."},{"b":"serge","t":"Extrait de la lettre de Mai 2014 — Je réécris : Jésus vient de l'Orient. Ce qui explique que l'orient-ation soit d'une telle importance. Le langage positif, la recherche et la compréhension du symbole divin réorientent l'individu.\n\nLa Transfiguration dépend d'une bonne orientation, ainsi que toute saine transmutation. Bien orienté, l'humain chargé de meilleures vibrations peut aider le monde.\n\nLe monde et les autres bénéficient toujours de vos changements positifs, comme la personne négative maléfie le monde et les autres. Il vous faut donc, un jour ou l'autre, choisir votre camp."},{"b":"serge","t":"Il n'y a pas de haute montagne en Palestine : cette montagne est donc symbolique. Pourquoi Moïse et Élie ? Moïse a reçu les lois au Sinaï ; Élie s'est réincarné plus tard en Jean-Baptiste pour préparer la venue de Jésus. Donc aucune rupture entre l'Ancienne et la Nouvelle Alliance : « Je suis venu non pour abolir, mais pour accomplir. »"}]},{"date":"15 août","month":"Août","type":"litu","title":"Assomption de la Vierge Marie","sub":"15 août · Marie élevée au ciel · Période de grande densité","content":[{"b":"text","l":"Ce que c'est","t":"Fête de la montée au Ciel de Vierge Marie. Profitez-en pour fêter les femmes de votre famille ! En tant que Mère de Jésus, elle ne meurt pas comme les autres êtres humains. Les orthodoxes nomment cela : Dormition et non mort. Marie échappe à la mort car elle échappe à la Faute originelle. Prière du jour : « Le Magnificat »\n\nAssomption du latin « assumere » : « prendre avec soi ». Dormition = façon dont meurt Vierge Marie dans l'Église orthodoxe ; cette Église insiste sur la mort douce de Marie. Dormition et Assomption sont à peu près semblables (pour simplifier)."},{"b":"text","l":"Le Magnificat — 4 grands thèmes bibliques","t":"Dans le « Magnificat », on retrouve 4 grands thèmes bibliques :\n— La joie de la foi\n— La fidélité de Dieu à ses promesses\n— L'action de grâce pour l'œuvre de Dieu\n— Prédilection de Dieu pour les pauvres et les petits\n\nRendre grâce à Divine Providence qui fait des merveilles dans le monde. Demander à Vierge Marie de vous donner Son regard de foi face à toutes les Merveilles que Dieu continue de réaliser.\n\nVisitation à sa cousine Élisabeth = c'est aller vers l'autre avec Jésus en vous."},{"b":"text","l":"L'Assomption","t":"L'Assomption, fête de la Vierge Marie et de toute la nature humaine en qui s'unit la Nature Divine par l'incarnation. Marie sera la ligne du développement d'une âme qui fait fructifier en elle les dons reçus de Dieu.\n\nParoles de l'Esprit Saint par Elisabeth : « Tu es bénie... le fruit de tes entrailles est béni... » = Dieu agit en toi et par toi."},{"b":"quote","t":"Marie : « Mon âme exalte le Seigneur, j'exulte de joie en Dieu, mon Sauveur. »"}]}];
var D_SEPTEMBRE=[{"date":"Sept","month":"Septembre","type":"mois","title":"Mois de Septembre — MATURATION · RÉCOLTE · Nouveau Printemps","sub":"Mois NEUF · Perfection · Archange Mikhaël · Deuxième Printemps","content":[{"b":"eileen","t":"« Au fond de chaque âme se trouve la pureté de l'esprit. Prends du temps pour la chercher jusqu'à ce que tu la trouves, et puis fais-la émerger. »\n\nImage : Un puits profond, sombre. En haut du puits, il y avait un seau auquel était attachée une corde. Je vis qu'on descendait le seau dans le puits et quand il fut tiré de l'obscurité, il était rempli à ras bord d'eau claire et pure."},{"b":"text","l":"Septembre — Mois NEUF","t":"Mois 9 (Perfection). Septembre vient du nombre Sept (Croissance et expansion qui porte chance). Élément : TERRE. Fête : SAINT MICHEL. Signe : VIERGE (Elle analyse et réfléchit). Mois de l'Équinoxe d'Automne (21 septembre) — 2ème Printemps après l'été.\n\nDans l'homme, l'automne est la période où doit s'accomplir ce que dit Hermès Trismégiste, le Trois Fois Grand :"},{"b":"quote","t":"« Tu sépareras le subtil de l'épais. »"},{"b":"text","l":"Archange Mikhaël — GÉNIE DU SOLEIL","t":"L'Archange Mikhaël vous permettra, si vous lui demandez, de séparer en vous la pulpe du noyau, le mal du bien. L'art de séparer les contraires est très difficile. Cette séparation est le Symbole de la maturité. S'il vous embrasse, tant mieux. Son baiser ne vous brûlera pas, mais vous fera éliminer vos négativités."},{"b":"text","l":"ÉTAT D'ESPRIT DE L'AUTOMNE","t":"Dans la Nature : les arbres changent de couleurs, perdent leurs feuilles ; il ne reste que le tronc et les branches. Nous, nous perdons nos illusions. Se dépouiller de nos croyances, attaches, peurs, espoirs, de tout ce que nous ne voulons plus. On perd pour devenir plus léger. Le changement doit être intérieur, tourner vers l'action pour se remettre en mouvement."},{"b":"text","l":"SEPTEMBRE, c'est le Mois","t":"— Des prises de conscience\n— De récolte\n— Le plus favorable au dépouillement\n— Propice pour changer de fonctionnement\n— De la rentrée scolaire\n— On se dépouille (Il ne reste que le tronc et les branches), on se nettoie, on accepte de perdre — Le tout accompagné du mouvement\n— C'est au niveau de la pensée que l'on change. Nettoyage au niveau du corps astral"},{"b":"pratique","l":"ACTIONS de l'Automne","items":["Trier — trier, c'est élaguer","Labourer","Mettre la terre à nu","Chasser les illusions pour préparer le Verbe","Mettre les graines qui correspondent à votre personnalité","Observer ce qui tombe. Observer, c'est prendre conscience","Avoir des objectifs élevés pour changer sa vie","Se reconstruire une nouvelle image"]},{"b":"text","l":"QUALITÉS","t":"— Être méthodique\n— Être joyeux, le cœur léger avec des résultats immédiats\n— Fermeté\n— Gratitude\n— Foi et confiance absolues en Divine Providence, mais faire sa part, c'est-à-dire le premier pas"},{"b":"serge","t":"Commencer par faire un petit changement."},{"b":"text","l":"MOTS-CLÉS","t":"Maturation · Récolte · Nouveau Printemps\n\n« En Septembre, vivez plus ! Re-naissez !!! »\n\nUn des secrets constatables de Septembre dans la Nature est le nouveau printemps. Chaque année, il y a deux printemps, comme il y a deux Carêmes. Le deuxième printemps est inconnu ; c'est dommage car il concerne la vie dans la matière, dont la réussite sociale, l'argent, etc..."},{"b":"text","l":"Comment se comporter à l'Automne","t":"— Lever tôt, coucher tôt\n— C'est une période de forte sensibilité intérieure ; il faut du calme pour être plus palpitant et passionnant\n— Du nouveau ! Toujours du nouveau d'un bout de l'année à l'autre, voilà le secret"},{"b":"text","l":"Réflexion du Mois","t":"Quand allez-vous vous libérer de ces croyances qui polluent le monde et vous polluent ? Si vous entrez à l'intérieur de vous-même, au profond de votre sacré, vous ne trouverez pas ces vilaines choses, mais du silence et de l'amour. Vous êtes un être illimité ouvert à tous et au meilleur.\n\nAutomne : C'est l'eau qui tonne (=vie). En automne, faire tonner la vie en vous. Mettre du tonnerre dans votre vie et dans l'eau."},{"b":"serge","t":"Exercices de méditation de Septembre — l'Éternité ici et maintenant :\n\nIl n'est jamais trop tard pour appliquer les dix Principes de la spiritualité. Ces dix Principes sont une véritable clé contre le vieillissement.\n\nMettre de la quintessence dans l'air que vous respirez, dans le temps passé à dormir ou à vivre en conscience est PRIMORDIAL. Projeter certaines lettres du VERBE dans les gènes de la longévité et de la santé est PRIMORDIAL.\n\nJe ne fais pas dans l'anti-âge, mais dans l'Éternité ici et maintenant. Grâce à Dieu, nous disposons d'énergie illimitée dont je sais me servir pour repousser les limites de votre âge et vivre en pleine forme chaque jour."}]},{"date":"8 sept","month":"Septembre","type":"litu","title":"Nativité de la Vierge Marie","sub":"8 septembre","content":[{"b":"hi","t":"Fête de la naissance de la Vierge Marie. Moment particulièrement propice pour se rapprocher de Vierge Marie et lui demander protection et guidance. La Vierge Marie est la Mère de notre Univers."}]},{"date":"14-21 sept","month":"Septembre","type":"cosm","title":"SAS des 7 jours — Préparation à l'Équinoxe d'Automne","sub":"14 au 21 septembre · Deuxième Carême commence","content":[{"b":"text","l":"Ce que c'est","t":"SAS de sept jours pendant lesquels les Éléments sont déstructurés afin de permettre la venue d'un nouveau cycle. Depuis le 14 septembre, commence le deuxième cycle de l'Année. Ce cycle est de nature spirituelle. Pendant 6 mois, jusqu'au prochain Équinoxe de Printemps, les Forces Cosmiques incitent les Forces matérielles à perdre de leur intensité.\n\nDes vibrations spirituelles intenses aident au développement de la Connaissance, à l'élargissement du champ de conscience, au développement de l'intuition et à la régénération et restructuration des plans subtils de l'humain."},{"b":"hi","t":"Il y a les Énergies du Deuxième Printemps au mois de septembre, donc du deuxième Carême, qui est aussi important que les 40 jours du Carême mais il est plus réduit. Beaucoup de personnes ne le connaissent pas. Sacrifier au moins 10 minutes pour vous instruire. Vous êtes nourri par le Cosmos. Le Cosmos donne l'Abondance."},{"b":"hi","t":"Se référer au chapitre SAS Cosmiques pour le protocole complet."}]},{"date":"21 sept","month":"Septembre","type":"cosm","title":"Équinoxe d'Automne — Cycle spirituel s'ouvre","sub":"Disparition de vos illusions en TOUT DOMAINE · Archange Mikhaël","content":[{"b":"text","l":"Le deuxième Cycle de l'Année","t":"Ouvert par l'Équinoxe d'Automne, le 21 septembre, il est de nature spirituelle. Pendant cette période de six mois, jusqu'au prochain Équinoxe de Printemps, les Forces Cosmiques favorisent la retraite du monde matériel ainsi que le fait la nature elle-même en se dépouillant et en incitant toute forme de vie à se terrer. Ce retrait du tumulte mondain est le commencement de la pénétration des Vibrations essentiellement Spirituelles. C'est le moment des découvertes intérieures et des grands progrès sur le Sentier de la Conscience."},{"b":"mantra","l":"Message de Serge du 21 septembre 2022","t":"« Équinoxe d'Automne » et la disparition en TOUT DOMAINE de VOS ILLUSIONS !!! J'ai bien écrit : « En tout domaine ». Donc : travaillez sur ce CRUCIAL SUJET !!! Cela fait partie du CHEMIN INTELLIGENT, donc INITIATIQUE."},{"b":"serge","t":"Note de Serge : Souvent j'ai parlé de la nécessité de TRIER. L'automne, pour cela, est la parfaite saison, moment où se sépare le subtil de l'épais dont j'ai déjà parlé. L'Archange Mikaël est l'Archange de l'automne ; Il tranche avec son épée. Soyez tranchant pour séparer l'utile du non nécessaire. Votre présent et votre avenir en dépendent.\n\nPensez lumière ; pensez légèreté ; pensez réussite ; pensez bonheur ; pensez abondance. Cela se réalisera !"},{"b":"quote","t":"Chaque feuille qui tombe est une illusion que s'en va. Il faut se retrouver « nu » comme l'Enfant Jésus et l'arbre à Noël."},{"b":"serge","t":"Note de Serge (Septembre 2002) :\n\n« Septembre est le mois d'élection de tout ce qui fleurit pour la seconde fois, c'est le mois de la seconde floraison, le mois du cep mûrissant. Septembre est le mois où la terre s'ouvre de nouveau, de sorte que nous pouvons de nouveau planter. Il faut maintenant mettre en terre tout ce qui doit être planté pour le printemps. Aviez-vous déjà remarqué que la nature renaît en Septembre ? Ne pensez-vous pas qu'il serait temps pour vous d'ouvrir les yeux et d'imiter la Nature — ce livre réel que Dieu a créé ?\n\nEn Septembre, vivez plus ! Re-naissez !!! Un des secrets constatables de Septembre dans la Nature est le nouveau printemps. Chaque année, il y a deux printemps, comme il y a deux Carêmes. Le deuxième printemps est inconnu ; c'est dommage car il concerne la vie dans la matière, dont la réussite sociale, l'argent, etc...\n\nRéflexion du Mois : Quand allez-vous vous libérer de ces croyances qui polluent le monde et vous polluent ? Si vous entrez à l'intérieur de vous-même, au profond de votre sacré, vous ne trouverez pas ces vilaines choses, mais du silence et de l'amour. Vous êtes un être illimité ouvert à tous et au meilleur. Êtes-vous fier de ce que vous pensez ? De toutes vos pensées ? Automne = l'eau qui tonne (=vie). En automne, faire tonner la vie en vous."},{"b":"serge","t":"Extrait d'un document de Serge — 21 septembre, l'Équinoxe d'Automne :\n\nChrist semble vaincu sous sa forme Soleil et non sous Sa Forme Sphère Bénie de Tiphereth. Oui, Christ semble vaincu pendant trois mois zodiacaux — dans les trois signes du Zodiaque que sont la Balance, le Scorpion et le Sagittaire. C'est la fameuse et dramatique « Descente aux Enfers ».\n\nDès le 23 septembre, le soleil décline, MAIS la Sphère Bénie de Tiphereth augmente Sa Force dans le Grand Univers, donc dans la planète Terre, donc en VOUS ! Les illusions de la matière s'estompent ! Arrivent le temps du spirituel et l'occasion de mieux vous connaître intérieurement.\n\nBien avant Jésus, du temps du dieu solaire Baldur, dieu des Germains, celui-ci est tué par un dieu méchant : Loki. Cette flèche est celle du Sagittaire, le dernier signe inférieur. Plus tard avec Jésus, ce sera la lance du soldat romain. Cette « chute » va continuer jusqu'au 22 décembre de chaque année, le Solstice d'hiver."},{"b":"hi","t":"Votre corps physique a besoin de vous. Il a besoin de mouvement, mais surtout du **Mouvement Intérieur**. Rien n'est plus efficace et pertinent que les Énergies Divines. Mettre de la quintessence dans l'air que vous respirez, dans le temps passé à dormir ou à vivre en conscience est PRIMORDIAL."},{"b":"serge","t":"À certains, l'avenir paraît brumeux, voire redoutable : ils souffrent à l'avance. Mauvaise façon de préparer les jours à venir. Quand cela n'allait pas pour moi, je pensais fortement aux nombres (réduction et addition théosophiques) : cela chassait les idées sombres. L'Archange Mikhaël, « Génie du Soleil », préside cet Équinoxe : s'il vous embrasse, son baiser vous fera éliminer vos négativités."}]},{"date":"21 sept","month":"Septembre","type":"litu","title":"Saint Matthieu","sub":"21 septembre · Fête de l'évangéliste né à Capharnaüm","content":[{"b":"hi","t":"Avec le mois de septembre, vient la chute vers l'Équinoxe d'Automne, vers ce que l'on nomme « les Signes inférieurs », époque de nombreux saints inscrits dans le calendrier, mais peu connus. 21 septembre : fête de Saint Matthieu, l'évangéliste né à Capharnaüm. 29 septembre : fête de Saint Michel et recélant de nombreux secrets cosmiques."}]},{"date":"29 sept","month":"Septembre","type":"litu","title":"Saint Michel Archange","sub":"29 septembre · Nombreux secrets cosmiques","content":[{"b":"text","l":"Ce que c'est","t":"La fête de Saint Michel recèle de nombreux secrets cosmiques. Saint Michel est l'Archange de la Justice divine et du combat contre les forces des ténèbres."},{"b":"serge","t":"À l'Automne, toutes les feuilles volent à droite ou à gauche. Pourquoi n'avez-vous pas cette même souplesse ? Pourquoi ne laissez-vous pas Dieu vous envoyer à droite ou à gauche, devant ou à l'arrière ? Si vous laissez faire cela, c'est la fin de vos soucis, angoisses car ce qui doit être fait, sera fait par Lui.\n\nCeux qui se laissent aller à gauche, à droite par Divine Providence lui disent Amen. Ils se remettent entre ses mains avec un abandon parfait.\n\nIl y a une grande différence entre la confiance en Dieu et l'entière soumission à la Volonté de Dieu."}]}];
var D_OCTOBRE=[{"date":"Oct","month":"Octobre","type":"mois","title":"Mois d'Octobre — Purification · Changer d'état d'esprit","sub":"Mois DIX · Signe Balance · Octogone · Mois initiatique le plus puissant","content":[{"b":"eileen","t":"« Ne t'inquiète pas. La force de vie est à l'intérieur et, de cette force de vie, surgira le nouveau. Sache que l'ancien doit mourir afin que le nouveau puisse naître. »\n\nImage : Des feuilles d'automne tombant d'un arbre, puis un arbre dépouillé de toutes ses feuilles."},{"b":"text","l":"OCTOBRE vient du nombre huit","t":"Vient d'Octogone : 8 côtés et 8 angles. Mois initiatique le plus puissant pour perdre vos énergies néfastes d'illusions en tous domaines. La force de vie est à l'intérieur. Grande loi : l'ancien doit mourir afin que le nouveau puisse naître. Mois de purification."},{"b":"text","l":"OCTOBRE, c'est le Mois qui permet de","t":"— Changer d'état d'esprit\n— Trier\n— Voir vos illusions disparaître\n— Retrouver plus de dignité\n— Être vide de l'adulte pour être un enfant"},{"b":"pratique","l":"ACTIONS d'Octobre","items":["Mettre d'un côté de la balance, ce que vous gagnez et de l'autre, ce que vous avez intérêt à faire","Lâcher les vieux schémas/habitudes","Se dépouiller complètement","Ouvrir les yeux sur vous-même","Mettre de côté tout ce qui vous affaiblit","Partout où je suis, je reste léger","Se détacher de ces émotions car elles créent des peurs","Mettre de l'ordre dans votre vie, sinon vous continuez à l'infini (8)","Développer le discernement"]},{"b":"text","l":"QUESTIONS","t":"— Qu'est-ce que vous décidez ?\n— Est-ce que vous changez vos stratégies ?\n— Comment agissez-vous ?\n— Avez-vous pris conscience de ce que vous ne pouvez pas vous détacher ?\n\nÀ faire chaque année en octobre : Reconnaître sa faiblesse. L'offrir à Dieu et le Karma l'allègera."},{"b":"text","l":"MOTS-CLÉS","t":"Tri · Ordre\n\nRéflexion : Un jour, il faut vous décider à réellement prendre votre vie en main. L'avez-vous déjà prise, cette décision ? Êtes-vous allé jusqu'au bout ? Ou vous décidez, ou les évènements décident pour vous."},{"b":"hi","t":"**N.B. :** La faiblesse vous empêche d'avoir le regard juste sur les choses, sur la Vie, sur les autres. Elle vous empêche d'être dans l'action, au bon moment. La faiblesse vous incite à vous justifier sans cesse, à jouer un rôle, à vous voiler la face, à trouver des compromis et à vous compliquer la vie. Alors, vous avez tout à gagner à être fort. Attention ! La faiblesse retire toute intelligence."},{"b":"text","l":"Béatitudes — enseignement lié à l'automne","t":"La première Béatitude : « Heureux les pauvres en esprit ». Il ne s'agit pas de pauvreté de biens terrestres, mais d'une pauvreté intérieure par manque de connaissance spirituelle. Ceux-là sont heureux car ils dépendent totalement de Divine Providence. Plus vous êtes humble, plus vous dépendez de Dieu. Situation idéale, celle qui vous mène, tout droit, au Royaume.\n\nLes Béatitudes (Matthieu 5, 3-12) :\n— « Heureux les pauvres en esprit, car le Royaume des Cieux est en eux. »\n— « Heureux les doux, car ils recevront la terre en héritage. »\n— « Heureux les affligés, car ils seront consolés. »\n— « Heureux ceux qui ont faim et soif de la justice, car ils seront rassasiés. »\n— « Heureux les miséricordieux, car il leur sera fait miséricorde. »\n— « Heureux les cœurs purs, car ils verront Dieu. »\n— « Heureux les artisans de paix, car ils seront appelés fils de Dieu. »\n— « Heureux les persécutés pour la justice, car le Royaume des Cieux est à eux. »\n— « Heureux êtes-vous lorsqu'on vous insulte, que l'on vous persécute et que l'on dit faussement contre vous toute sorte de mal à cause de moi. »\n— « Soyez dans la joie et l'allégresse, car votre récompense est grande dans les cieux. »"},{"b":"text","l":"Décodage des Béatitudes par Serge","t":"Béatitude est différente de Bénédiction — Béatitude sous-entendant un bonheur déjà réalisé ou en voie de réalisation. Si une des Béatitudes est déjà réalisée, la personne en vit le bonheur. Ce n'est donc pas une promesse d'avenir au ciel comme le Paradis, mais un bonheur ici présent.\n\n1ère Béatitude — « Heureux les pauvres en esprit » : Le Savoir spirituel, ésotérique, occulte, risque de vous rendre vaniteux ou orgueilleux. Être humble d'esprit n'est pas une tare ! « Père, je ne sais rien, je ne peux rien, mais Toi, tu peux tout ! »\n\n2ème — « Heureux les doux » : Le doux est surtout patient face aux difficultés de la vie. Il accepte la manière dont Divine Providence conduit sa vie. Ce n'est pas un faible, mais un tempérament bien trempé tel celui de Jésus.\n\n5ème — « Heureux les miséricordieux » : La miséricorde dépasse le pardon et incite à l'accomplir. Le pardon fonctionne d'autant mieux que celui qui reçoit le pardon l'accepte.\n\n6ème — « Heureux les cœurs purs » : Pensées pures = cœur pur. Cœur pur, c'est vivre en accord avec vos pensées, sans aucune hypocrisie. « Authenticité » va avec « cœur pur ».\n\n7ème — « Heureux les artisans de paix » : Participez à la paix du monde avec vos pensées, vos paroles, vos actions. Prenez l'initiative de la réconciliation !\n\nLes Béatitudes forment une harmonie ; l'une s'ouvre à l'autre. Dans ces « Béatitudes », vous retrouvez la totalité des qualités des 10 Séphiroth. Les Béatitudes sont des Lumières dans les Ténèbres."},{"b":"serge","t":"La pauvreté de la connaissance ésotérique n'empêche pas la richesse de cœur. Être humble d'esprit n'est pas une tare ! Au contraire ! Cela permet de vous courber face à Dieu si puissant et en Lui, de trouver la force, votre force. Plus vous êtes humble, plus vous dépendez de Dieu.\n\nLes Béatitudes forment une harmonie ; l'une s'ouvre à l'autre. Dans ces « Béatitudes », vous retrouvez la totalité des qualités des 10 Séphiroth. Les Béatitudes sont des Lumières dans les Ténèbres. Elles sont à vivre ici et maintenant, pas une promesse d'avenir uniquement."},{"b":"text","l":"Note sur Saint Denis (fête le 9 octobre)","t":"Un des secrets les plus admirables se dissimule dans Saint Denis, protecteur de la France. Ce Saint, également Saint Patron de Paris, Denis, sait-on, venait de se faire trancher la tête, la ramasse et la porte jusqu'au lieu qui deviendra la Basilique Saint Denis près de Paris. Ce miracle physiquement impossible symbolise : la tête décapitée, c'est la tête séparée du corps, c'est la pensée livrée à elle-même, qui va se placer exactement là où elle doit être. Ce saint nous enseigne à mettre notre mental, nos pensées, au service du Divin."},{"b":"hi","t":"**Faiblesse — aller plus loin :** La faiblesse vous fait perdre du temps, de l'énergie, de l'argent, une bonne estime de vous et, surtout, elle vous empêche d'être heureux. N.B. : le faible ne voit pas qu'il est faible. Il n'est pas besoin de faire de longues prières, de grandes méditations pour comprendre ce que veut Divine Providence. Elle veut vous amener hors de votre petite vie égoïque. Pourquoi laissez-vous votre ego mener votre vie ? Pourquoi êtes-vous soumis à lui plus qu'à l'Esprit-Saint, à la volonté du Tout Puissant ?"},{"b":"text","l":"À faire chaque année en Octobre","t":"Reconnaître sa faiblesse. L'offrir à Dieu et le Karma l'allègera. Travaillez sur la différence entre la confiance en Dieu et l'entière soumission à la Volonté de Dieu.\n\nQuestions :\n— Qu'est-ce que vous décidez ?\n— Est-ce que vous changez vos stratégies ?\n— Comment agissez-vous ?\n— Avez-vous pris conscience de ce que vous ne pouvez pas vous détacher ?\n— Voulez-vous atteindre un certain succès ? L'avez-vous déjà prise, cette décision d'aller au bout ?"}]}];
