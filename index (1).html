var D_NOVEMBRE=[{"date":"Nov","month":"Novembre","type":"mois","title":"Mois de Novembre — Nettoyage · Décision · Oser","sub":"Mois ONZE et NEUF · Abandon de l'ancien · 2e Carême commence","content":[{"b":"eileen","t":"« Aie foi ! Tiens bon et sache que toute la Terre et tout ce qu'elle porte est en train de traverser un énorme processus de nettoyage. Tout est très, très bien, car tout se passe selon Mon plan. Sois parfaitement en paix ! »\n\nImage : La Terre ressemblant à un damier, peint de gros carreaux noirs et blancs. Comme il pleuvait, la peinture noire coulait dans le blanc et le tout devint d'un gris sale. Puis une pluie encore plus forte se mit à tomber, et l'ensemble se transforma en un blanc des plus purs.\n\nDécodage de Serge : Gardez la foi ! Divine Providence veille sur vous !"},{"b":"text","l":"NOVEMBRE = 11 et 9","t":"Novembre vient de « nove », neuf. Novembre : 11 et 9. Durant le mois de novembre, soit je donne de l'importance au 11 (1+1=2), à la dualité, soit j'accepte d'être transformé comme un papillon et d'abandonner l'ancien. Lire la page du 1er Novembre de la Petite Voix d'Eileen Caddy.\n\nPour être 9 NEUF, il faut laisser tomber l'ancien :\n— Éclaircir ses relations, ses différends en faisant le 1er Pas\n— Marcher dans l'Amour, paix et harmonie avec les Autres\n— Oublier tout ressentiment (jalousie, intolérance, incompréhension)\n— Arracher les mauvaises herbes qui étouffent les belles plantes en soi, soit le Divin en soi\n— Éviter tout jugement\n— Développer le discernement\n\nLorsque vous n'êtes pas dans la dualité, vous pouvez voir, entendre et expanser le Divin en vous. Durant le mois de novembre, soit je donne de l'importance au 11 (1+1=2), à la dualité, soit j'accepte d'être transformé comme un papillon et d'abandonner l'ancien.\n\nPour être 9 NEUF, il faut laisser tomber l'ancien, c'est-à-dire :\n— Éclaircir ses relations, ses différends en faisant le 1er Pas\n— Marcher dans l'Amour, paix et harmonie avec les Autres\n— Oublier tout ressentiment (jalousie, intolérance, incompréhension)\n— Arracher les mauvaises herbes qui étouffent les belles plantes en soi, soit le Divin en soi\n— Éviter tout jugement\n— Développer le discernement"},{"b":"hi","t":"Lorsque vous n'êtes pas dans la dualité, vous pouvez voir, entendre et expanser le Divin en vous."},{"b":"text","l":"NOVEMBRE, c'est le Mois","t":"— De nettoyage : On met la Terre à nu pour dormir et recevoir les graines que l'on va semer. On ne plante pas encore\n— D'abandon de l'ancien\n— D'acceptation d'être transformé. Accepter que les choses tombent car elles laissent de la place\n— D'action et de décision. On lâche et on décide\n— D'Oser si vous voulez vivre le mois de décembre tranquillement\n— De dépense"},{"b":"pratique","l":"ACTIONS de Novembre","items":["Faire un grand nettoyage dans votre esprit et dans votre vie","Lâcher","Trier tout ce qui est inutile","Réfléchir à mettre en place des projets matériels","Mettre sur un papier tout ce que vous avez fait et voir comment vous auriez pu faire pour être plus léger","Réfléchir sur la Plénitude","Avancer durant ce mois, à pas de loup"]},{"b":"text","l":"ATTITUDE","t":"— Être intelligent\n— Calme, sérénité (Le soleil est intérieur)"},{"b":"text","l":"MOT-CLÉ","t":"Discernement\n\nRéflexion du Mois : Un excellent moyen de devenir plus positif est celui-ci : Ne vous comparez pas aux autres ! Par contre : Comparez ce que vous étiez avant et ce que, grâce à l'Enseignement et aux Vibrations Divines, vous êtes devenu aujourd'hui."},{"b":"eileen","t":"Page du 12 Novembre décodée par Serge : « Ne perds jamais de temps à te dire que tu as un très long chemin à parcourir dans cette vie spirituelle. Prends plutôt courage et force en réalisant combien de chemin tu as parcouru, et rends grâce éternellement pour cela. Environne-toi de belles pensées, de belles choses, de belles personnes.\n\nVois la lumière de la vérité brûler en tout et en tous. Fais briller ta lumière avec force du fond de toi. Sache que rien d'extérieur ne peut l'éteindre et que seule ta négativité peut le faire. Donc reste tout le temps positif. Choisis toujours le chemin de la lumière et ignore l'obscurité.\n\nIl y a de plus en plus besoin de lumière parce que, dans le monde, la faim de nourriture spirituelle devient plus grande ; alors, fais sans cesse rayonner ta lumière. Sois lumière et laisse-la irradier de toi ; repousse les ténèbres. Sois amour et laisse l'amour couler librement de toi. »"},{"b":"serge","t":"Décodage de Serge — Première phrase : Il n'y a aucun chemin à parcourir. Il faut être, seulement être. Rendre grâce à Divine Providence pour recevoir ses Grâces.\n\n« Les belles personnes » sont des personnes bénéfiques, positives. Attention à nos lois. Elles sont dictées par la Ténèbre. Les seules lois à suivre sont les Lois Cosmiques. Les respecter ou échouer.\n\n« Fais briller ta lumière avec force » : combattre la tiédeur dans chaque domaine.\n\nQu'est-ce que la lumière interne ? C'est la fraîcheur, la jeunesse, la gaité, la curiosité et l'envie de se battre. Rester positif en évitant les gens négatifs."},{"b":"text","l":"QUESTIONS de Novembre","t":"— Comment vous définissez-vous vous-même ?\n— Quelles sont vos priorités ?\n— Durant cette année, vous êtes-vous renforcé ? ou affaibli ?\n— Sentez-vous la voie de la sainteté en vous ?\n— Comment construire une nouvelle année ?"},{"b":"hi","t":"**Novembre c'est aussi le début du 2ème grand Carême de l'année** — le Carême matériel et initiatique. Concrétisation de la Vraie Vie dans la Matière car le VERBE SE FAIT CHAIR. Perdre l'adulte pour un enfant."}]},{"date":"1er nov","month":"Novembre","type":"litu","title":"Toussaint","sub":"1er novembre · Fête de tous les Saints · Les Béatitudes","content":[{"b":"text","l":"Ce que c'est","t":"C'est une solennité chrétienne qui honore tous les saints connus ou inconnus. Elle est reconnue officiellement par l'État républicain. C'est donc un jour chômé. La Toussaint, c'est se comparer, se référer à tous les Saints. Texte liturgique de ce jour : Les BÉATITUDES."},{"b":"text","l":"Les Béatitudes — Note de 2012","t":"L'Église a transformé le texte des Béatitudes en un Cantique de compassion pour ceux qui souffrent des disgrâces. Or, tout au contraire, ces textes sont d'une force très grande ; ils expriment la reconnaissance de quelqu'un ; il respire, parvient à faire valoir son droit, souffre la faim mais réussit à exprimer cette souffrance, tout en faisant entendre sa voix.\n\nLes Béatitudes ne sont pas des textes de consolation ; ce sont des textes où l'Esprit Saint s'exprime de l'intérieur ; Il ne renie jamais, bien au contraire, votre droit à manger, boire, avoir une bonne santé, un bon dialogue avec les autres.\n\nLes Béatitudes définissent les droits humains, beaucoup mieux et beaucoup plus tôt que les religions, surtout la catholique."},{"b":"text","l":"Matthieu et Luc — un bonheur ici présent","t":"Entre Matthieu et Luc, au sujet des Béatitudes, il y a plus de différences que de ressemblances. En Matthieu : 9 béatitudes. En Luc : 4 seulement, mais Luc les fait suivre de 4 lamentations : « Malheureux vous » pendant aux quatre « Heureux vous ».\n\nQue veut dire ce terme « Heureux » ? Présent à 45 reprises dans la Bible hébraïque dont 25 fois dans les Psaumes. « Béatitude » est différente de « Bénédiction » : Béatitude sous-entend un bonheur déjà réalisé ou en voie de réalisation.\n\nCe n'est donc pas une promesse d'avenir au ciel comme le Paradis, mais un bonheur ici présent. Remarquez que le premier membre des Béatitudes ne comporte pas de verbe : « Heureux les pauvres en esprit », « Heureux les doux »... Donc, le destinataire de chaque Béatitude est déjà heureux.\n\nLes destinataires sont heureux parce qu'ils se laissent transformer de l'intérieur par les valeurs du Royaume. Les Béatitudes : un bonheur qui vient à vous et non produit par vous.\n\nLa dernière Béatitude incite à vous réjouir et à être dans l'allégresse même dans les pires moments. Dieu est toujours avec vous ! Durant toute sa mission de prêche, Jésus prend grand soin des pauvres, des miséreux, des reniés, des malades, des publicains et des femmes. À travers tous les temps, les Béatitudes sont un programme de vie pour tous les humains."},{"b":"text","l":"Le Sermon sur la Montagne — le Notre Père, centre du centre","t":"Dans l'Évangile de Matthieu, le Sermon sur la Montagne est en 5-7. Dans le texte, le terme « Justice » apparaît 5 fois ; ce terme structure les Béatitudes en deux groupes de quatre.\n\nAutre expression récurrente : « Royaume des Cieux » revient 8 fois dans le texte. Expression encore plus présente : « Père » — présent 44 fois chez Matthieu. Jésus dit toujours « ton père » ou « votre Père », sauf en deux exceptions : « Notre Père » et « Mon Père ». Constamment, Jésus évoque Dieu comme le Père des humains, comme pour nous rapprocher encore plus de lui.\n\nRésumons : la place du Père structure le thème central ; le « Notre Père » (Prière) est le centre de ce centre ! Donc, il n'y a pas de vie morale sans passer par le Père, d'où la prière nécessaire du « Notre Père ».\n\nLe Sermon sur la Montagne contient la présence des trois termes : Père – Fils – Frère, soit Paternité – Filiation – Fraternité."},{"b":"pratique","l":"Les Béatitudes une à une — lecture de Serge","items":["Pauvres en esprit : ni savoirs ni pouvoirs, il leur reste Dieu ; la porte de toutes les autres","Doux : accepter la manière dont Divine Providence conduit sa vie, sans révolte","Affligés : de voir la Parole de Dieu si peu appliquée sur Terre","Faim et soif de justice : la divine et celle des hommes, un monde plus juste","Miséricordieux : secourir toute détresse ; la miséricorde dépasse le pardon","Cœurs purs : le cœur est le siège de la pensée ; le Bien comme le Mal viennent du dedans","Artisans de paix : se réconcilier avec ses pseudo-adversaires","Persécutés pour la justice : la joie n'est pas dans la persécution, mais dans la fidélité à Divine Providence"]}]},{"date":"2 nov","month":"Novembre","type":"litu","title":"Fête des Morts","sub":"2 novembre","content":[{"b":"mantra","l":"Message de Serge (2 novembre 2022)","t":"Priez avec amour et surtout JOIE pour tous les désincarnés !!! Demandez à Divine Providence d'adoucir spécialement LEURS KARMAS ! Imaginez que toutes les âmes soient aspirées dans le cœur du CHRIST !!!"}]},{"month":"Novembre","date":"22 nov","type":"litu","title":"Fête du Christ Roi","sub":"Dernier dimanche de l'Année Liturgique · Solennité de Notre Seigneur Jésus-Christ, Roi de l'Univers","content":[{"b":"text","l":"Le Grand Vainqueur","t":"La fête du Christ-Roi est toujours le dimanche avant le 1er dimanche de l'Avent. Fin de l'année liturgique et début de l'Avent.\n\nLa semaine entre la Fête du Christ Roi et le premier dimanche de l'Avent, c'est une semaine pour lever les yeux vers l'A-venir, soit mettre en œuvre tous les talents qui nous ont été confiés.\n\nLa royauté du Christ est universelle et éternelle. Christ-Roi = Grand vainqueur. Par sa Résurrection, il a vaincu la mort ; par le pardon, il a vaincu la haine.\n\nJésus-Christ est le centre du monde et de l'histoire. Jésus est la visibilité du Père. C'est la haine des hommes qui tue le Christ et par un retournement, la haine est transformée par Dieu en réconciliation et pacification. On nous montre à l'avance le but vers lequel aller, celui de Jésus."},{"b":"text","l":"Texte de la Liturgie (Matthieu 25, 31-46)","t":"Ce texte nous rappelle que nous sommes en chemin vers la rencontre avec Jésus :\n\n— La première venue : dans l'humilité de l'enfant dans une crèche\n— La seconde, lorsqu'il reviendra dans la gloire à la fin de l'histoire."}]},{"date":"Fin nov","month":"Novembre","type":"litu","title":"Début de l'Avent","sub":"4e dimanche avant Noël · Meilleures périodes pour le Pardon","content":[{"b":"text","l":"Qu'est-ce que l'Avent","t":"L'Avent commence le 4ème dimanche avant Noël. C'est l'espérance du royaume et le moment où l'on se met en condition pour recevoir le Christ. L'Avent (du latin « adventus » = arrivée, venue) est une période de pénitence instituée pour préparer Noël. On l'appelle aussi « petit carême ». L'Avent est le meilleur moment pour se rapprocher, dialoguer, être en lien étroit avec Divine Providence. C'est le temps de la vie intérieure.\n\nComment construire une nouvelle année ? Chaque année, avoir un bénéfice en qualité de vie."},{"b":"hi","t":"**Conseil de lecture pour l'Avent :** Relire le « Serpent Vert » de Goethe. L'Avent est une période de réflexion profonde, une préparation intérieure à la venue du Messie."},{"b":"text","l":"8 Novembre — Fête des Saintes Reliques","t":"Le dimanche qui suit la Toussaint, on célèbre les Saintes Reliques. (Du latin « reliqua ») Ce sont les « restes » corporels du Christ ou des saints et des saintes."},{"b":"text","l":"Meilleures périodes pour le Pardon","t":"— Carême avant Pâques\n— L'Avent avant Noël\n— Avant la fin de l'année"},{"b":"hi","t":"Comment construire une nouvelle année ? Chaque année, avoir un bénéfice en qualité de vie."},{"b":"mantra","l":"Mantra du Pardon — Avent","t":"« Le Passé appartient à la Divine Miséricorde et l'Avenir à la Divine Providence. Ainsi vous serez libre et disponible pour accueillir TOUTE LA JOIE QUE DIEU VOUS OFFRE AU PRÉSENT. »"},{"b":"text","l":"Fête du Christ Roi — Dernier dimanche de Novembre","t":"Fin de l'année liturgique et début de l'Avent. La semaine entre la Fête du Christ Roi et le premier dimanche de l'Avent, c'est une semaine pour lever les yeux vers l'A-venir, soit mettre en œuvre tous les talents qui nous ont été confiés. La royauté du Christ est universelle et éternelle. Christ-Roi = Grand vainqueur. Par sa Résurrection, il a vaincu la mort ; par le pardon, il a vaincu la haine."}]}];
var D_DECEMBRE=[{"date":"Déc","month":"Décembre","type":"mois","title":"Mois de Décembre — GRATITUDE · JOIE · LÉGÈRETÉ","sub":"Mois DOUZE · Élément EAU · Décagone · Toutes les Énergies de l'Arbre de Vie","content":[{"b":"eileen","t":"« Quand tu auras parcouru le cycle complet, tu retourneras à Moi, la source de toute vie, et tu deviendras Un avec Moi, comme tu l'étais au commencement. »\n\nImage : Une grande boule de lumière. Il en sortait des rayons de lumière éclatants et des rayons ternes y retournaient."},{"b":"text","l":"Chiffres de Décembre","t":"Décembre et son Décagone, nombre 10, soit 1+0 = 1, le nombre de Dieu. Le 1+6 = 7, nombre créateur dans la matière par excellence. Toutes les énergies bénéfiques de l'Arbre de Vie sont dans le mois de Décembre : 10 + 12 = 22. Chaque année, il faut avoir fait le parcours du Tarot. 22 lames du Tarot = 22 = chiffre de Maître.\n\nDans le mot Décembre : la lettre M en minuscule est une onde, donc ONDE D'AMOUR. Décembre est le mois de l'Amour infini qui descend sur terre. L'arbre de Noël avec ses guirlandes lumineuses représente l'Arbre de Vie illuminé en vous."},{"b":"text","l":"DÉCEMBRE dans le cycle cosmique","t":"Décembre vient du nombre DIX, le Décagone. Décembre : deca (10) + 12ème mois. On ne peut rien réussir sans 12 apôtres. Toutes les énergies bénéfiques de l'Arbre de Vie sont dans le mois de décembre. 10 + 12 = 22 ! Chaque année, il faut avoir fait le parcours du Tarot."},{"b":"text","l":"DÉCEMBRE, c'est le Mois","t":"— Du solstice d'hiver (la nuit la plus longue)\n— De la fin du Parcours initiatique\n— Du début de la gestation\n— De la réflexion"},{"b":"pratique","l":"ACTIONS","items":["Laisser hier derrière soi","Trier pour lâcher et préparer la nouvelle année","Décider de changer","Accepter le changement. Avoir la volonté de le faire","Rassurer l'ego — Lui donner des objectifs atteignables, étape par étape","Du 21 décembre (jour du solstice d'hiver) au 1er janvier, penser à : se nettoyer, supprimer toutes les vieilleries, s'excuser auprès de celui ou celle que l'on a offensé, rembourser ce que l'on doit, accueillir toutes les Grâces de la nouvelle année"]},{"b":"text","l":"ATTITUDES","t":"Être joyeux et léger."},{"b":"text","l":"QUESTIONS","t":"— Quels sont les résultats en tous domaines (Amour — Argent — Santé) ?\n— En fonction du résultat, devez-vous changer ou non de stratégies ?\n— Avez-vous progressé cette année ?\n— Est-ce que votre maison intérieure est propre ?\n— L'enfant Jésus arrive « nu » dans l'Étable. Nu = sans vêtement, sans idée préconçue, ce qui rejoint la page blanche au réveil."},{"b":"text","l":"RAPPEL annuel","t":"Chaque année, on doit abandonner des choses pour que la nouvelle année apporte du nouveau : Abandonner un défaut, un vice, une faiblesse. Choisir le plus important, ce que vous traînez depuis des années. S'engager à ne plus pratiquer, par exemple, ce vice pendant la nouvelle année. En choisir un SEUL."},{"b":"mantra","l":"Mantra de purification de fin d'année","t":"« Dès cet instant, grâce à Toi Christ et joyeusement en Toi Christ, je suis purifié et libéré de……… » (Nommez le vice, le défaut...)\n\nÀ faire durant TOUT le mois de décembre. À faire dehors de préférence et ne pas être allongé."},{"b":"danger","t":"**Attention aux Forces Négatives** qui n'auront aucune pitié !"},{"b":"text","l":"MOTS-CLÉS","t":"Gratitude · Joie · Légèreté\n\nRéflexion du Mois : Tout le monde a été un jour ou l'autre heureux, mais a été incapable de le maintenir. Chacun de vous en suivant ces conseils simples, initiatiques et ancestraux, peut facilement accéder à une vie merveilleuse, cela quels que soient les obstacles et problèmes rencontrés."},{"b":"text","l":"Trois phrases qui clôturent l'année","t":"— Lâche prise\n— Libère le passé\n— Avance le cœur empli d'amour, de gratitude et de joie"},{"b":"serge","t":"Note de Serge — Telegram fin 2022 : NOËL et ses fêtes de fin d'année approchent. Préparez Noël dans votre tête et votre cœur. Écoutez des chants de Noël ; lisez, relisez ce que j'ai dévoilé sur les mystères de Noël et créez une ambiance de fête.\n\nPréparez-vous à JETER hors de VOTRE VIE toutes personnes qui vous pourrissent la vie, même si vos émotions vous font croire que vous tenez à elles. Jetez hors de votre existence tout ce qui est faux, mensonges, nuisibles, etc... humains ou matière !\n\nSouvenez-vous ! J'ai souvent dit et constaté qu'au début décembre, des conflits éclatent en couple et en famille et cela jusqu'à peu près les fêtes. Rien de grave si on sait cela ; on peut contrôler !!!"},{"b":"serge","t":"À l'origine de cette fête existaient différentes fêtes paiënnes qui marquaient le solstice d'hiver. L'Archange Gabriel préside cette période et concrétise dans la matière toute idée, tout projet, tout vœu. La Fête de Noël célèbre une naissance : celle de Jésus. Il s'agit là d'une incarnation dans la matière qui dote cette dernière d'une incroyable énergie bénéfique agissante : le Verbe se fait réellement chair. Quand un Mage Christique veut matérialiser un projet (ou une idée), il attend cette période pour le faire. C'est ainsi que Serge, Mage Christique, agit lui-même."},{"b":"text","l":"Pour entrer « Nouveau » dans l'année","t":"— Changer ses formes de pensée, ses vêtements, etc. Voir les qualités et défauts à mettre en avant\n— Visualiser tous ses vœux avec précision dans chaque domaine et faire comme si c'est déjà réalisé (voir grand, beau, amour / argent / social / spirituel...)\n— La nouvelle année commence à minuit ET au lever. Vivre les 12 premières minutes dans le calme, la gratitude et la joie\n\n« Chaque année est une aventure vers l'inconnu. Il vous faudra la détermination et la foi de vos ancêtres pour vous y guider. Chaque âme a son rôle à jouer dans le Tout. Trouvez la place où vous devez être dans le vaste ordre de la vie et ensuite, donnez le meilleur de vous-même. »"},{"b":"serge","t":"CONCLUSION — Conseils de Serge (Note de 2022) :\n\nMaintenant que l'Éveil commence à se développer en vous, retenez ceci :\n\n— Abandonnez la paresse ; votre vie sera plus active, plus riche\n— Abandonnez la destruction, la futilité, la légèreté de votre esprit\n— Développez le sens de l'écoute, de la compréhension et de l'entendement\n— Développez le plaisir de la méditation, de la réflexion, de la paix de l'esprit\n— Il est temps, plus que temps, dans votre incarnation actuelle, d'être différent de ce que vous êtes aujourd'hui\n— Il est temps, plus que temps, de développer une nouvelle perception de vous-même\n— Il est temps, plus que temps, d'ouvrir les yeux sur le « vieil homme » que vous êtes, qui a gâché tant de chances\n— Il est temps, plus que temps, de revoir votre relation à Dieu, de cesser de Le craindre, de cesser d'être comme un mendiant envers Lui\n— Il est temps, plus que temps, d'avoir plus de reconnaissance envers Lui et de faire appel sans cesse à Ses grâces\n— Il est temps, plus que temps, que vous vous reposiez plus, que vous vous amusiez plus\n— Pratiquez les méthodes pendant les moments de détente. Pratiquez la détente pendant le temps des méthodes\n\nLaissez-vous reposer dans votre grande paix intérieure. Cette paix en vous est naturelle. Alors s'effaceront définitivement toutes pensées névrotiques, toutes vagues émotives déferlantes."},{"b":"mantra","l":"Conclusion finale de Serge — Les Douze","t":"Ici, où vous vous trouvez,\nVous serez immergé dans l'Océan d'Amour Infini\nDe votre Dieu intérieur, la Divine Providence Bien-Aimée."},{"b":"serge","t":"En vous, vous êtes celui qui apaise les brûlures des passions du monde.\nEn vous, vous êtes celui qui dissipe le brouillard des ignorances et de l'ignorance du monde.\nEn vous, vous êtes celui qui abrite tous les êtres de tous les plans, de tous les Royaumes de l'invisible.\nEn vous, vous êtes celui qui ne peut jamais connaître la mort.\nEn vous, la vision profonde, la compassion, l'humour, l'aisance, la largeur d'esprit.\n\nLaissez-vous reposer dans votre grande paix intérieure. Cette paix en vous est naturelle. Alors s'effaceront définitivement toutes pensées névrotiques, toutes vagues émotives déferlantes."},{"b":"text","l":"31 décembre — Saint Sylvestre","t":"Pas de différence entre le dernier et le premier jour de l'année. Le 1er jour a ses racines dans le dernier jour. Dans « Sylvestre », le mot « Versets » (Référence aux Évangiles et Textes Sacrés). Rappel que toute l'année, vous auriez dû travailler les Évangiles. Il y a également le mot « Est » : la Lumière Divine, celle de Jésus, vient de l'Est.\n\nRéveillon : secret du mot : le mot « réveil » c'est-à-dire se réveiller dès le premier jour de l'année."},{"b":"text","l":"Réflexion et attitude","t":"Écrivez les trois choses qui font qu'un être humain est merveilleux, puis faites-en une réalité dans votre vie. Les bonnes attitudes intérieures : un bon mental, l'enthousiasme, l'envie de réussir — ce qui demande de la confiance en soi, donc de connaître ses capacités et ses limites. Accepter la Puissance Cosmique du Christ qui permet de changer de caractère, en se méfiant de la résistance de l'ego."},{"b":"mantra","l":"À se rappeler","t":"« Par ma seule pensée, je peux changer ma vie. »"}]},{"date":"6 déc","month":"Décembre","type":"litu","title":"Saint Nicolas","sub":"6 décembre · Protection des enfants","content":[{"b":"text","l":"Ce que c'est","t":"Évêque qui a vécu au 4è siècle. Il protégeait les enfants, les veuves et faisait plein de miracles."},{"b":"hi","t":"13 décembre (Sainte Lucie) + 12 jours = 25 décembre (Noël) + 12 jours = 6 janvier (Épiphanie). Ces 12 jours relient les trois fêtes lumineuses."}]},{"date":"8 déc","month":"Décembre","type":"litu","title":"Immaculée Conception","sub":"8 décembre · 17 jours avant Noël · Nombre christique","content":[{"b":"text","l":"Les 17 jours mystérieux","t":"Entre la fête de l'Immaculée Conception, le 8 décembre et la Noël, jour de naissance du fils de la Vierge, s'écoulent exactement 17 jours. 17 est le huitième nombre premier. Sa valeur secrète est 1+7 = 8. 8 encore plus secrètement est le nombre christique par excellence.\n\nAu Concile d'Éphèse en 431, est proclamée la croyance qui devient un dogme, celui de la Mère Divine. En 1854, Pie IX proclame le dogme de l'Immaculée Conception. Ce phénomène, appelé « Parthénogenèse » suit la progression du Nombre d'Or ou la suite dite de Fibonacci."},{"b":"hi","t":"L'Église a fait d'Elle « la Mère de Dieu », donc L'a présentée comme un être à part, un être unique. C'est pourquoi Marie a été proclamée « Immaculée Conception », c'est-à-dire conçue sans péché, donc préservée du Péché Originel et de plus, toujours vierge."}]},{"date":"13 déc","month":"Décembre","type":"litu","title":"Sainte Lucie — Fête de la Lumière","sub":"Mettre de la clarté à l'intérieur de soi","content":[{"b":"hi","t":"Fête de la Lumière — Mettre de la clarté à l'intérieur de soi. Sainte Lucie est célébrée comme apporteuse de lumière dans la nuit la plus sombre de l'année. 13 décembre + 12 jours = 25 décembre (Noël). Ces 12 jours sont symboliquement les 12 apôtres, les 12 mois, les 12 portes de l'Arbre de Vie."},{"b":"text","l":"La chaîne des 12 jours — Promesse, Mouvement, Confirmation","t":"— 13 décembre : Sainte Luce (la PROMESSE)\n+ 12 jours →\n— 25 décembre : Noël (l'esprit se met en mouvement. C'est le moment de méditer)\n+ 12 jours →\n— 6 janvier : Épiphanie (CONFIRMATION de la promesse). Épiphanie = lumière au-delà de la Lumière."}]},{"date":"14-21 déc","month":"Décembre","type":"cosm","title":"SAS des 7 jours — Préparation au Solstice d'Hiver","sub":"14 au 21 décembre · La Brèche s'ouvre · Forces Immenses","content":[{"b":"text","l":"Ce que c'est","t":"SAS de sept jours pendant lesquels les Éléments sont déstructurés afin de permettre la venue d'un nouveau cycle. Les Forces Cosmiques sont au Zénith de leur activité spirituelle. La Tradition procède ce jour-là à un grand Rituel d'Adoration fêtant la « brèche » qui s'effectue sur les Hauts Plans et qui permet le passage de Forces Immenses."},{"b":"serge","t":"Audio de Serge : Débarrassez-vous totalement de vos énergies négatives au soir du 21 décembre."},{"b":"hi","t":"Se référer au chapitre SAS Cosmiques pour le protocole complet."}]},{"date":"21 déc","month":"Décembre","type":"cosm","title":"Solstice d'Hiver — Date pivot · Archange Gabriel","sub":"Jour le plus court · Liberté · La Brèche · Archange GABRIEL","content":[{"b":"text","l":"Le Solstice d'Hiver","t":"C'est le jour le plus court. Jour de liberté. Dans l'année, c'est une date pivot, comme le jeudi dans la semaine. Elle représente le début de l'année. C'est la naissance de l'enfant spirituel.\n\nLe Solstice d'Hiver, le 21 décembre, est présidé par l'ARCHANGE GABRIEL. L'archange Gabriel, c'est l'Archange de la sphère de Iesod, la Lune, qui condense les choses. Il dirige des forces qui ont pour propriété de condenser la matière."},{"b":"text","l":"Archange Gabriel et la matérialisation","t":"Si la Lune n'en était pas empêchée par d'autres influences, elle pétrifierait tout : plantes, animaux, humains... Donc l'Archange Gabriel, assisté des Anges, des Chérubins, dirige la matérialisation. Quand un Mage veut matérialiser un projet, une idée quelle qu'elle soit, il utilise cette fête pour y parvenir, parce que toutes les conditions idéales sont réunies. Seule la fête de Noël est liée à une réalisation sur la Terre."},{"b":"text","l":"Secret du 21","t":"Un des secrets du 21 : le 12. Les 12 apôtres : les forces du mal font l'inverse. Donc il se passe des choses dont vous n'avez pas la moindre idée, le 21. La Magie, c'est le même monde mais vu d'une manière différente, vécu différemment.\n\nL'hiver, la sève des arbres descend dans les racines. Le retour sur soi-même est nécessaire."},{"b":"text","l":"Symbolique universelle du Soleil — Secret initiatique des fêtes","t":"Dans de nombreuses cultures, le calendrier commençait initialement dans la constellation de la Vierge : le soleil était donc « né d'une Vierge ». Le Soleil est la « Lumière du Monde ». Les « disciples » du Soleil sont les 12 mois et les 12 signes du zodiaque. Le Soleil à 12 heures est dans la maison du « Plus Haut ». Il entre dans chaque signe à 30° — « le Soleil de Dieu commence son ministère à l'âge de 30 ans ». Le Soleil est tenu sur une croix ou « crucifié » ; ceci représente son passage par les Équinoxes."},{"b":"text","l":"Le « Soleil de Dieu » meurt pendant trois jours — Symbolique universelle","t":"Dans de nombreuses cultures, le calendrier commençait initialement dans la constellation de la Vierge : le soleil était donc « né d'une Vierge ». Le Soleil est la « Lumière du Monde ». Les « disciples » du Soleil sont les 12 mois et les 12 signes du zodiaque. Le Soleil à 12 heures est dans la maison du « Plus Haut ». Il entre dans chaque signe à 30° — « le Soleil de Dieu commence son ministère à l'âge de 30 ans ». Le Soleil est tenu sur une croix ou « crucifié » ; ceci représente son passage par les Équinoxes.\n\nLe Solstice d'Hiver, repris dans tous les rites, reprend ce passage qui se déplace vers le sud pendant trois jours et recommence ensuite sa progression vers le Nord. À cette période, les Anciens disaient que le « Soleil de Dieu » était « mort » pour trois jours, avant de « ressusciter » le 25 décembre.\n\nCe « Soleil de Dieu » meurt pendant trois jours le 22 décembre, lors du Solstice d'hiver, quand il arrête son mouvement vers le Sud, avant de renaître le 25 décembre, lorsqu'il reprend son mouvement vers le Nord."},{"b":"hi","t":"Les Forces Cosmiques sont au Zénith de leur activité spirituelle. La Tradition procède ce jour-là à un grand Rituel d'Adoration fêtant la « brèche » qui s'effectue sur les Hauts Plans et qui permet le passage de Forces Immenses. C'est pour cette raison que l'Église a situé la Nativité vers cette date."},{"b":"serge","t":"L'hiver permet — semble-t-il — une meilleure communication sur le plan mental, grâce à l'ouïe mentale. L'hiver permet d'atteindre un plus haut niveau de développement, même au niveau de la Foi. Je rappelle que si la Volonté dépend de l'Élément Feu, la Foi dépend de l'Élément Eau.\n\nL'hiver, moment privilégié pour les travaux magiques ; grâce au froid des nuits glaciales, des lieux se retrouvent déserts. Je ne conseille les cimetières qu'aux âmes fortes ; d'autres lieux dans les forêts autour des villes sont des lieux sûrs. Des ruines également se prêtent à de magnifiques rituels de Magie ; la tension créée par ces lieux « étranges » renforce la puissance mentale et émotionnelle du Mage. Cette tension renforce la Force de la polarité de chaque Élément et aide à la réussite de l'action magique.\n\nIl est vrai aussi qu'une belle opération de Magie peut se réaliser chez vous, dans le confort de votre appartement ou maison. Encens divers, couleurs adaptées, musiques bien choisies, le plus souvent religieuses vous permettent d'accéder plus facilement dans les espaces du monde invisible.\n\nIdentifiez-vous au Dieu de votre croyance ! Et sans cesse, renforcez cette identification. Devenir et être UN avec Dieu. Seul moyen de hâter le haut développement de tout votre être."},{"b":"mantra","l":"Mantra du Solstice d'Hiver","t":"Note initiatique de Serge : En Initiation, la nuit du Solstice d'Hiver est une des nuits les plus importantes de l'année. La brèche s'ouvre. Soyez disponibles pour recevoir ces énergies exceptionnelles. Débarrassez-vous totalement de vos énergies négatives au soir du 21 décembre."}]},{"date":"24-25 déc","month":"Décembre","type":"litu","title":"NOËL — La Nativité · Le VERBE SE FAIT CHAIR","sub":"Nuit la plus sacrée · Moment mystique le plus important · Espace rempli d'amour","content":[{"b":"text","l":"Noël — Espace rempli d'amour","t":"Espace rempli d'amour, de régénération, de joie. Moment mystique le plus important de l'année. Vivre ce secret dans la tête si vous êtes parmi des personnes qui ne partagent pas ces idées. Naissance : condensation dans la matière de l'Énergie spirituelle. Meilleur moment pour concrétiser un projet."},{"b":"text","l":"Pourquoi Noël au Solstice","t":"C'est pour cette raison que l'Église a situé la Nativité vers cette date, récupérant les anciennes pratiques dites « paiënnes ». Les Forces Cosmiques sont au Zénith de leur activité spirituelle. La Tradition fête « la brèche » qui s'effectue sur les Hauts Plans et qui permet le passage de Forces Immenses."},{"b":"text","l":"Le VERBE SE FAIT CHAIR","t":"Novembre/Décembre = Carême matériel et initiatique : concrétisation de la Vraie Vie dans la Matière car le VERBE SE FAIT CHAIR. Perdre l'adulte pour un enfant. C'est aussi la fin du 2ème grand Carême de l'année."},{"b":"serge","t":"Sa LUMIÈRE ÉTINCELANTE repousse les forces négatives !!! JANUS : Dieu secret des solstices en tant qu'androgyne. Réunion de 2 fronts ou la réunion des contraires (ombre et lumière). Vous comprenez pourquoi Christ est nécessaire fin décembre…"},{"b":"text","l":"Les Quatre Jours de Noël","t":"— 25 décembre : Noël\n— 26 décembre : Saint Étienne\n— 27 décembre : Saint Jean\n— 28 décembre : Les Saints Innocents\n\nSoit en clair, un moment des plus importants comme des plus secrets du Grand Œuvre. Cette série de 4 jours, où se trouve-t-elle ? Dans le Capricorne. De l'autre côté du zodiaque, dans le Cancer, ces 4 jours sont « encadrés » par : Jean-Baptiste le 24 juin / Fête de Saint Pierre et de Saint Paul, le 29 juin.\n\nConstats : Saint Pierre est à l'opposé de Jésus, de l'autre côté de Noël. Pierre a été bien crucifié, mais à l'envers de Jésus, soit tête en bas. Pour cette raison, Saint Pierre de Rome a été orienté à l'envers, chœur à l'Ouest. Jean-Baptiste et Pierre sont le corps du Vieil Homme, l'enveloppe extérieure, visible de l'Église.\n\nEn clair : Noël, Étienne, Jean l'Évangéliste, les Saints Innocents apparaissent entourés, encadrés par Pierre et Jean le Baptiste. Mais en même temps, ils sont en face et à l'envers ! Comme le dit la Tradition secrète : **Le monde visible est à l'envers du monde spirituel.**\n\nRécapitulons : Jésus, Étienne, Jean l'Évangéliste, les Saints Innocents sont au centre = Église ésotérique. Encadrés par Pierre et Jean le Baptiste = l'Église exotérique, à l'extérieur.\n\nLe Cancer est un signe de dualité et si la Lumière Christique croît au Capricorne, elle décroît au Cancer."},{"b":"mantra","l":"Mantra de Noël — Serge","t":"« Dès cet instant, grâce à Toi Christ et joyeusement en Toi Christ, je suis purifié et libéré de……… »"},{"b":"quote","t":"« 6 » est le nombre du Christ Cosmique, l'Alpha et l'Oméga, le début et la fin de tout. Par la Loi des Correspondances qui unit l'infiniment grand et l'infiniment petit, le mois de Janvier est l'Alpha et Décembre est l'Oméga de notre calendrier actuel. Tout est infiniment logique."},{"b":"text","l":"Noël cosmologique — né de la Vierge, les trois étoiles d'Orion","t":"Le 25 décembre, le soleil entre dans la constellation du Capricorne. Symbole du Capricorne : les grottes, les montagnes. C'est dans l'obscurité d'une grotte que l'enfant JÉSUS peut naître. Pendant l'hiver, les jours diminuent, les nuits s'allongent. Le moment est à la méditation, au recueillement, permettant à l'humain de pénétrer les profondeurs de son être.\n\nQuand il sort de la Constellation du Capricorne, le soleil entre dans celle du Verseau. Symbole du Verseau : c'est l'eau, le baptême, la vie qui jaillit. Au sortir du Verseau, le soleil entre dans les Poissons : a lieu cette pêche dont Jésus parlait quand il disait à Ses disciples qu'ils seraient des pêcheurs d'hommes.\n\nChaque année le 25 décembre à minuit, la Constellation de la Vierge monte à l'horizon. C'est pourquoi on dit que Jésus est né de la Vierge. À l'opposé, apparaissent les Poissons, au milieu du ciel, la splendide Constellation d'Orion. Dans son centre, merveilleusement alignées, les trois étoiles qui représentent les trois Rois Mages !\n\nLa Tradition dit aussi que Jésus est né en Palestine. C'est l'aspect historique de Noël, et l'aspect historique pour les Initiés est secondaire."},{"b":"text","l":"Noël pour les Initiés — la série des 4 jours et le secret de Saint Pierre","t":"L'Archange Gabriel de la Sphère de Iesod (la Lune) condense les choses le 25 décembre : une descente dans la matière, une condensation d'énergie, une cristallisation, à l'image de l'hiver où tout s'immobilise. Lorsque les Initiés veulent matérialiser une idée, un projet, ils utilisent cette fête car toutes les conditions idéales sont réunies. Seule la fête de Noël est liée à une réalisation sur la terre. Noël amène la Régénération, la Lumière, la Concrétisation d'un projet qui leur tient à cœur.\n\nLa série des 4 jours de Noël : 25 décembre Noël · 26 décembre Saint Étienne · 27 décembre Saint Jean · 28 décembre Les Saints Innocents. Un moment des plus importants comme des plus secrets du Grand'Œuvre. Cette série se trouve dans le Capricorne ; de l'autre côté du zodiaque, dans le Cancer, ces 4 jours sont « encadrés » par Jean-Baptiste le 24 juin et la Fête de Saint Pierre et Saint Paul le 29 juin.\n\nConstat : Saint Pierre est à l'opposé de Jésus, de l'autre côté de Noël. Pierre a été bien crucifié mais à l'envers de Jésus, tête en bas. Pour cette raison, Saint Pierre de Rome a été orienté à l'envers, chœur à l'Ouest. D'autant plus saisissant si vous lisez l'Évangile de Marc (VIII, 33) : « Vade Retro Satanas ! Retire-toi, Satan, car tu ne comprends point les choses qui sont de Dieu. »\n\nDécodons : Jésus, Étienne, Jean l'Évangéliste, les Saints Innocents sont au centre : Église ésotérique. Encadrés par Pierre et Jean le Baptiste, soit l'Église exotérique, à l'extérieur. Mais en même temps, ils sont en face et à l'envers ! Comme le dit la Tradition secrète : le monde visible est à l'envers du monde spirituel."},{"b":"text","l":"Noël pour chaque être humain — neuf mois de gestation","t":"Noël est une date si importante qu'elle se prépare longtemps à l'avance. Vous avez un an pour dépasser le stade de l'intellect et approfondir le sujet. Pensez, méditez, ainsi peu à peu va se concrétiser en vous l'Enfant Christ.\n\nIl ne va pas naître comme cela le 25 décembre à minuit, entre deux coupes de champagne et trois petits fours... Votre cœur et vos émotions doivent participer à cette gestation ; pour cela, il faut du temps. Combien de mois la maman garde-t-elle son enfant dans son ventre ? Neuf mois !\n\nComment l'enfant va-t-il naître sur le plan physique ? Grâce à sa mère, la Terre. Votre corps physique est en correspondance avec la planète Terre. La Terre transmute votre corps physique, vous débarrasse, par les Chakras des pieds, de toutes impuretés, si vous le demandez.\n\nComment aider cette réelle Cristallisation Divine de l'Enfant Christ en vous ? La réponse vous est donnée par les paroles que l'Ange dit aux Bergers cette nuit divine : « Gloire à Dieu au plus Haut des Cieux et Paix sur la Terre aux hommes qu'Il aime. » — La Gloire en Haut, la Paix en Bas.\n\nC'est seulement en glorifiant Dieu, Le remerciant sans cesse, que la Paix s'installe ! Cette Paix s'installe dans l'être humain par la venue de l'Enfant Christ. L'Amour Divin apporte la plénitude dans votre vie. Votre évolution réelle se fait à l'intérieur de vous. L'immensité de l'Amour de Divine Providence vous fait progresser bien plus vite que toutes les recherches littéraires."},{"b":"serge","t":"Réflexion finale de Serge sur Noël — Les Anges chantent ; les Initiés, les Grands Maîtres prient et louent Dieu... et les humains s'empiffrent et boivent, inconscients de l'importance de cet événement qui n'a lieu qu'une fois l'an. Un être fermé aux courants divins ne peut rien recevoir.\n\nLa naissance de Jésus, c'est une Énergie d'Amour et de Lumière. Le but de tout cela : que Christ naisse dans chaque être humain ! Il ne suffit pas de chanter « Il est né le Divin Enfant », il faut faire expanser en soi la Lumière et l'Amour afin que l'Enfant Jésus s'expanse harmonieusement.\n\nChaque année, le même Événement Cosmique se produit mais à chaque instant, CHRIST peut naître en vous ou en vos amis.\n\nNotes de fin 2022 : Préparez Noël dans votre tête et votre cœur. Écoutez des chants de Noël ; créez une ambiance de fête. Préparez-vous à JETER hors de VOTRE VIE toutes personnes qui vous pourrissent la vie, tout ce qui est faux, mensonges, nuisibles... humains ou matière !\n\nSouvenez-vous : au début décembre, des conflits éclatent souvent en couple et en famille, et cela jusqu'à peu près les fêtes. Rien de grave si on sait cela. On peut contrôler !"},{"b":"text","l":"La Chronologie de Jésus et les Mystères du Rosaire","t":"Chronologie intéressante de Jésus : Baptême avec Jean-Baptiste (baptême avec l'eau) → 40 jours dans le désert pour préparer sa mission → Pâques → 40 jours plus tard : Ascension (temps pour préparer les Apôtres) → 10 jours plus tard : Pentecôte (Baptême dans l'Esprit Saint, envoi en mission).\n\nÀ chaque dizaine du chapelet, on peut méditer sur un « Mystère » de la vie de Marie et de Jésus. Cinq mystères joyeux : l'Annonciation, la Visitation, Noël, Jésus présenté au Temple, Jésus perdu et retrouvé au Temple. Cinq mystères douloureux : l'agonie au jardin des Oliviers, la flagellation, le couronnement d'épines, Jésus porte sa Croix, Jésus meurt sur la Croix. Cinq mystères glorieux : la Résurrection, l'Ascension, la Pentecôte, l'Assomption, le couronnement de Marie au ciel. Jean-Paul II a ajouté cinq mystères lumineux : Jésus baptisé au Jourdain, les noces de Cana, Jésus annonce le Royaume, la Transfiguration, l'institution de l'Eucharistie.\n\nDieu sollicite la collaboration des hommes pour réaliser son projet. Toujours demander l'accord de Dieu avant de partir en campagne ou de construire un projet."},{"b":"serge","t":"Je ne nie pas les faits historiques, mais pour les Initiés ils sont secondaires : se chamailler pour savoir si Jésus est né dans une étable ou une grotte n'est pas l'essentiel. Le Christ doit naître en chacun de vous comme Principe de Lumière. À Noël, pensez à vos projets matériels : Christ vous aidera à les réaliser. Et travaillez à faire naître l'Enfant Jésus en vous."}]}];

var MONTHS=['Janvier','F\u00e9vrier','Mars','Avril','Mai','Juin','Juillet','Ao\u00fbt','Septembre','Octobre','Novembre','D\u00e9cembre'];
var TL={litu:'Liturgique',cosm:'Cosmique',prat:'Pratique',ense:'Enseignement',mois:'Mois / Cycle'};
var BG={litu:'#E6EFE8',cosm:'#F5ECDD',prat:'#E4EBF4',ense:'#EFE6F0',mois:'#F3E4E2'};
var COL={litu:'#3F6B4F',cosm:'#7E6234',prat:'#46607F',ense:'#694C6E',mois:'#844741'};
var activeFilter='all';
var _DATA=null;
var _touchY=0;

function getData(){
  if(_DATA) return _DATA;
  _DATA=[].concat(D_JANVIER,D_FEVRIER,D_MARS,D_AVRIL,D_MAI,D_JUIN,
                  D_JUILLET,D_AOUT,D_SEPTEMBRE,D_OCTOBRE,D_NOVEMBRE,D_DECEMBRE);
  for(var i=0;i<_DATA.length;i++) _DATA[i]._i=i;
  return _DATA;
}

function esc(s){
  if(!s) return '';
  return s.split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;');
}

function bold(s){
  if(!s) return '';
  var out='';
  var parts=s.split('**');
  for(var i=0;i<parts.length;i++){
    if(i%2===1) out+='<strong>'+parts[i]+'<\/strong>';
    else out+=parts[i];
  }
  return out;
}

function toPs(t){
  if(!t) return '';
  var lines=t.split('\n');
  var html='';
  for(var i=0;i<lines.length;i++){
    if(lines[i].trim()) html+='<p>'+bold(lines[i])+'<\/p>';
  }
  return html;
}


var MC=['#3E6286','#5E5689','#3F7343','#4F7A2A','#9A4462','#7E600F','#9A5A18','#9A4A2C','#7E5E1E','#87442A','#5E4A60','#8A2A33'];
var MT=['#E6EDF4','#ECEAF3','#E7F0E5','#EDF3E1','#F6E7EC','#F6EFD9','#F8EADB','#F5E5DD','#F2EBDB','#F2E3DB','#EBE5EB','#F3E1E2'];
function openMonths(){
  var main=document.getElementById('main'),h='',cm=new Date().getMonth();
  for(var i=0;i<12;i++){
    var sec=main.querySelector('.ms.m'+i);
    var n=sec?sec.querySelectorAll('.ev').length:0;
    h+='<div class="mt'+(i===cm?' cur':'')+(n?'':' off')+'" data-m="'+i+'" style="background:'+MT[i]+';color:'+MC[i]+'">'+MONTHS[i]
      +'<small>'+(n?n+(n>1?' fiches':' fiche'):'—')+'<\/small><\/div>';
  }
  document.getElementById('mgrid').innerHTML=h;
  document.getElementById('mpick').className='mpick open';
  document.getElementById('mbtn').className='mbtn on';
}
function closeMonths(){
  document.getElementById('mpick').className='mpick';
  document.getElementById('mbtn').className='mbtn';
}
function goMonth(i){
  var main=document.getElementById('main'),el=main.querySelector('.ms.m'+i);
  closeMonths();
  if(el) main.scrollTop+=el.getBoundingClientRect().top-main.getBoundingClientRect().top;
}

var AMAP={'\u00e0':'a','\u00e2':'a','\u00e4':'a','\u00e1':'a','\u00e3':'a','\u00e5':'a','\u00e9':'e','\u00e8':'e','\u00ea':'e','\u00eb':'e','\u00ee':'i','\u00ef':'i','\u00ed':'i','\u00ec':'i','\u00f4':'o','\u00f6':'o','\u00f3':'o','\u00f2':'o','\u00f5':'o','\u00f9':'u','\u00fb':'u','\u00fc':'u','\u00fa':'u','\u00ff':'y','\u00e7':'c','\u00f1':'n','\u0153':'oe','\u00e6':'ae'};
var _Q='';var _QW=[];var _IDX=null;var _first=true;var _pushed=false;
function nm(s,withMap){
  s=s||'';
  var out=[],map=withMap?[]:null,prevSp=true;
  for(var i=0;i<s.length;i++){
    var c=s.charAt(i).toLowerCase();
    if(c.length>1) c=c.charAt(0);
    var r=AMAP[c];
    if(r===undefined){
      var code=c.charCodeAt(0);
      if((code>=97&&code<=122)||(code>=48&&code<=57)||(code>191&&code<8192&&code!==215&&code!==247)) r=c; else r=' ';
    }
    for(var k=0;k<r.length;k++){
      var ch=r.charAt(k);
      if(ch===' '){ if(prevSp) continue; prevSp=true; } else prevSp=false;
      out.push(ch); if(map) map.push(i);
    }
  }
  return withMap?{s:out.join(''),m:map}:out.join('');
}
function plain(e){
  var parts=[];
  var c=e.content||[];
  for(var i=0;i<c.length;i++){
    if(c[i].l) parts.push(c[i].l);
    if(c[i].t) parts.push(c[i].t);
    if(c[i].items) parts.push(c[i].items.join(' \u00b7 '));
  }
  return parts.join(' \u00b7 ').split('**').join('').split('\n').join(' ');
}
function getIdx(){
  if(_IDX) return _IDX;
  var D=getData();_IDX=[];
  for(var i=0;i<D.length;i++){
    var e=D[i];
    _IDX.push(nm([e.title,e.sub||'',e.date,e.month,TL[e.type],plain(e)].join(' | ')));
  }
  return _IDX;
}
function matches(i){
  if(!_QW.length) return true;
  var s=getIdx()[i];
  for(var k=0;k<_QW.length;k++){ if(s.indexOf(_QW[k])<0) return false; }
  return true;
}
function ranges(str){
  var o=nm(str,true),rs=[];
  for(var k=0;k<_QW.length;k++){
    var w=_QW[k],p=o.s.indexOf(w);
    while(p>=0){ rs.push([o.m[p],o.m[p+w.length-1]+1]); p=o.s.indexOf(w,p+w.length); }
  }
  rs.sort(function(a,b){return a[0]-b[0];});
  var mg=[];
  for(var i=0;i<rs.length;i++){
    if(mg.length&&rs[i][0]<=mg[mg.length-1][1]){ if(rs[i][1]>mg[mg.length-1][1]) mg[mg.length-1][1]=rs[i][1]; }
    else mg.push([rs[i][0],rs[i][1]]);
  }
  return mg;
}
function hl(str){
  if(!str) return '';
  if(!_QW.length) return esc(str);
  var rs=ranges(str),out='',pos=0;
  for(var i=0;i<rs.length;i++){
    out+=esc(str.substring(pos,rs[i][0]))+'<mark>'+esc(str.substring(rs[i][0],rs[i][1]))+'<\/mark>';
    pos=rs[i][1];
  }
  return out+esc(str.substring(pos));
}
function snippet(e){
  var head=nm(e.title+' '+(e.sub||''));
  var need=false;
  for(var k=0;k<_QW.length;k++){ if(head.indexOf(_QW[k])<0){ need=true; break; } }
  if(!need) return '';
  var txt=plain(e),o=nm(txt,true),best=-1;
  for(var k=0;k<_QW.length;k++){
    if(head.indexOf(_QW[k])>=0) continue;
    var p=o.s.indexOf(_QW[k]);
    if(p>=0&&(best<0||p<best)) best=p;
  }
  if(best<0) return '';
  var at=o.m[best],st=Math.max(0,at-45),en=Math.min(txt.length,at+105);
  if(st>0){ var sp=txt.indexOf(' ',st); if(sp>=0&&sp<at) st=sp+1; }
  if(en<txt.length){ var sp2=txt.lastIndexOf(' ',en); if(sp2>at) en=sp2; }
  return '<div class="ev-snip">'+(st>0?'\u2026':'')+hl(txt.substring(st,en))+(en<txt.length?'\u2026':'')+'<\/div>';
}
function markIn(root){
  if(!_QW.length||!document.createTreeWalker) return;
  var w=document.createTreeWalker(root,4,null,false),nodes=[],n;
  while((n=w.nextNode())) nodes.push(n);
  for(var i=0;i<nodes.length;i++){
    var t=nodes[i].nodeValue,rs=ranges(t);
    if(!rs.length) continue;
    var fr=document.createDocumentFragment(),pos=0;
    for(var k=0;k<rs.length;k++){
      if(rs[k][0]>pos) fr.appendChild(document.createTextNode(t.substring(pos,rs[k][0])));
      var m=document.createElement('mark');
      m.appendChild(document.createTextNode(t.substring(rs[k][0],rs[k][1])));
      fr.appendChild(m);pos=rs[k][1];
    }
    if(pos<t.length) fr.appendChild(document.createTextNode(t.substring(pos)));
    nodes[i].parentNode.replaceChild(fr,nodes[i]);
  }
}
function setQuery(v){
  _Q=v||'';
  var ws=nm(_Q).split(' ');_QW=[];
  var longW=false;
  for(var i=0;i<ws.length;i++){ if(ws[i].length>1) longW=true; }
  for(var i=0;i<ws.length;i++){ if(ws[i]&&(ws[i].length>1||!longW)) _QW.push(ws[i]); }
  document.getElementById('srch').className=_Q?'srch has':'srch';
  render();
  document.getElementById('main').scrollTop=0;
}

function render(){
  var D=getData();
  var main=document.getElementById('main');
  var html='';
  var filtered=[];
  for(var i=0;i<D.length;i++){
    if((activeFilter==='all'||D[i].type===activeFilter)&&matches(i)) filtered.push(D[i]);
  }
  if(!filtered.length){
    if(_QW.length) main.innerHTML='<div class="empty">Aucun r\u00e9sultat pour \u00ab\u00a0'+esc(_Q)+'\u00a0\u00bb'
      +(activeFilter!=='all'?'<small>dans le filtre \u00ab\u00a0'+TL[activeFilter]+'\u00a0\u00bb \u2014 touchez \u00ab\u00a0Tous\u00a0\u00bb pour chercher partout<\/small>':'<small>Essayez un autre mot ou une partie du mot<\/small>')+'<\/div>';
    else main.innerHTML='<div class="empty">Aucun \u00e9v\u00e9nement<\/div>';
    hideLoader();
    return;
  }
  if(_QW.length) html+='<div class="qres">'+filtered.length+' r\u00e9sultat'+(filtered.length>1?'s':'')+' pour \u00ab\u00a0'+esc(_Q)+'\u00a0\u00bb<\/div>';
  var groups={};
  for(var i=0;i<filtered.length;i++){
    var e=filtered[i];
    if(!groups[e.month]) groups[e.month]=[];
    groups[e.month].push(e);
  }
  for(var mi=0;mi<MONTHS.length;mi++){
    var mn=MONTHS[mi];
    if(!groups[mn]) continue;
    var evts=groups[mn];
    html+='<div class="ms m'+mi+'"><div class="mh"><div class="mn">'+mn+'<\/div><div class="ml"><\/div><div class="mc">'+evts.length+'<\/div><\/div>';
    for(var j=0;j<evts.length;j++){
      var e=evts[j];
      var sub=(e.sub?'<div class="ev-sub">'+hl(e.sub)+'<\/div>':'')+(_QW.length?snippet(e):'');
      html+='<div class="ev '+e.type+'" onclick="openPanel('+e._i+')">'
           +'<div class="ev-accent"><\/div>'
           +'<div class="ev-body">'
           +'<div class="ev-top"><span class="ev-tag">'+TL[e.type]+'<\/span>'
           +'<span class="ev-date">'+esc(e.date)+'<\/span><\/div>'
           +'<div class="ev-title">'+hl(e.title)+'<\/div>'+sub
           +'<\/div><div class="ev-arr">&#8250;<\/div><\/div>';
    }
    html+='<\/div>';
  }
  main.innerHTML=html;
  hideLoader();
  if(_first){
    _first=false;
    var cm=new Date().getMonth(),el=main.querySelector('.ms.m'+cm);
    if(el&&cm>0) main.scrollTop+=el.getBoundingClientRect().top-main.getBoundingClientRect().top;
  }
}

function hideLoader(){
  var ldr=document.getElementById('ldr');
  if(ldr) ldr.style.display='none';
}

function openPanel(idx){
  var D=getData();
  var e=D[idx];
  var pb=document.getElementById('p-type');
  pb.textContent=TL[e.type];
  pb.style.background=BG[e.type];
  pb.style.color=COL[e.type];
  document.getElementById('p-date').textContent=e.date+' \u00b7 '+e.month+' 2026';
  document.getElementById('p-title').innerHTML=hl(e.title);
  document.getElementById('p-sub').innerHTML=hl(e.sub||'');
  var body=document.getElementById('p-body');
  body.innerHTML=buildContent(e.content||[]);
  body.scrollTop=0;
  var qi=document.getElementById('q');if(qi) qi.blur();
  if(_QW.length){
    markIn(body);
    setTimeout(function(){
      var m=body.querySelector('mark');
      if(m) body.scrollTop+=m.getBoundingClientRect().top-body.getBoundingClientRect().top-70;
    },60);
  }
  document.getElementById('panel').className='panel open';
  if(!_pushed&&window.history&&history.pushState){ try{history.pushState({panel:1},'');_pushed=true;}catch(x){} }
}

function closePanel(fromPop){
  document.getElementById('panel').className='panel';
  if(_pushed&&fromPop!==true){ _pushed=false; try{history.back();}catch(x){} }
  else _pushed=false;
}
window.addEventListener('popstate',function(){
  if(document.getElementById('panel').className.indexOf('open')>=0) closePanel(true);
  _pushed=false;
},false);

function buildContent(blocks){
  var html='';
  for(var i=0;i<blocks.length;i++){
    var s=blocks[i];
    var lbl=s.l?'<div class="blk-lbl">'+esc(s.l)+'<\/div>':'';
    var t=s.t||'';
    if(s.b==='text'){
      html+='<div class="blk">'+lbl+toPs(t)+'<\/div>';
    } else if(s.b==='eileen'){
      html+='<div class="blk"><div class="eileen"><span class="e-tag">Petite Voix \u2014 Eileen Caddy<\/span>'+toPs(t)+'<\/div><\/div>';
    } else if(s.b==='serge'){
      html+='<div class="blk"><div class="serge"><span class="s-tag">\u2192 Note de Serge<\/span>'+toPs(t)+'<\/div><\/div>';
    } else if(s.b==='quote'){
      html+='<div class="blk">'+lbl+'<blockquote>'+bold(t.split('\n\n').join('<br><br>').split('\n').join('<br>'))+'<\/blockquote><\/div>';
    } else if(s.b==='hi'){
      html+='<div class="blk"><div class="hi">'+bold(t)+'<\/div><\/div>';
    } else if(s.b==='danger'){
      html+='<div class="blk"><div class="danger">'+bold(t)+'<\/div><\/div>';
    } else if(s.b==='mantra'){
      html+='<div class="blk"><div class="mantra"><span class="m-lbl">'+esc(s.l||'Mantra')+'<\/span>'
           +'<div class="m-txt">'+bold(t.split('\n').join('<br>'))+'<\/div><\/div><\/div>';
    } else if(s.b==='pratique'){
      var inner='';
      if(s.items){
        inner='<ul>';
        for(var k=0;k<s.items.length;k++) inner+='<li>'+bold(esc(s.items[k]))+'<\/li>';
        inner+='<\/ul>';
      } else { inner=toPs(t); }
      html+='<div class="blk"><div class="pratique"><span class="pr-lbl">'+esc(s.l||'Pratique')+'<\/span>'+inner+'<\/div><\/div>';
    }
  }
  return html;
}

document.getElementById('filters').addEventListener('click',function(ev){
  var btn=ev.target;
  while(btn&&btn.getAttribute&&!btn.getAttribute('data-type')){btn=btn.parentNode;}
  if(!btn||!btn.getAttribute) return;
  var type=btn.getAttribute('data-type');
  if(type===activeFilter) return;
  activeFilter=type;
  var tags=document.querySelectorAll('.ftag');
  for(var i=0;i<tags.length;i++){
    var el=tags[i];
    var dt=el.getAttribute('data-type');
    el.className='ftag '+dt;
    if(type!=='all'&&dt!==type) el.className+=' inactive';
  }
  render();
},false);

document.getElementById('panel').addEventListener('touchstart',function(ev){
  _touchY=ev.touches[0].clientY;
},{passive:true});
document.getElementById('panel').addEventListener('touchmove',function(ev){
  var dy=ev.touches[0].clientY-_touchY;
  var pb=document.getElementById('p-body');
  if(dy>0&&pb.scrollTop===0){
    var v=Math.min(dy*0.5,80);
    document.getElementById('panel').style.webkitTransform='translateY('+v+'px)';
    document.getElementById('panel').style.transform='translateY('+v+'px)';
  }
},{passive:true});
document.getElementById('panel').addEventListener('touchend',function(ev){
  var dy=ev.changedTouches[0].clientY-_touchY;
  document.getElementById('panel').style.webkitTransform='';
  document.getElementById('panel').style.transform='';
  if(dy>60&&document.getElementById('p-body').scrollTop===0) closePanel();
},{passive:true});

document.getElementById('panel-back-btn').addEventListener('click',function(){closePanel();},false);
document.getElementById('pback2').addEventListener('click',function(ev){ev.stopPropagation();closePanel();},false);
(function(){
  var main=document.getElementById('main'),tt=document.getElementById('totop'),on=false;
  main.addEventListener('scroll',function(){
    var v=main.scrollTop>700;
    if(v!==on){on=v;tt.className=v?'fbtn show':'fbtn';}
  },{passive:true});
  tt.addEventListener('click',function(){main.scrollTop=0;},false);
})();
document.getElementById('mbtn').addEventListener('click',function(){
  if(document.getElementById('mpick').className.indexOf('open')>=0) closeMonths(); else openMonths();
},false);
document.getElementById('mpick-bg').addEventListener('click',closeMonths,false);
document.getElementById('mpick-x').addEventListener('click',closeMonths,false);
document.getElementById('mgrid').addEventListener('click',function(ev){
  var t=ev.target;
  while(t&&t.getAttribute&&t.getAttribute('data-m')===null) t=t.parentNode;
  if(t&&t.getAttribute) goMonth(parseInt(t.getAttribute('data-m'),10));
},false);
(function(){
  var q=document.getElementById('q'),tm=null;
  q.addEventListener('input',function(){
    var v=q.value;document.getElementById('srch').className=v?'srch has':'srch';
    if(tm) clearTimeout(tm);
    tm=setTimeout(function(){setQuery(q.value);},180);
  },false);
  q.addEventListener('keydown',function(ev){
    if(ev.keyCode===13){ev.preventDefault();if(tm) clearTimeout(tm);setQuery(q.value);q.blur();}
    else if(ev.keyCode===27){q.value='';setQuery('');}
  },false);
  q.addEventListener('search',function(){ if(!q.value) setQuery(''); },false);
  document.getElementById('qx').addEventListener('click',function(){
    q.value='';setQuery('');q.focus();
  },false);
})();

setTimeout(function(){
  render();
},0);

</script>
