<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>Calendrier Spirituel 2026</title>
<style>


*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5F1EA;--surface:#FFFFFF;--ink:#18160F;--ink2:#4A4740;--ink3:#5C5650;--line:#D5CFBF;
  --serif:'Lora',Georgia,serif;--mono:'IBM Plex Mono',monospace;
  --litu:#1A5C36;--litu-bg:#C8EDD8;--litu-light:#EAF7EF;
  --cosm:#7A4800;--cosm-bg:#FFD99A;--cosm-light:#FFF8EC;
  --prat:#0A3D7A;--prat-bg:#B8D4F5;--prat-light:#EEF4FF;
  --ense:#5A1060;--ense-bg:#E8B8F0;--ense-light:#FAF0FC;
  --mois:#8B1A1A;--mois-bg:#F5C8C8;--mois-light:#FDF0F0;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html{height:100%;overflow:hidden}
body{
  background:var(--bg);
  font-family:var(--serif);
  color:var(--ink);
  height:100%;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* ── HEADER ── */
.hdr{
  flex-shrink:0;
  padding:14px 16px 10px;
  background:var(--bg);
  border-bottom:1.5px solid var(--ink);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.hdr-title{font-family:var(--serif);font-size:1rem;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.hdr-sub{font-family:var(--mono);font-size:.68rem;color:var(--ink3);letter-spacing:.06em;margin-top:2px}
.filter-btn{
  background:none;border:1.5px solid var(--line);border-radius:20px;
  font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;
  color:var(--ink3);padding:5px 10px;cursor:pointer;white-space:nowrap;
  transition:all .15s;flex-shrink:0;
}
.filter-btn.active{background:var(--ink);border-color:var(--ink);color:#fff}

/* ── FILTER BAR ── */
.filters{
  flex-shrink:0;
  display:flex;gap:6px;
  padding:8px 16px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  border-bottom:1px solid var(--line);
  background:var(--bg);
}
.filters::-webkit-scrollbar{display:none}
.ftag{
  flex-shrink:0;
  font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;
  padding:5px 10px;border-radius:20px;border:1.5px solid transparent;
  cursor:pointer;transition:all .15s;
}
.ftag.litu{background:var(--litu-bg);color:var(--litu);border-color:var(--litu)}
.ftag.cosm{background:var(--cosm-bg);color:var(--cosm);border-color:var(--cosm)}
.ftag.prat{background:var(--prat-bg);color:var(--prat);border-color:var(--prat)}
.ftag.ense{background:var(--ense-bg);color:var(--ense);border-color:var(--ense)}
.ftag.mois{background:var(--mois-bg);color:var(--mois);border-color:var(--mois)}
.ftag.all{background:var(--ink);color:#fff;border-color:var(--ink)}
.ftag.inactive{opacity:.35;filter:grayscale(.5)}

/* ── MAIN SCROLL AREA ── */
.main{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:0 0 calc(16px + var(--safe-bottom));
}

/* ── MONTH SECTION ── */
.ms{margin-bottom:4px}
.mh{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px 6px;
  position:sticky;top:0;z-index:10;
  background:var(--bg);
  border-bottom:1px solid var(--line);
}
.mn{font-family:var(--serif);font-size:.95rem;font-weight:600}
.ml{flex:1;height:1px;background:var(--line)}
.mc{font-family:var(--mono);font-size:.74rem;color:var(--ink3);letter-spacing:.05em}

/* ── EVENT CARD ── */
.ev{
  display:flex;align-items:stretch;
  margin:0 12px 6px;
  border-radius:8px;
  background:var(--surface);
  border:1px solid var(--line);
  overflow:hidden;
  cursor:pointer;
  transition:transform .1s,box-shadow .1s;
  -webkit-touch-callout:none;
}
.ev:active{transform:scale(.98);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ev-accent{width:4px;flex-shrink:0}
.ev.litu .ev-accent{background:var(--litu)}
.ev.cosm .ev-accent{background:#C97A00}
.ev.prat .ev-accent{background:#1A5FBF}
.ev.ense .ev-accent{background:#8A1A9A}
.ev.mois .ev-accent{background:#C02020}
.ev-body{flex:1;padding:10px 12px;min-width:0}
.ev-top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.ev-tag{
  font-family:var(--mono);font-size:.7rem;letter-spacing:.07em;
  padding:2px 6px;border-radius:3px;flex-shrink:0;font-weight:500;
}
.ev.litu .ev-tag{background:var(--litu-bg);color:var(--litu)}
.ev.cosm .ev-tag{background:var(--cosm-bg);color:var(--cosm)}
.ev.prat .ev-tag{background:var(--prat-bg);color:var(--prat)}
.ev.ense .ev-tag{background:var(--ense-bg);color:var(--ense)}
.ev.mois .ev-tag{background:var(--mois-bg);color:var(--mois)}
.ev-date{font-family:var(--mono);font-size:.8rem;color:var(--ink3);font-weight:bold}
.ev-title{font-family:var(--serif);font-size:.9rem;font-weight:600;line-height:1.25;color:var(--ink)}
.ev-sub{font-family:var(--mono);font-size:.7rem;color:var(--ink3);line-height:1.4;margin-top:2px}
.ev-arr{
  display:flex;align-items:center;justify-content:center;
  padding:0 12px;flex-shrink:0;
  font-size:1rem;color:var(--line);
}
.ev:active .ev-arr{color:var(--ink3)}

/* ── PANEL (full-screen overlay) ── */
.panel{
  position:fixed;inset:0;
  background:var(--surface);
  z-index:200;
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.panel.open{transform:translateY(0)}
.panel-hdr{
  flex-shrink:0;
  padding:12px 16px 10px;
  border-bottom:1px solid var(--line);
  background:var(--surface);
}
.panel-back{
  display:flex;align-items:center;gap:6px;
  background:none;border:none;cursor:pointer;
  font-family:var(--mono);font-size:.7rem;letter-spacing:.05em;
  color:var(--ink3);padding:0;margin-bottom:10px;
}
.panel-back svg{width:14px;height:14px;flex-shrink:0}
.panel-badges{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.panel-type{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;padding:3px 8px;border-radius:3px;font-weight:500}
.panel-datestr{font-family:var(--mono);font-size:.82rem;color:var(--ink3)}
.panel-title{font-family:var(--serif);font-size:1.1rem;font-weight:600;line-height:1.3;color:var(--ink)}
.panel-sub{font-family:var(--mono);font-size:.68rem;color:var(--ink3);margin-top:4px;line-height:1.4;font-style:italic}
.panel-body{
  flex:1;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:16px 16px calc(16px + var(--safe-bottom));
}

/* ── CONTENT BLOCKS ── */
.blk{margin-bottom:16px}
.blk-lbl{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3);padding-bottom:5px;margin-bottom:6px;border-bottom:1px solid var(--line);
}
.blk p{font-size:.9rem;line-height:1.75;color:var(--ink2)}
.blk p+p{margin-top:8px}
.blk ul{list-style:none;padding:0}
.blk ul li{
  font-size:.9rem;line-height:1.65;color:var(--ink2);
  padding:4px 0 4px 14px;position:relative;
}
.blk ul li::before{content:'›';position:absolute;left:0;color:var(--ink3);font-size:1rem;line-height:1.5}
blockquote{
  border-left:3px solid var(--ink3);padding:8px 0 8px 14px;margin:8px 0;
  font-family:var(--serif);font-style:italic;font-size:.9rem;color:var(--ink);line-height:1.7;
}

/* SPECIAL BLOCKS */
.mantra{
  border:1.5px solid #B87800;background:#FFFBF0;
  padding:14px 16px;border-radius:6px;margin:8px 0;text-align:center;
}
.mantra .m-lbl{font-family:var(--mono);font-size:.67rem;letter-spacing:.1em;text-transform:uppercase;color:#B87800;display:block;margin-bottom:6px}
.mantra .m-txt{font-family:var(--serif);font-style:italic;font-size:1rem;color:var(--ink);line-height:1.7;font-weight:600}

.serge{background:#F3F0E8;border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:8px 0}
.serge .s-tag{font-family:var(--mono);font-size:.67rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:5px}
.serge p{font-size:.9rem;line-height:1.72;color:var(--ink2)}

.eileen{background:#EEF5EE;border-left:3px solid #4A7860;padding:10px 14px;margin:8px 0}
.eileen .e-tag{font-family:var(--mono);font-size:.67rem;letter-spacing:.08em;text-transform:uppercase;color:#4A7860;display:block;margin-bottom:5px}
.eileen p{font-family:var(--serif);font-style:italic;font-size:.9rem;color:var(--ink);line-height:1.7}

.hi{border-left:3px solid #C97A00;background:#FFF9EC;padding:10px 14px;border-radius:0 4px 4px 0;margin:8px 0;font-size:.9rem;line-height:1.7;color:var(--ink2)}
.hi strong{color:var(--ink);font-weight:600}

.danger{border-left:3px solid #C02020;background:#FDF0F0;padding:10px 14px;border-radius:0 4px 4px 0;margin:8px 0;font-size:.9rem;line-height:1.7;color:var(--ink2)}
.danger strong{color:#8B1A1A}

.pratique{border-left:3px solid #1A5FBF;background:#EEF4FF;padding:10px 14px;border-radius:0 4px 4px 0;margin:8px 0}
.pratique .pr-lbl{font-family:var(--mono);font-size:.67rem;letter-spacing:.1em;text-transform:uppercase;color:#1A5FBF;display:block;margin-bottom:5px}
.pratique p,.pratique li{font-size:.9rem;line-height:1.65;color:var(--ink2)}
.pratique ul{list-style:none;padding:0}
.pratique li{padding:4px 0 4px 14px;position:relative}
.pratique li::before{content:'▸';position:absolute;left:0;color:#1A5FBF;font-size:.75rem;line-height:1.75}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:48px 24px;color:var(--ink3);font-family:var(--mono);font-size:.75rem;letter-spacing:.05em}

#ldr{position:fixed;inset:0;background:#F5F1EA;
  display:-webkit-flex;display:flex;
  -webkit-align-items:center;align-items:center;
  -webkit-justify-content:center;justify-content:center;
  z-index:9999;}
.ld{width:9px;height:9px;border-radius:50%;background:#938E85;margin:0 5px;
  -webkit-animation:lda 1.2s infinite ease-in-out;
  animation:lda 1.2s infinite ease-in-out;}
.ld:nth-child(2){-webkit-animation-delay:.2s;animation-delay:.2s}
.ld:nth-child(3){-webkit-animation-delay:.4s;animation-delay:.4s}
@-webkit-keyframes lda{0%,80%,100%{opacity:.2;-webkit-transform:scale(.8)}40%{opacity:1;-webkit-transform:scale(1)}}
@keyframes lda{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}


.drag-handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 10px;flex-shrink:0}
.panel-body{overscroll-behavior:contain}


/* === Types adoucis === */
.ftag.litu{background:#E6EFE8;color:#3F6B4F;border-color:#A9C7B3}
.ftag.cosm{background:#F5ECDD;color:#7E6234;border-color:#D9C29A}
.ftag.prat{background:#E4EBF4;color:#46607F;border-color:#AEBFD6}
.ftag.ense{background:#EFE6F0;color:#694C6E;border-color:#C9B4CD}
.ftag.mois{background:#F3E4E2;color:#844741;border-color:#D7B1AC}
.ftag.all{background:#4A4740;color:#fff;border-color:#4A4740}

/* === Type discret : étiquette neutre + petite pastille === */
.ev-tag,.ev.litu .ev-tag,.ev.cosm .ev-tag,.ev.prat .ev-tag,.ev.ense .ev-tag,.ev.mois .ev-tag{background:transparent;color:var(--ink3);border:1px solid var(--line);padding:1px 6px}
.ev-tag::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;position:relative;top:-1px}
.ev.litu .ev-tag::before{background:#8FB39C}
.ev.cosm .ev-tag::before{background:#CFAE7A}
.ev.prat .ev-tag::before{background:#93A9C7}
.ev.ense .ev-tag::before{background:#B59BBA}
.ev.mois .ev-tag::before{background:#C99791}
/* === Couleur par mois === */
.ms{margin-bottom:10px}
.mh{padding:14px 16px 8px;margin-bottom:8px;border-bottom-width:2px}
.mn{font-size:1.15rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.mc{font-weight:bold}
.ms.m0 .mh{background:#E6EDF4;border-bottom-color:#3E6286}.ms.m0 .mn,.ms.m0 .mc{color:#3E6286}.ms.m0 .ml{background:#3E6286;opacity:.35}.ms.m0 .ev-accent{background:#3E6286}
.ms.m1 .mh{background:#ECEAF3;border-bottom-color:#5E5689}.ms.m1 .mn,.ms.m1 .mc{color:#5E5689}.ms.m1 .ml{background:#5E5689;opacity:.35}.ms.m1 .ev-accent{background:#5E5689}
.ms.m2 .mh{background:#E7F0E5;border-bottom-color:#3F7343}.ms.m2 .mn,.ms.m2 .mc{color:#3F7343}.ms.m2 .ml{background:#3F7343;opacity:.35}.ms.m2 .ev-accent{background:#3F7343}
.ms.m3 .mh{background:#EDF3E1;border-bottom-color:#4F7A2A}.ms.m3 .mn,.ms.m3 .mc{color:#4F7A2A}.ms.m3 .ml{background:#4F7A2A;opacity:.35}.ms.m3 .ev-accent{background:#4F7A2A}
.ms.m4 .mh{background:#F6E7EC;border-bottom-color:#9A4462}.ms.m4 .mn,.ms.m4 .mc{color:#9A4462}.ms.m4 .ml{background:#9A4462;opacity:.35}.ms.m4 .ev-accent{background:#9A4462}
.ms.m5 .mh{background:#F6EFD9;border-bottom-color:#7E600F}.ms.m5 .mn,.ms.m5 .mc{color:#7E600F}.ms.m5 .ml{background:#7E600F;opacity:.35}.ms.m5 .ev-accent{background:#7E600F}
.ms.m6 .mh{background:#F8EADB;border-bottom-color:#9A5A18}.ms.m6 .mn,.ms.m6 .mc{color:#9A5A18}.ms.m6 .ml{background:#9A5A18;opacity:.35}.ms.m6 .ev-accent{background:#9A5A18}
.ms.m7 .mh{background:#F5E5DD;border-bottom-color:#9A4A2C}.ms.m7 .mn,.ms.m7 .mc{color:#9A4A2C}.ms.m7 .ml{background:#9A4A2C;opacity:.35}.ms.m7 .ev-accent{background:#9A4A2C}
.ms.m8 .mh{background:#F2EBDB;border-bottom-color:#7E5E1E}.ms.m8 .mn,.ms.m8 .mc{color:#7E5E1E}.ms.m8 .ml{background:#7E5E1E;opacity:.35}.ms.m8 .ev-accent{background:#7E5E1E}
.ms.m9 .mh{background:#F2E3DB;border-bottom-color:#87442A}.ms.m9 .mn,.ms.m9 .mc{color:#87442A}.ms.m9 .ml{background:#87442A;opacity:.35}.ms.m9 .ev-accent{background:#87442A}
.ms.m10 .mh{background:#EBE5EB;border-bottom-color:#5E4A60}.ms.m10 .mn,.ms.m10 .mc{color:#5E4A60}.ms.m10 .ml{background:#5E4A60;opacity:.35}.ms.m10 .ev-accent{background:#5E4A60}
.ms.m11 .mh{background:#F3E1E2;border-bottom-color:#8A2A33}.ms.m11 .mn,.ms.m11 .mc{color:#8A2A33}.ms.m11 .ml{background:#8A2A33;opacity:.35}.ms.m11 .ev-accent{background:#8A2A33}

/* ── RECHERCHE ── */
.srch{flex-shrink:0;position:relative;padding:8px 16px 0;background:var(--bg)}
.srch input{display:block;width:100%;font-family:var(--serif);font-size:16px;line-height:1.2;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:9px 42px 9px 38px;-webkit-appearance:none;appearance:none;outline:none}
.srch input:focus{border-color:var(--ink3)}
.srch input::placeholder{color:#8F887E}
.srch input::-webkit-search-cancel-button,.srch input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.s-ico{position:absolute;left:29px;top:20px;width:16px;height:16px;color:var(--ink3);pointer-events:none}
.s-x{position:absolute;right:18px;top:8px;width:40px;height:40px;border:none;background:none;color:var(--ink3);font-size:22px;line-height:40px;cursor:pointer;display:none;padding:0}
.srch.has .s-x{display:block}
.qres{font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;color:var(--ink3);padding:10px 16px 0}
.ev-snip{font-family:var(--serif);font-size:.8rem;line-height:1.4;color:var(--ink2);margin-top:4px}
mark{background:#F5DE9B;color:inherit;border-radius:2px;padding:0 1px}
.empty small{display:block;margin-top:8px;font-size:.7rem;opacity:.85}
/* ── INTERTITRES DES FICHES ── */
.blk-lbl{font-family:var(--serif);font-size:1rem;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink);line-height:1.3;padding-bottom:6px;margin-bottom:8px}
/* ── BOUTONS FLOTTANTS ── */
.fbtn{position:absolute;left:16px;bottom:calc(18px + var(--safe-bottom));width:50px;height:50px;border-radius:50%;border:none;background:rgba(74,71,64,.55);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.18);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer;z-index:5;padding:0}
.fbtn svg{width:22px;height:22px}
.fbtn:active{background:rgba(74,71,64,.8)}
#totop{position:fixed;z-index:100;display:none}
#totop.show{display:flex}
.panel-body{padding-bottom:calc(84px + var(--safe-bottom))}
.main{padding-bottom:calc(84px + var(--safe-bottom))}
/* ── MENU DES MOIS ── */
.mbtn{display:flex;align-items:center;gap:6px;flex-shrink:0;background:none;border:1.5px solid var(--line);border-radius:20px;font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;color:var(--ink2);padding:8px 12px;cursor:pointer}
.mbtn svg{width:14px;height:14px}
.mbtn.on{background:var(--ink2);border-color:var(--ink2);color:#fff}
.mpick{position:fixed;inset:0;z-index:150;display:none}
.mpick.open{display:block}
.mpick-bg{position:absolute;inset:0;background:rgba(24,22,15,.35)}
.mpick-sheet{position:absolute;left:0;right:0;top:0;background:var(--bg);border-bottom:1.5px solid var(--ink);padding:14px 16px 16px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.mpick-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mpick-ttl{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.mpick-x{background:none;border:none;font-size:24px;line-height:1;color:var(--ink3);width:40px;height:40px;margin:-10px -10px -10px 0;cursor:pointer}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{border-radius:10px;padding:12px 6px;text-align:center;font-family:var(--serif);font-weight:700;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;border:2px solid transparent;cursor:pointer}
.mt small{display:block;font-family:var(--mono);font-weight:400;font-size:.66rem;letter-spacing:.03em;text-transform:none;margin-top:3px;opacity:.85}
.mt.cur{border-color:currentColor}
.mt.off{opacity:.3;pointer-events:none}
</style>
</head>
<body>

<div id="ldr"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>

<div class="hdr">
  <div>
    <div class="hdr-title">Calendrier Spirituel 2026</div>
    <div class="hdr-sub">Serge Marjollet &middot; Les Douze</div>
  </div>
  <button class="mbtn" id="mbtn" type="button" aria-label="Aller &agrave; un mois"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>Mois</button>
</div>
<div class="mpick" id="mpick"><div class="mpick-bg" id="mpick-bg"></div><div class="mpick-sheet"><div class="mpick-top"><span class="mpick-ttl">Aller au mois</span><button class="mpick-x" id="mpick-x" type="button" aria-label="Fermer">&times;</button></div><div class="mgrid" id="mgrid"></div></div></div>
<div class="srch" id="srch">

<script>
var D_JANVIER=[{"date":"Toute l'année","month":"Janvier","type":"ense","title":"L'Année — Secrets cosmiques","sub":"Nombre 6 · Christ Cosmique · Alpha et Oméga · Les deux grands cycles","content":[{"b":"text","l":"L'Année et son nombre secret","t":"Année = 52 semaines = 52 cartes (5+2=7). 365 jours = 3+6+5 = 5, chiffre de l'humain. L'être humain peut recevoir les Énergies Secrètes et Initiatiques de chaque jour de l'année. Notre calendrier possède un nombre secret qui jamais ne varie : le nombre 6, obtenu par 78, le nombre de chaque année."},{"b":"hi","t":"**« 6 »** est le nombre du Christ Cosmique, l'Alpha et l'Oméga, le début et la fin de tout. Par la Loi des Correspondances, le mois de Janvier est l'Alpha et Décembre est l'Oméga. Décembre et son Décagone, nombre 10, soit 1+0 = 1, le nombre de Dieu. Le 1+6 = 7, nombre créateur dans la matière par excellence."},{"b":"text","l":"Les deux grands cycles annuels","t":"L'année est rythmée par 4 saisons, soit 4 périodes de 3 mois et 1 période de 12 mois. Chaque saison est marquée par un Équinoxe ou un Solstice, et des grandes fêtes religieuses.\n\n— Cycle 1 (Équinoxe de Printemps → Solstice d'Été) : nature MATÉRIELLE. Les Énergies Cosmiques travaillent à la régénération de la matière.\n— Cycle 2 (Équinoxe d'Automne → Solstice d'Hiver) : nature SPIRITUELLE. Les Forces Cosmiques favorisent la retraite du monde matériel, le développement de la Connaissance et de l'Intuition.\n\nQuatre fêtes cardinales correspondent aux Équinoxes et Solstices : Noël · Pâques · Saint Jean · Saint Michel. Les Initiés ont instauré ces fêtes pour qu'à travers les âges, les humains se servent des Forces immenses déclenchées par le soleil. Ces Forces sont particulièrement puissantes et vous permettent d'évoluer, de vous mettre en résonance avec elles et de bénéficier de leurs bienfaits et de leur puissance. À ces époques de l'année, la Mère Divine en personne participe à la Fête. Tous les Archanges, tous les Anges, tous les Êtres de l'Invisible s'amusent, font eux aussi la fête."},{"b":"serge","t":"Chaque année, avoir le courage de voir comment est votre vie. Si vous trouvez qu'elle n'est pas parfaite, autant abandonner ce qui est négatif, car ce qui est négatif d'un côté sera négatif dans tout le reste. En Initiation, on appelle cela : « les nœuds de la corde noire ». Quand un nœud noir se met à bouger, toute la corde se met à bouger. D'un autre côté, dans la Lumière, on appelle cela « la corde blanche ». Quand un nœud se met à bouger, toute la Lumière se met à bouger. Tout est relié.\n\nChaque année on récolte ce que l'on a planté l'année précédente. Une nouvelle année n'est jamais séparée de l'ancienne. Dès le premier jour, dès les premiers instants, elle subit les pensées et les actions que vous mettez en route."},{"b":"text","l":"Orientation du lit — secret cosmique","t":"Le Pôle Nord représente la « Kether » de notre planète : il capte la Force de la Première Émation Divine sur l'Arbre de Vie Cosmique. L'Énergie Divine pénètre notre planète par ce pôle et est captée par les humains par la Tête.\n\nLe Pôle Sud représente la « Malkuth » de notre planète : il expulse les forces négatives par l'Anneau désintégrateur de la Terre. L'Énergie Divine entre par la tête, travaille dans l'être et provoque l'expulsion par les pieds des scories indésirables.\n\nLorsqu'on se couche, il convient de placer son lit de telle sorte que la tête soit au Nord et les pieds au Sud. Si l'on ne peut pas, l'Est fait très bien l'affaire. **Ne tournez jamais la tête au Sud ou à l'Ouest, et surtout pas entre le Nord et l'Ouest !**\n\nCuriosité : Le soleil « matériel » en pleine activité vivifie les forces matérielles. Donc paradoxalement : le 21 Juin (soleil intense) = zénith des Forces Cosmiques matérielles. Le 21 Décembre (soleil absent) = zénith des Forces Cosmiques spirituelles."},{"b":"hi","t":"**Toutes les fêtes religieuses ou équinoxes/solstices sont des SAS Cosmiques.** Au moment de ces fêtes, en voir la signification et se poser, par rapport à soi, les bonnes questions. **Fête** = faîte en sonorité. Or, le faîte d'une maison, c'est le toit. Vous êtes alors dans une énergie supérieure, moment où l'on peut être le mieux en contact avec la Vierge Marie ou Divine Providence.\n\nPar rapport aux grandes fêtes cardinales : moments privilégiés où l'on peut recevoir le bénéfice ou demander à tel saint de vous aider, d'intercéder auprès de Divine Providence ou même de vous donner une réponse à la solution d'un problème. Ce jour-là, ne pas se mettre dans l'égrégore, mais profiter des énergies du jour."},{"b":"hi","t":"**Pour réussir votre année**, il faut avoir CONSCIENCE des Énergies bénéfiques des différents mois de l'année, en particulier des mois de Mars, Avril et Mai. Cette période (Mars, Avril et Mai) c'est le tiers de l'année = tiers du nombre 9 (Nombre de la Perfection). Dans la vie, tout est question de précision et subtilité. Plus vous êtes subtil, plus vous arrivez à gagner. Comment être subtil ? Tout simplement en restant dans le calme, la paix et la tranquillité."},{"b":"text","l":"Le 1er de chaque mois — règle générale","t":"Le 1er de chaque mois est un jour important. Créer l'ambiance du mois en cours. Terminer les énergies du mois qui vient de s'écouler. Votre vie est le reflet de ce que vous avez pensé précédemment.\n\nChaque 1er du mois : mettre la graine et l'Énergie qui correspond au mois. Ensuite récolter ce que vous apporte la Grâce Divine de Divine Providence. C'est le démarrage, l'alpha et l'oméga.\n\nLe 1er de chaque mois, se tourner vers l'Est, rendre grâce à Christ et voir ce qui se met en action."},{"b":"text","l":"Action de chaque mois","t":"— Faire une petite ascèse de quelques jours, ce qui permet de renforcer sa volonté\n— Supprimer des habitudes qui n'apportent rien dans la vie\n— Remettre des compteurs à zéro"},{"b":"text","l":"Généralités sur les mois","t":"Chaque mois prépare l'autre mois. Chaque mois correspond à une figure géométrique permettant d'accéder en Magie opérative à des résultats bénéfiques étonnants. Janvier est représenté par un point, Décembre par un Décagone.\n\nMars, Avril et Mai sont trois mois fabuleux pour réussir votre vie, à condition que vous acceptiez d'abandonner vos anciennes façons de penser. Le mois de Mai contient en lui les Énergies du mois de Mars et celles d'Avril. À partir du mois de Juin, vous entrez dans la densité de l'été. Ce qui se crée et se vit l'été disparaît à l'automne."},{"b":"text","l":"Les quatre points cardinaux de l'année","t":"Chaque année, le soleil traverse quatre points : deux Équinoxes (jour = nuit) et deux Solstices (soleil le plus éloigné de l'équateur).\n— 21 mars : Équinoxe de Printemps, dominé par Mercure\n— 21 juin : Solstice d'Été, le jour le plus long, dominé par Vénus\n— 21 septembre : Équinoxe d'Automne, dominé par le Soleil\n— 21 décembre : Solstice d'Hiver, dominé par la Lune\nÀ ces dates correspondent les quatre fêtes cardinales : Noël, Pâques, Saint Jean, Saint Michel. Ces nœuds de Forces sont orchestrés par de Grands Esprits : vivez ces instants privilégiés."},{"b":"hi","t":"**Le paradoxe du soleil :** plus le soleil visible darde ses rayons (été), plus la vie matérielle est nourrie ; plus il est absent (hiver), plus l'Énergie spirituelle est intense et créatrice. Le 21 juin est le zénith des forces matérielles, le 21 décembre celui des forces spirituelles."},{"b":"text","l":"Petit déroulé de l'année","t":"— Mars, Avril, Mai : les Énergies Cosmiques sont les plus bénéfiques. C'est le moment de choisir, avec sagesse et un peu de volonté, le projet à réaliser : on prépare tout le reste de l'année. En mars, prendre ses décisions en Lune montante.\n— Juin, Juillet, Août : la densité s'installe ; plus elle se fait, plus on entre dans les illusions.\n— À l'automne : dé-densification, la sève redescend dans la terre.\nRegarder la Nature à chaque période et s'harmoniser avec elle. Comme on fait chaque soir l'examen de conscience de la journée, faire le même bilan à la fin de chaque mois."}]},{"date":"7 jours avant chaque Éq./Sol.","month":"Janvier","type":"cosm","title":"LES SAS — Les 7 jours des Équinoxes et Solstices","sub":"Alchimie des Équinoxes · Circulation Canopique · Transformation profonde","content":[{"b":"text","l":"Qu'est-ce qu'un SAS cosmique","t":"Les SEPT JOURS qui précèdent et suivent chaque Équinoxe ou Solstice (du 14 au 21) sont très particuliers. En effet, pendant cette semaine, les Quatre Éléments, guidés par le Cinquième, l'Esprit, « basculent ». Ils subissent un « déséquilibre » en raison du nouveau cycle qui s'annonce et auquel ils doivent s'adapter.\n\nLors de ce changement, dans la nature vibratoire des Éléments, un « SAS » (une ouverture) se produit dont l'être humain n'a pas généralement conscience.\n\nA propos d'un SAS : dans un canal, intervalle qui sépare les deux portes d'une écluse. Pièce fermée par deux portes étanches permettant le passage entre un milieu clos et l'extérieur."},{"b":"hi","t":"**Ce « SAS » ou cette « ouverture »**, dû au déséquilibre naturel et voulu des Éléments, est une opportunité intense pour changer la structure profonde de l'homme. Cette transformation joue sur les plans très denses, touche le corps éthérique, donc le corps physique, quelle que soit la nature de l'Équinoxe ou du Solstice. En clair, les Phases Cosmiques en présence ces jours-là transmutent votre être."},{"b":"text","l":"L'Alchimie des Équinoxes et des Solstices","t":"Il s'agit de l'Alchimie des Équinoxes et des Solstices. C'est la Circulation des Canopes ou Circulation Canopique. Ce moment des 7 jours est privilégié pour se rapprocher du Soi, de Divine Providence.\n\nVous entrez dans ce canal avec tous vos problèmes accumulés pendant l'hiver. Vous triez et ne passe avec vous que le Bon, c'est-à-dire la Foi, la Charité, l'Amour des autres. D'où, ouverture pour laisser entrer les Énergies Cosmiques qui font se loger en vous pour faire une opération de nettoyage, et surtout de nouvelle sève, de nouvelle vertu et qualité à développer pendant le printemps.\n\nGrâce à Divine Providence, se laisser aspirer et monter de niveau."},{"b":"text","l":"Le Rituel des Quatre Éléments","t":"Ce maniement très dangereux ne peut être effectué que sous la direction d'un Mage expérimenté. Le rituel nécessite de la part des participants des qualités de cœur et d'esprit, de la compréhension envers autrui et de la bonté.\n\nVos Quatre Éléments sont en vous, sur le plan physique, centrés sur vos viscères : le cœur, les poumons, le foie, la vésicule biliaire, l'estomac, le gros intestin et l'intestin grêle. Le rituel agit sur les viscères afin de transmuter vos Éléments et aboutit à la purification de votre corps physique et de vos corps subtils. Ceci est appelé « Circulation » du fait que l'Esprit circule dans chaque Élément en vous."},{"b":"text","l":"Ce qui se passe le soir de chaque Équinoxe ou Solstice","t":"Le soir de chaque Équinoxe ou Solstice, la position des Éléments face aux quatre points cardinaux change. Les Éléments sont déstructurés afin de permettre la venue d'un autre cycle. Profitez-en pour harmoniser chacun de vos propres Éléments avec son homologue Cosmique, l'Élément Absolu qui est Dieu, donc pur.\n\nFaites comme moi, je n'ai qu'un idéal : EN DIEU, la Perfection."},{"b":"pratique","l":"PROTOCOLE des soirs d'Équinoxes et Solstices","items":["Installez-vous confortablement, assis ou debout, face à l'Est, jambes et bras décroisés, yeux ouverts","Écrivez votre vœu, UN SEUL, dans la matière (valable pour les solstices)","Dites le Mantra entre 7 et 15 heures","Restez quelques instants dans le silence","Rendez grâce à la Vie ou au Dieu de votre croyance","Buvez un verre d'eau","Le soir, avant de vous endormir : faites brûler une bougie blanche que vous aurez bénie, offrez-la à Divine Providence, laissez-la se consumer totalement"]},{"b":"serge","t":"Pour profiter des effets bénéfiques déclenchés par le Soleil aux Équinoxes et Solstices, c'est faire acte d'humilité. Le mental et l'ego sont toujours émetteurs ; or, les Sages de toutes les Traditions disent : « Il est plus fort de recevoir ». Donc, à ces époques, on se met en mode réception pour se laisser remplir. En étant en harmonie avec l'Équinoxe, vous développez l'habileté, l'intelligence, la subtilité."},{"b":"serge","t":"Préparez l'Équinoxe pendant les 7 jours, du 14 au 21. Vivez l'Équinoxe du Printemps le 21 mars. À partir de là, laissez-vous emporter par les Énergies Cosmiques des deux Équinoxes et des deux Solstices, en mettant votre ego dans la poche. Attention de ne pas retomber dans la vie de tous les jours. C'est donc le « laisser-faire ». C'est extrêmement difficile ; cela demande beaucoup d'attention, d'éveil.\n\n« Fais un pas et Dieu fera le reste du chemin. » Oui, mais il faut être capable de le faire.\n\nÀ un moment, il faut être actif/passif et se laisser emporter. Donc, il y a 7 jours où c'est nécessaire. On laisse faire, on verra bien ; on rend grâce à Dieu car on est sûr de recevoir des Grâces. Cela fonctionne tout seul."},{"b":"hi","t":"**Retenez :** Les 7 jours AVANT sont très importants, mais les 7 jours après, laissez-vous porter. Après vos prières, prenez 3 ou 5 minutes pour laisser faire. Quand vous priez, vous êtes actif ; après, soyez, durant 3 ou 5 minutes, passif pour laisser les Énergies agir."},{"b":"serge","t":"Franz Bardon suggère quatre façons de détruire vos négativités :\n\n1. Par votre seule volonté et avec l'aide de la Divine Providence, détruire leurs efficacités.\n\n2. Mon procédé favori : transmutation des pensées et paroles négatives en pensées et paroles positives. Se charger de positif dans ses pensées, ses paroles et même ses actions.\n\n3. Laisser passer, tels des nuages, les pensées négatives sans leur laisser prendre prise sur vous. Pour vous aider, dites : « Merci. Christ d'avoir dissous ces illusions négatives » (Cela fonctionne à chaque fois !)\n\n4. Autosuggestions positives pour contrecarrer le travail négatif du subconscient. Ce subconscient, votre ennemi, se trouve dans votre corps astral. Heureusement, il se programme positivement, très facilement, le soir avant de s'endormir. Profitez-en ! Donnez-lui des ordres positifs et il obéira.\n\n« Si vous fréquentez des personnes négatives, jamais vous ne les élèverez, mais elles vous abaisseront. »\n\nL'équilibre harmonieux et absolu entre vos Quatre Éléments est ce que remarqueront, avec satisfaction, tous les Êtres bénéfiques de l'Invisible. Feu et Air : développent un rythme et une intelligence harmonieuse. Eau et Terre : développent l'esprit d'analyse. Le tout crée la « Sagesse », signe de maturité et de développement spirituel harmonieux."},{"b":"mantra","l":"Autosuggestion quotidienne de Serge","t":"« Je suis ce que je veux »\n\n« Je développe consciemment mes capacités et mes qualités »\n\n« La croyance forte que Dieu en Personne vous aide renforce votre puissance. Il est votre Guide divin et éternel. »"},{"b":"serge","t":"**L'autosuggestion, mère de tous les progrès intérieurs.** Le Feu et l'Air développent l'esprit de synthèse ; l'Eau et la Terre, l'esprit d'analyse. L'autosuggestion renforce et ennoblit le caractère, à condition de lutter consciemment contre ses défauts. Mon procédé favori : transmuter les pensées et paroles négatives en pensées et paroles positives. Votre subconscient vous résiste : donnez-lui des ordres positifs et il obéira."}]},{"date":"Janvier","month":"Janvier","type":"mois","title":"Mois de Janvier — RENOUVEAU","sub":"Mois UN · Plante : Gui · Mot-clé : RENOUVEAU","content":[{"b":"eileen","t":"« Tu ne peux vivre seulement de pain. Viens à moi pour ta nourriture spirituelle, et je t'emplirai et t'enverrai dans le monde, rafraîchi, renouvelé et pleinement satisfait. »\n\nImage : Un bol de nourriture posé dans la neige avec tout autour des traces d'oiseaux, d'animaux car ils savaient qu'ils trouveraient là de la nourriture."},{"b":"text","l":"JANVIER, c'est le Mois","t":"— Le premier mois de l'Année\n— La charnière de deux années\n— La conquête du monde, conquête de soi-même\n— De déprime et d'illusion de joie (selon les psychologues)\n— La création d'un nouvel espace d'amour, d'harmonie, de bien-être\n— D'un nouveau départ : on fait table rase du passé ; on recommence à zéro sans être un zéro\n\nPlante du 1er Janvier : GUI, emblème de l'immortalité de l'âme et de l'éternité du monde. Symbole de prospérité (boule blanche)."},{"b":"text","l":"ACTIONS de Janvier","t":"— Donner le meilleur de soi-même pour être plus éveillé\n— Finir le nettoyage de tout ce qui ne doit plus être\n— Ne pas tomber sur le mauvais côté du double visage de Janus ; Ne pas rester nourri par le côté destructeur de Janus\n— Reprendre tout simplement vos notes de l'enseignement de Serge et comprendre qu'il y avait des trésors pour transformer réellement votre vie\n— Essayer de penser par vous-même toute l'année\n— Ne pas tout contrôler\n— Faire ce qui doit être fait"},{"b":"text","l":"QUALITÉS à cultiver","t":"— Compétence\n— Efficacité\n— Être juste (Le juste est celui qui fait plus de bien que de mal dans la journée)\n— Décontracté et souple"},{"b":"text","l":"QUESTIONS de Janvier","t":"Ce que vous voulez faire dans votre vie est une chose. Ce que vous allez réussir à faire en est une autre.\n— Comment allez-vous gérer votre vie ?"},{"b":"hi","t":"Symbolique de Janvier — JANUS : Il est basé sur le dieu romain JANUS (anus), dieu des « portes ». À double visage, il regarde le passé et l'avenir, alors qu'il faut vivre consciemment L'INSTANT PRÉSENT. JANUS : Dieu secret des solstices en tant qu'androgyne. Réunion de 2 fronts ou la réunion des contraires (ombre et lumière)."}]},{"date":"1er jan","month":"Janvier","type":"cosm","title":"Nouvel An — Les 12 premiers jours","sub":"Matière ferme et indestructible des 12 mois à venir","content":[{"b":"serge","t":"La Tradition Secrète Initiatique apprend à tous les Mages de la Lumière et à tout Mage Christique que les 12 premières minutes d'une année et les 12 premiers jours sont considérés comme sacrés. Pourquoi ? Parce qu'ils sont la matière ferme et indestructible des 12 mois à venir."},{"b":"hi","t":"**La Kabbale** apprend que la Nouvelle Année subit l'influence des étoiles comme un enfant qui vient de naître. 1ère heure + 1er jour = méditer, prier et offrir la première heure au Dieu de votre croyance. Christ renaît chaque année pour nous sauver. Se pardonner à soi-même."},{"b":"pratique","l":"Ce qu'il faut faire les 12 premiers jours","items":["Établir une base de lumière, de joie, de bon sens, d'équilibre et d'harmonie","Générer de la joie, énergie primordiale","Réaliser quelque chose de joyeux une fois par jour","Surveiller vos pensées, paroles et gestes","Déterminer votre ou vos souhaits","Chacun des 12 jours, concevoir le souhait dans la réalisation — Février : mettre la graine / Mars : définir l'action / Avril, etc.","Ensuite, Divine Providence le prend en charge et donne les opportunités pour le réaliser","Choisir 3 mots à travailler et à dire chaque jour (ex : seul, secret, sage)"]},{"b":"text","l":"Les 12 Premiers Jours sur l'Éphéméride","t":"— 1er Janvier : Priez avec amour et douceur la Vierge Marie. Fête des femmes en tant que mère.\n— 2 Janvier : Jour de noblesse et de simplicité, de bonté, de puissance, de ténacité. Saint Basile — prénom signifiant « royal »\n— 3 Janvier : Jour de fête et d'humilité doublée d'intelligence concrète\n— 4 Janvier : Jour de Dieu et d'adoucissement karmique particulier\n— 5 Janvier : Jour de discernement concernant vos pensées, idées, caractère et vie sociale\n— 6 Janvier : Fête officielle de l'Épiphanie — Journée d'adoration à Christ et de réflexion\n— 7 Janvier : Prise de conscience que vous êtes sur la Voie spirituelle. À vous d'en prendre conscience, d'y rester et de la développer.\n— 8 Janvier : Prise de conscience de la qualité de votre caractère concernant votre réelle loyauté envers les autres\n— 9 Janvier : Vous et la Vérité\n— 10 Janvier : Attention à l'utopie dissimulée ou non dans votre caractère\n— 11 Janvier : Vérifiez que votre intellect est suffisamment nourri de hautes lectures et valeurs\n— 12 Janvier : Votre potentiel de séduction : est-il sain ou trop intéressé ?"},{"b":"serge","t":"Message de Serge sur le Nouvel An — LE BON SENS ! Le SIMPLE et CRUCIAL BON SENS !\n\nLes humains se servent inconsciemment et consciemment de leurs 5 sens, MAIS PEU, CONSCIEMMENT d'un Sixième SENS. Lequel ? LE BON SENS ! Sujet de réflexion et de méditation demandant du recul et parfois du temps !\n\nBase Incontournable d'un Véritable Renouveau dans votre existence (quel que soit votre âge !) Travaillez-y TOUS LES JOURS pour votre plus GRAND BONHEUR. Vous aurez des résultats bénéfiques surprenants.\n\nJour des Résolutions : serments faits à soi-même susceptibles de devenir des actions qui améliorent notre comportement ou notre santé. Passé : expériences qui permettent de ne plus recommencer les mêmes erreurs (référence de l'Ego). Nouvelle = neuf. Mais une nouvelle année n'est jamais séparée de la précédente."},{"b":"text","l":"Le Nouvel An Commun et le Nouvel An Ésotérique (Note de 2006)","t":"Vive le Nouvel An ! Jour de fête trop souvent saturé de musique, de nourriture lourde et de boissons alcoolisées. Si vous débutez l'année de cette façon, les autres jours de l'année seront fortement marqués par ce « mauvais » commencement.\n\nUne plante devient ce qu'est la graine d'origine. Si le premier jour, vous plantez de bonnes intentions, dans l'année vous ferez de belles récoltes. Ce premier jour hautement spirituel est très magique au possible.\n\nUne nouvelle année est un CD vierge sur lequel toute une vie va s'inscrire, exactement comme un film. Mais ce « morceau », archivé karmiquement, est riche des années précédentes. L'année est neuve mais vous avez du mal à la vivre, libéré de votre vécu antérieur.\n\nHeureusement tout karma peut s'améliorer. La Divine Providence permet — Grâce Divine incroyable — d'alléger le karma de chacun : le karma mental, le karma astral, le karma physique (la matière).\n\nUn Initié travaille sans relâche à se purifier et à essayer de dénouer des nœuds karmiques. Maya, l'illusion, fait croire et dire : « Cette année cela va changer... ». En fait, on ne voit rien de plus que l'année précédente. L'espérance ne suffit pas à faire germer une graine qui n'a pas été plantée !\n\nL'homme ne pense pas toujours à se « nettoyer » dès le 21 décembre par des Énergies Divines. Rempli comme une outre, il ne peut recevoir plus. Comment ajouter de l'eau pure dans un verre plein à ras bord d'eau croupie ?"},{"b":"text","l":"La Kabbale et les douze premiers jours","t":"La Kabbale apprend que la Nouvelle Année subit l'influence des étoiles comme un enfant qui vient de naître. Le premier jour d'un enfant va déterminer son premier mois, le second jour, son second mois, etc. — au moins les douze premiers jours de l'année !\n\nAinsi vous établissez une base de lumière, de bon sens, d'équilibre et d'harmonie. Vos douze mois à venir seront influencés et programmés automatiquement pour le bien !\n\nImportant : l'heure de minuit est l'heure qui correspond à l'horoscope de l'humanité. L'horoscope personnel de chaque personne dépend de l'heure à laquelle vous vous réveillez le premier Jour de l'An ! C'est le premier jour et la première heure de votre nouvelle naissance.\n\nCe jour-là : surveillez vos pensées, vos gestes, vos actions ; surtout surveillez vos paroles ; mettez de l'amour et de la compassion dans votre communication avec autrui.\n\nSi vous devez de l'argent à quelqu'un, essayez de le rembourser avant le premier janvier. Si vous avez insulté gravement quelqu'un, mieux vaut vous excuser car votre frustration ou votre haine vous polluera l'année qui vient.\n\nCe premier jour, levez-vous, priez, méditez, offrez la première heure de cette première journée à Divine Providence. Cette première heure s'inscrit dans l'Akâsha comme moment d'amour et de recueillement envers Dieu."},{"b":"serge","t":"Message de Serge en 2013 — Rappel important, pour tous ceux qui auraient « oublié » !\n\n1/ Ne rêvez pas ! Si vous voulez une année NOUVELLE, alors c'est vous qui devez Impérativement rentrer NOUVEAU dans l'année. Tout est bon à changer : en premier vos formes de pensées, votre coiffure, vos vêtements, puis voir vos défauts et vos qualités à mettre en avant...\n\nPrenez le temps d'écrire à ce sujet, visualisez aussi vos vœux avec précision, dans chaque domaine et comme si déjà réalisés ! C'est très important ! Voyez grand, beau, nouveau, généreux aussi bien en amour, argent, social, amical, spirituel, santé !\n\n2/ La NOUVELLE année commence à minuit ET également au moment où vous vous levez ! Vivez les 12 premières minutes de minuit et de votre réveil dans le calme, la gratitude et la joie. Appréciez la sérénité que tous vos vœux soient déjà réalisés."}]},{"date":"6 jan","month":"Janvier","type":"litu","title":"L'Épiphanie — Fête des Mages et de la Magie Divine","sub":"Ouverture d'un SAS Cosmique · Fête de TOUS les Mages de Lumière","content":[{"b":"text","l":"Épiphanie","t":"Épiphanie vient du grec epiphaneia : apparition, avènement, soit l'apparition de la Lumière en nous, soit la manifestation de Jésus comme Messie. Une épiphanie est une révélation secrète, une prise de conscience brutale. Fête secrète de la Lumière, de l'Eau. C'est le jour de la Renaissance (Feu) et de la Vie (Eau). Première fête sacrée du calendrier liturgique. Chaque année, la fête des Mages est l'ouverture d'un SAS Cosmique. Ce jour est aussi celui du premier miracle de Jésus aux Noces de Cana et aussi Sa date de Baptême."},{"b":"text","l":"Les trois présents — symbolique","t":"— Or : Christ Roi – Sagesse. La couleur « Or » est la couleur de la sagesse dont l'éclat brille au-dessus de la tête des Initiés comme une couronne de Lumière\n— Encens : religion — cœur — Amour\n— Myrrhe : Immortalité. On se servait de la myrrhe pour embaumer les corps et les préserver de la destruction\n\nChaque présent est lié à une Sephira : L'Or, à Tipheret, la Lumière / L'Encens, à Hesed, la religion / La Myrrhe à Binah."},{"b":"serge","t":"En 30 ans et plus, personne n'avait réalisé que, logiquement, le 6 janvier, tout en étant en premier l'Épiphanie, est tout aussi la fête des Mages. Serge nous révèle ce Secret : « Chaque personne qui pratique la Magie, même au plus petit niveau (1er degré de Franz Bardon), est un Mage ! » L'ÉPIPHANIE concerne Jésus en PREMIER ! Donc : Que vos demandes s'adressent à CHRIST ou À DIVINE PROVIDENCE ou à VIERGE MARIE !\n\nCe 6 janvier cache un autre symbole : La Fête de TOUS les Mages Serviteurs de la Lumière Divine. Et tout autre moyen de diffusion afin de lancer la Fête de la MAGIE D'AMOUR ET DE LUMIÈRE le 6 janvier de chaque année."},{"b":"text","l":"Note sur la Fuite en Égypte","t":"Après le passage des Mages, Jésus est contraint de fuir en Égypte. (Évangile de Matthieu 2,13-15) La fuite est ici considérée comme salvatrice, comme l'unique moyen de survie.\n\nAutres fuites bibliques : fuite de David, poursuivi par le roi Saül / La fuite d'Agar chassée par Abraham / Mahomet quitte Médine.\n\nLa fuite est avant tout une vertu :\n— Celle de savoir se détacher de nos liens et de la culpabilité pour assurer notre propre salut.\n— Celle de savoir laisser passer la tempête afin de revenir mieux armé.\n— La vie est ce qui doit être protégé à tout prix, plus encore lorsque l'on a le pressentiment d'une mission pour l'humanité."},{"b":"text","l":"Fève de la galette","t":"La fève de la galette : principe féminin qui permet au masculin de se réaliser. La couronne = fontanelle. Il y a 3 Rois Mages. Importance du mot « Songe » répété 3 ou 4 fois dans le texte de l'Évangile. C'est être le roi de soi-même, le roi libéré. Les Trois Rois Mages ont besoin d'un quatrième : et ce 4ème, c'est l'humain ! Donc VOUS ! C'est le jour de la fête de l'humilité et de l'intelligence concrète."},{"b":"hi","t":"Sainte Lucie (13 déc.) + 12 jours = 25 décembre (Noël) + 12 jours = 6 janvier (Épiphanie). Ces 12 jours relient les trois fêtes lumineuses. Épiphanie = lumière au-delà de la Lumière."},{"b":"text","l":"L'origine de l'Épiphanie et la galette","t":"Elle correspond à la présentation de Jésus enfant aux trois Rois Mages, Melchior, Gaspard, Balthazar. Ce jour est aussi celui du premier miracle de Jésus aux Noces de Cana et aussi Sa date de Baptême. Au Ve siècle, l'Église décida de donner une importance considérable à cet événement.\n\nLa galette des rois est une tradition très ancienne ; du temps de l'empire romain, celui qui trouvait la fève était ce jour-là fêté comme un véritable roi mais... exécuté le lendemain. Dès le XIVe siècle : il y a autant de portions à la galette qu'il y a de convives, plus une part réservée au premier pauvre qui se présentera.\n\nL'idée de la fève remonte aux Saturnales romaines, contre le froid de l'hiver. Pendant des siècles, les Chrétiens d'Orient ont célébré la Nativité le jour de l'Épiphanie ; les Arméniens le pratiquent encore aujourd'hui. En Espagne, les Rois Mages, ce jour-là, apportent les cadeaux et non à Noël."},{"b":"text","l":"Les trois Mages — symbolisme des continents et des couleurs","t":"Ces Mages étaient les chefs de grandes religions dans leurs pays respectifs. Pourquoi sont-ils venus ? Parce qu'ils ont pressenti la Lumière, la vraie ! Astrologues, observant dans le ciel certaines configurations planétaires exceptionnelles, ils en ont conclu que cette configuration annonçait un événement exceptionnel.\n\nL'Évangile de Marc ne précise pas leur nombre. Longtemps on a pensé qu'ils étaient deux, quatre ou douze... Mais comme il y a trois cadeaux, on s'est mis d'accord sur le chiffre 3. Même venue que dans l'Ancien Testament pour Abraham : trois personnages apparaissent pour fêter la naissance miraculeuse de son fils Isaac.\n\nL'apparence physique des trois Rois Mages est une mise en relation avec les fils de Noé, symboles des continents connus à cette époque : un mage blanc pour l'Europe, un mage noir pour l'Afrique, un mage arabe pour l'Asie.\n\nLa couleur de leurs vêtements est tout aussi symbolique : le jaune, couleur du célibat ; le violet, couleur du mariage ; le multicolore, couleur de la pénitence.\n\nDans le Nouveau Testament, comme dans l'Ancien Testament, tout est codé ! À vous de déchiffrer..."},{"b":"text","l":"Secrets et Révélations bibliques (Note de décembre 2014)","t":"Matthieu présente la visite des Mages comme une péripétie de la naissance de Jésus : une sorte d'enquête menée par les Mages, de Jérusalem (2, 1-8) pour aboutir à Bethléem (2, 9-12). Dès le début de l'Évangile, le ton est donné sur l'identité de Jésus : « Christ et fils de David » (Matthieu 1,1).\n\nActe premier : les Mages se sont déplacés en suivant l'apparition d'un astre. Où arrivent-ils ? Dans la ville royale de Jérusalem. Déjà, ils se trompent de lieu ; ça commence bien pour de prétendus férus en astrologie... Et à qui vont-ils demander leur chemin ? Au tyran, Hérode !\n\nDeuxième acte : les Mages, toujours incapables de trouver par eux-mêmes, mais heureusement réapparaît l'étoile qui les guide. Donc, la clé d'interprétation importe plus que le fait même. Le chercheur remarque qu'il est impossible de trouver « Le roi des juifs » sans la conjonction de l'astre et de la prophétie.\n\nDe toute cette histoire, on peut en déduire que Jésus est roi certes, mais à la manière de David de Bethléem, non à celle d'Hérode de Jérusalem.\n\nLes Évangiles apocryphes s'inspirent tous, au sujet des Rois Mages, du « Protévangile de Jacques » : « Et les Mages dirent : Nous avons vu une étoile énorme qui brillait parmi ces étoiles-ci et qui les éclipsait au point que les autres étoiles n'étaient plus visibles. Et ainsi nous avons connu qu'un roi était né pour Israël. »\n\nSelon la « Caverne des trésors », les Mages auraient été des rois païens. Le « Traité incomplet sur Matthieu » comporte un détail inédit : l'étoile marquée de l'image d'un enfant est surmontée d'une croix qui montre la route aux Mages. Bonaventure, ministre général des Franciscains, dénombrait huit caractéristiques à cette étoile miraculeuse."},{"b":"text","l":"Lettre de Février 2015 — Le monde entre dans un temps nouveau","t":"« Nous avons vu son étoile apparaître à l'Est et nous sommes venus l'adorer. » Ces quelques paroles prononcées par les Rois Mages de l'Orient en marche vers Bethléem mettent un terme, peut-on dire, à l'Ancien Testament. Terminé ! car celui qui naît vient accomplir les promesses des Écritures sacrées.\n\nLe monde entier entre dans un temps nouveau, celui du Salut. Temps béni de la Réconciliation éternelle entre Dieu et l'humain : Dieu se fait homme tout en lui donnant Sa nature divine ; Dieu se fait fils, l'homme devient fils ; terminée la créature fautive chassée de l'Eden.\n\nCe Salut passe par deux démarches : gratuité de l'apparition du Sauveur, et volonté humaine de Le suivre vers cette porte édénique. Devant cette porte, plus d'anges mais un homme : Jean-le-Baptiste. Pont entre deux temps, deux testaments, porteur d'un nouvel espoir à venir : Christ !"},{"b":"serge","t":"Le Roi Hérode, symbole de pouvoir temporel opposé au pouvoir spirituel. Hérode dit : « Allez, renseignez-vous sur cet Enfant et quand vous l'aurez trouvé, faites-le-moi savoir pour que moi aussi j'aille L'adorer. » Heureusement, les Anges viennent avertir les Trois Mages de ne pas repartir par le même chemin.\n\nC'est l'éternel conflit : vous êtes pris entre la matière et la spiritualité. Si les Trois Mages ne prennent pas le même chemin pour retourner, cela veut dire : quand vous avez pris la décision de prendre le chemin spirituel, vous ne pouvez pas retourner sur le chemin de la matière. Vous devez vous en éloigner de plus en plus."},{"b":"text","l":"Les Mages dans les textes anciens","t":"Selon la « Caverne des trésors », c'étaient des rois qui portaient, pour leurs offrandes, un habit de mage par-dessus leur habit royal. Pour le Pseudo-Jean Chrysostome, ils descendaient du prophète Balaam (« Une étoile se lèvera de Jacob ») et observaient les saisons dans l'attente de cette étoile. D'autres récits parlent d'un livre confié par Adam à son fils Seth : douze sages, de père en fils, priaient en silence trois jours par an sur le « Mont des Victoires », jusqu'à ce que l'étoile apparaisse, en forme d'enfant portant une croix. Saint Bonaventure racontera ce prodige à Saint Louis, car il « renforçait la foi plutôt que de la détruire »."},{"b":"text","l":"7 janvier — Noël orthodoxe","t":"Les Orthodoxes fêtent Noël 13 jours après les catholiques, car ils suivent le calendrier Julien."}]},{"date":"17 jan","month":"Janvier","type":"ense","title":"17 Janvier — Date sacrée des Alchimistes","sub":"Les pommes bleues de Saint-Sulpice · 153 = pêche miraculeuse","content":[{"b":"text","l":"Le 17 Janvier","t":"Date sacrée des Alchimistes et des découvreurs de trésors ! Dans le monde entier, l'église de Rennes-le-Château, la cathédrale de Bruxelles, celle de Cologne ou encore à Paris, l'église de St Sulpice, apparaissent comme : « Les pommes bleues ! »\n\nPetites lumières bleutées très mystérieuses et très bénéfiques qui « dansent » soit sur la ligne du méridien de Paris, soit dans des lieux consacrés aux très hautes études ésotériques."},{"b":"serge","t":"Le plus intéressant dans 17 est qu'il rejoint 153 la pêche miraculeuse décrite, en particulier, par St Jean. Le 153ème mot de la Bible en hébreu est « tov » ; il signifie : « BON » ! Sa valeur numérique ? 17 ! Si vous additionnez les nombres et chiffres de 1 à 17 le résultat de l'addition est : 153 !!! (Les Noces de Cana)\n\nLa meilleure piste ? TOUT RAMENER à la BIBLE !!! La pomme est symbole de la Connaissance (avec tous les dangers qui vont avec)."}]},{"date":"30 jan","month":"Janvier","type":"ense","title":"30 Janvier — Foi, Ordre, Simplicité","sub":"Décodage de la Petite Voix par Serge","content":[{"b":"serge","t":"Réfléchir à la façon de mettre de la Foi, de l'Ordre et de la Simplicité dans notre vie quotidienne.\n\nFoi, à ne pas confondre avec dévotion\n\nOrdre : dans sa vie, mais aussi plus matériellement dans sa maison et dans sa voiture, sinon c'est le chaos total dans sa vie. Avoir presque un ordre de moine (bien rangé, bien carré)\n\nSimplicité : ne pas faire ce qui n'est pas nécessaire, ni ce que je veux, mais ce qui doit être fait. Quand on pense qu'une action est difficile à faire, c'est là qu'est la vraie évolution."},{"b":"hi","t":"À RETENIR : Décrypter extérieurement dans les Livres Sacrés doit être pratiqué en même temps qu'un travail intérieur, vous rapprochant encore plus près de Divine Providence. N'est-ce pas en finalité LE PLUS IMPORTANT ? TROUVER LE VRAI BONHEUR."}]}];
var D_FEVRIER=[{"date":"Février","month":"Février","type":"mois","title":"Mois de Février — INTÉRIORITÉ · PURIFICATION · SILENCE","sub":"Mois TWO · Symbole : deux lignes parallèles · La Fève · La graine","content":[{"b":"eileen","t":"« Cherche au fond de toi et trouve cette paix qui dépasse tout entendement. Conserve-la, ce qui se passe au dehors importe peu. Laisse ce qui est au-dedans s'exprimer au dehors. »\n\nImage : Une mer très tourmentée et déchaînée, avec des vagues hautes comme des montagnes, me fut montrée. Puis, je m'aperçus que, sous la surface, régnaient une paix et un calme merveilleux."},{"b":"text","l":"FÉVRIER","t":"Vient du latin « februare » : soit purifier. Mois sacré de 28 jours (soit 2+8=10) ou 29 jours les années bissextiles. Mois 2, nombre de la dualité : croire pour croître ; surtout rester dans l'Unité, le UN.\n\nMois de « la Fève » (pour les initiés), c'est-à-dire l'Esprit qui travaille en soi. Février est considéré comme le mois le plus froid de l'année, une espèce de pôle nord, ou d'Everest... À vous de décoder, par la méditation et la réflexion, les possibilités divines qu'offre ce mois de 28 jours (2+8=10).\n\nPériode de connaissance de soi et d'introspection. Se laisser emporter par les Énergies de Février pour être plus léger en mars. Trier les graines et ne garder que les bénéfiques.\n\nImportant : Mettre les graines avant le début du Carême.\n\nFÉVRIER, c'est le Mois :\n— De l'Esprit qui travaille en soi\n— Le plus mystique et secret de l'année\n— Le plus froid (mois du Pôle Nord, de l'Étoile polaire — Sirius) — le froid est régénérateur, donc donne la vitalité (Glaces du Pôle Nord = puissance)\n— Du CHOIX\n— Des purifications rituelles\n— De la FÈVE qui est sacrée\n— Important spirituellement\n— Où les vieilles histoires ressortent\n— Où vous commencez à créer\n\nDurant le mois de Février, ne parler que de bénéfices.\n\nLa Fève, c'est l'Enfant Jésus dans la crèche. La Fève, c'est l'acquis, vos projets, c'est l'Esprit qui travaille en soi. En janvier, ce sont les conditions de la graine. La Fève : on la plante en terre à la période du carême. Elle donne les fruits vers juin et la récolte a lieu en septembre. La Fève est un symbole d'embryon."},{"b":"text","l":"La Fève — mode d'emploi","t":"La Fève symbolise le soleil minéral, l'embryon. Au printemps, elle représente le 1er don venu du dessous de la Terre. Seul Dieu fait croître la graine.\n\nFaire une liste de ce que je sais, j'aime faire et la mettre dans une graine pour ne pas s'égarer. Réfléchir à tous les paramètres que cela va engager. C'est le projet de l'année qui doit être planté. Attention ! différence énorme entre rêver un projet et le structurer. Se concentrer sur la graine à planter, sur du court terme. Ensuite devenir spectateur de ce qui pousse."},{"b":"text","l":"Qu'est-ce qui, dans mon corps, ressemble à une fève ?","t":"— Les reins\n— L'oreille\n— Le gros orteil\n— Le pied\n— Le cerveau...\n\nLa Fève est partout en vous. Elle est le principe de vie, la semence divine qui attend de germer. En Février, c'est le moment de lui donner la bonne direction."},{"b":"hi","t":"**Carnaval** : Sortir de sa propre image. Avant le Carême, le Carnaval permet de se défaire momentanément de son masque social. Puis vient le temps du Carême : se défaire pour de bon des masques qui ne vous servent plus."},{"b":"text","l":"ATTITUDE","t":"— Canaliser ses énergies dans la bonne direction\n— Discipline personnelle\n— Souplesse\n— Varier sa vie sans se disperser"},{"b":"text","l":"QUALITÉS","t":"— Joie\n— Enthousiasme\n— Une foi inébranlable\n— Humilité – Attention à l'orgueil"},{"b":"text","l":"MOTS-CLÉS","t":"— Intériorité (Croire pour croître)\n— Pureté - Purification\n— Silence"},{"b":"text","l":"QUESTIONS de Février","t":"— Quelle est la graine intérieure que vous plantez ?\n— Quelles sont les choses essentielles que vous mettez en premier ?\n— Avez-vous envie de servir Divine Providence ?\n— Quelles sont vos motivations ?\n— Pour réussir une relation amoureuse, il faut : une puissance émotionnelle, une puissance intellectuelle, une puissance physique. Avez-vous les trois ?"},{"b":"hi","t":"Dès fin janvier jusqu'au 10 février maximum, nous sommes dans des courants énergétiques très anciens concernant la fête solaire paiënne (Les crêpes représentent le soleil matériel et non spirituel !)."}]},{"date":"2 fév","month":"Février","type":"litu","title":"La Chandeleur — 33e jour de l'Année","sub":"40 jours après Noël · 45 jours avant l'Équinoxe · Courbe ascendante","content":[{"b":"text","l":"Ce que c'est","t":"Soit 40 jours après Noël et 45 jours avant l'Équinoxe de Printemps. Courbe ascendante. C'est le 33ème jour de l'Année. Jour de la Purification de la Vierge Marie et fête de la présentation de Jésus au Temple. Au Moyen Âge, le printemps commençait à la Chandeleur. Ce jour représente la transition entre la saison des gelées et la saison nouvelle qui s'annonce. C'est commencer une chose et aller jusqu'au bout, ne pas commencer tout et s'éparpiller."},{"b":"eileen","t":"« … c'est apprendre à canaliser ses énergies dans la bonne direction et ne pas papillonner… Apprendre à faire ce que tu sais pouvoir faire parfaitement… »\nChant de la lumière qui revient."},{"b":"text","l":"Les Crêpes — symbolique","t":"Les crêpes elles-mêmes évoquent le disque solaire ainsi que les offrandes alimentaires. La Chandeleur marque l'ouverture de la période de Carnaval. C'est en même temps un signe de renaissance, de promesse d'avenir. La veille, on fait maigre. La crêpe est censée exorciser la misère et le dénuement.\n\nPour cela, garder la première ! Elle sera, tout au long de l'année, jusqu'à la Chandeleur suivante, garante de la prospérité. Cette crêpe que l'on ne mange pas est la survivance du rite de l'offrande. On mettait parfois un « louis d'or » dans la crêpe."},{"b":"pratique","l":"À faire","items":["Laisser une chandelle allumée ou faire un dîner aux chandelles","Se concentrer sur UNE chose et aller jusqu'au bout"]},{"b":"text","l":"Histoire de la Chandeleur","t":"Étymologiquement, c'est la fête « des chandelles » (cierges bénis que l'on porte en procession). Cette christianisation de la Chandeleur se fait en 472 lorsque le pape Gélase 1er organise des processions aux chandelles qui symbolisent « Jésus, lumière d'Israël ».\n\nLa Chandeleur, fête païenne récupérée par l'Église, est devenue la Purification de la Vierge ainsi que la présentation de l'Enfant Jésus, 40 jours après l'accouchement, tout en restant la fête solaire qu'elle a toujours été.\n\nAu Moyen Âge, le printemps commençait à la Chandeleur."}]},{"date":"18 fév","month":"Février","type":"litu","title":"Mercredi des Cendres — Début du Carême 2026","sub":"40 jours dans le désert · Du 18 février au 4 avril 2026","content":[{"b":"text","l":"Le Carême — description générale","t":"Le Carême est un SAS Cosmique de 40 jours pendant lequel on est plus près de Dieu et on se prépare à être baptisé à Pâques, fête de la renaissance consciente. 40 est un chiffre magique — initiatique. Carême signifie aussi « quarantième ».\n\nIl existe 3 carêmes : mental (contrôle des pensées), astral (contrôle des émotions), physique. Les vraies décisions sont dans le mental. La vie est magique. C'est à nous de changer. Ce qui compte, c'est le pouvoir de l'esprit, le pouvoir du mental.\n\nIl existe deux grands Carêmes dans l'année : En février ou mars = Carême spirituel, carême de l'esprit / Novembre/Décembre = Carême matériel et initiatique : concrétisation de la Vraie Vie dans la Matière car le VERBE SE FAIT CHAIR."},{"b":"text","l":"QU'EST-CE QUE LE CARÊME","t":"— Une loupe qui grossit les vices, les défauts, les faiblesses\n— Le meilleur moment pour changer votre vie, une période pour perdre ses habitudes denses ou négatives\n— L'art de mourir pour renaître avec ses qualités positives. Soit on renaît, soit on vieillit\n— Un état d'Esprit\n— De tentations auxquelles il faut résister\n— De libération — le travail vient de l'intérieur ; il faut en sortir pur et vide\n— D'ouverture, de prise de conscience de vos négativités pour les éliminer\n— Propice pour une nouvelle naissance\n— De silence pour être réceptif à la Parole de Dieu\n— De Jeûne : c'est alléger les corps de toutes les toxines\n— De ressourcement intérieur, de métamorphose"},{"b":"text","l":"Cette période permet de","t":"— Se préparer à Pâques\n— Trouver le silence intérieur, prendre une distance entre moi et moi\n— Voir le positif en soi et dans la vie\n— Semer, pour le Printemps, de nouvelles graines dans un domaine qui vous plaît\n— Construire, avec l'Archange Raphaël, du nouveau sur des racines positives (Le Beau, le Bien et le Bon)\n— Voir comment vous fonctionnez — totalité du caractère qui en prend un coup\n— Avoir des réactions plus légères : la vie est faite de tri et non de choix\n— Refaire sa foi, élargir sa conscience et se rapprocher de Dieu\n— Apprendre à puiser à la source (se tourner vers le puits et tirer la corde vers soi)\n— Avoir la foi de l'enfant\n— Mettre sa propre maison en ordre"},{"b":"pratique","l":"Dès le début du Carême","items":["Décider de voir tout en positif. Faire le point du positif dans votre vie et remercier","Prendre conscience de tout ce que vous êtes et de tout ce dont vous jouissez","Méditer, prier, lire","Pratiquer la charité discrète","Apprendre à ouvrir les yeux, à penser, à voir comment vous pouvez changer","Se garder de toute tentation et de tout orgueil","Croire que tout ce que vous souhaitez est déjà arrivé","Demander à Dieu de renforcer votre volonté","Mettre l'ego à genoux et Dieu en Premier dans le Silence"]},{"b":"mantra","l":"Décision de la veille du Carême","t":"« Je fais le carême, j'en sortirai, transmué et transformé. »"},{"b":"hi","t":"**RÈGLE ABSOLUE :** Pas de projets pendant le Carême. Les graines sont plantées AVANT le début du Carême. Les créations se font entre Pâques et début Juillet. Et SURTOUT, surtout, surtout, garder le secret sur votre façon de vivre le Carême. Méfiez-vous de votre vanité et de l'erreur de l'hypocrisie."},{"b":"serge","t":"Le carême est un état d'esprit. Faites-le joyeusement et les tentations auront du mal à vous percer. Quand vous êtes gai et joyeux, aucune pensée négative ne peut partir vers d'autres personnes. Si vous restez triste, vous êtes bombardé de tous les côtés. Ces 40 jours sont importants. Les faire en s'amusant et tout se passe bien. Au sortir du Carême, vous êtes plus joyeux, plus léger, plus calme et plus tranquille. Ce sont les 4 piliers que j'avais choisis au début du Carême :\n\nJoie · Légèreté · Paix · Tranquillité\n\nIls s'expriment uniquement dans l'Action."},{"b":"serge","t":"Note sur le RESSOURCEMENT INTÉRIEUR et NETTOYAGE (2017) — C'est une époque de ressourcement intérieur, de recherche intérieure envers soi-même. C'est une métamorphose. Careme = se récurer, se déséprogrammer.\n\nConseil : SE CALMER.\n\nComment retrouver la quiétude intérieure ? La QUIÉTUDE est un état intérieur très profond, plus que la sérénité. Elle est un lever ou un coucher de soleil, un après-midi à la campagne. Avoir au moins quelques minutes de quiétude par jour. Voilà comment on se rapproche le plus de Christ.\n\nL'Énergie du mot « quiétude » est vaste, infinie, illimitée. Elle peut être atteinte par tout le monde. Elle a quelque chose d'élégant, ouvre des opportunités à l'intérieur de nous. Nous voyons beaucoup mieux comment fonctionne notre cerveau.\n\nLa quiétude octroie : Plus d'abondance / Plus de neurones ouverts dans le cerveau / Plus de noblesse. Elle permet de vous parler différemment et à travers elle, vous accédez au meilleur de vous-même.\n\nSelon Talleyrand : « La noblesse, c'est de croire en Dieu. » Aller vers la noblesse et ne pas être l'esclave de soi-même."},{"b":"serge","t":"La Méthode pour changer (Séminaire 2003) :\n\n1. Commencer par voir tout ce qui est positif dans votre vie et remercier pour toutes ces choses.\n2. Imaginer — Le but est toujours de faire mieux avec ce que l'on a. Imaginer ce que l'on veut de la vie, dans les grandes lignes. Semer de nouvelles graines pour le printemps.\n3. Changer ses habitudes — C'est la répétition quotidienne des événements et de vos habitudes qui empêche le changement.\n4. Essayer de capter toutes les idées à venir qui sont déjà dans l'Akasha. Prenez du recul sur vous et sur vos actions. Profitez de cette période régie par l'Archange Raphaël (Élément AIR) pour avoir un meilleur mental."},{"b":"text","l":"Les 9 Attaques contre vos négativités — Blog Carême 2008","t":"1ère : Décidez de voir tout en positif, prenez conscience de vos acquis, rendez grâce.\n2ème : Imaginez comment améliorer votre existence, visualisez les résultats positifs, semez de nouvelles graines.\n3ème : Contactez de nouvelles personnes, agrandissez votre cercle de relations.\n4ème : Croyez que tout ce que vous souhaitez est déjà arrivé, donnez-vous un rôle de leader, étonnez les autres !\n5ème : Le soir, endormez-vous en pensant que vous avez déjà réussi. Pensez plusieurs fois dans la journée que vous êtes le meilleur.\n6ème : Demandez à votre Dieu de vous booster, de renforcer votre volonté. Dites-Lui que vous voulez une autre vie.\n7ème : Arrêtez de douter que vous ne pouvez pas y arriver. La volonté et l'envie de mener une vie meilleure et enrichissante.\n8ème : Ne vous occupez pas des critiques. Ne traînez pas avec vous des boulets inutiles (humains négatifs). Allez de l'avant !\n9ème : Votre pensée est votre meilleure alliée. Votre Dieu, votre plus puissant partenaire.\n\nPour terminer : Amusez-vous à vous « éclater », à devenir le meilleur. C'est un jeu qui va vous apporter le bonheur."},{"b":"serge","t":"La Méthode pour changer (Séminaire 2003) :\n\n1. Commencer par voir tout ce qui est positif dans votre vie et remercier pour toutes ces choses.\n2. Imaginer — Le but est toujours de faire mieux avec ce que l'on a. Imaginer ce que l'on veut de la vie, dans les grandes lignes. Semer de nouvelles graines pour le printemps.\n3. Changer ses habitudes — C'est la répétition quotidienne des événements et de vos habitudes qui empêche le changement.\n4. Essayer de capter toutes les idées à venir qui sont déjà dans l'Akasha. Prenez du recul sur vous et sur vos actions. Profitez de cette période régie par l'Archange Raphaël (Élément AIR) pour avoir un meilleur mental."},{"b":"quote","t":"Poème de Serge sur le Carême :\n\n« Je suis mon propre désert,\nMon propre tentateur,\nMa propre oasis. »"},{"b":"text","l":"Dates mobiles et types de Carêmes","t":"Il existe plusieurs carêmes dans l'année :\n— En février/mars = Carême spirituel, carême de l'esprit : être joyeux pour arriver à Pâques intact au mois de mai (pentagramme = l'homme)\n— Novembre/Décembre = Carême matériel et initiatique : le VERBE SE FAIT CHAIR\n— Un carême hebdomadaire : la semaine avant Pâques. On peut faire un carême chaque semaine.\n\nDates mobiles : les Jours Gras (Mardi Gras) - les 3 jours avant le Carême / Le Quinquagésime : 7ème dimanche avant Pâques / La Mi-Carême : 3ème jeudi - on dit « Lætare » = Réjouis-toi ! / Le vendredi, pas de viande.\n\nL'entrée et la sortie du Carême sont les plus importantes. Dans le désert, on réfléchit. Laisser tomber les résolutions prises ; apprendre à se détacher du résultat. Pendant le carême, pensez au Père, au Fils et au Saint-Esprit. À l'entrée, se tenir à l'abri du Très-Haut."},{"b":"serge","t":"Aide précieuse de l'Archange Raphaël pendant le Carême : Archange de l'Élément Air, donc de l'imagination. Comptez sur lui, demandez-lui du secours.\n\nFin du Carême : Être dans la JOIE car on aperçoit l'oasis (Pâques). C'est fournir à son mental de la joie et de l'harmonie et dire : « Joie ! Joie divine ! Joie Divine ! » Sortir du désert, c'est avoir tout perdu et se poser la question : Que vais-je faire ?"},{"b":"text","l":"Le PARDON — base du Carême","t":"Dans le Carême, le plus important c'est de faire du bien, le même bien, qu'on ne fait pas d'habitude. Le plus gros morceau, c'est toujours « pardonner ». Pendant le Carême, il faut lui pardonner et se rapprocher de Dieu. Se rapprocher de Dieu, ce n'est pas se mettre à genoux, se taper la tête contre le sol. C'est Lui parler tout simplement. Parce que Dieu est Dieu, c'est surtout votre meilleur ami et Il est à l'intérieur de vous.\n\nLe Carême est le moment où Dieu pardonne encore plus ! Normal ! C'est l'époque où l'on vous demande de pardonner le plus.\n\nPetites privations : Supprimer un morceau de gâteau à 11h ou 16h. Nul besoin de faire de grandes privations. Les petites sont aussi difficiles que les grandes car on prend des habitudes."},{"b":"text","l":"La profondeur du PARDON — Extrait des Cahiers de l'Hermétisme","t":"Le pardon est une arme d'attaque et de défense. Il est valable envers les autres et envers soi-même. Il remet de l'harmonie là où il y a de la dysharmonie. Le pardon est joie ; c'est une Grâce Divine.\n\nLe « par-don » : c'est le don parfait, le « don par-delà » l'offense, l'ingratitude. C'est l'alliance toujours offerte malgré l'infidélité. Ce n'est pas un coup d'éponge, ni oubli, ni effacement — ce qui est fait est fait. Il n'efface pas le passé mais ouvre l'avenir. Il apporte la libération intérieure. On peut repartir. Vis-à-vis de Dieu, nous sommes tous des pécheurs pardonnés.\n\nSeuls le Pardon et l'Amour de Dieu vous renouvellent radicalement. Le pardon de Dieu précède toujours votre pardon qui doit être sans condition. Si vous ne pardonnez pas, les dons que vous avez en vous s'en vont.\n\nRemords et culpabilité = c'est pécher deux fois."},{"b":"pratique","l":"Comment pardonner concrètement","items":["Se mettre à la place de la personne = tant que ce n'est pas fait, vous ne pouvez pas pardonner","Se poser la question : « Qu'est-ce qui me hérisse dans cette personne ? » Voir ce qui ne vous plaît pas. Se dire que vous avez la chance de ne pas être comme cette personne","En pardonnant, priez pour cette personne et rendez grâce de ne pas être comme elle","Quand vous pardonnez à quelqu'un, dites-vous que peut-être, à sa place, vous auriez fait la même chose","Les liens négatifs entre vous et la personne sont coupés","Le pardon est joyeux : si je pardonne à quelqu'un, je suis immédiatement libéré de la personne"]},{"b":"serge","t":"Lire la femme adultère dans l'Évangile de Jean pendant le Carême. S'Il acquitte cette femme, Il est en contradiction avec la Torah, ce qui lui vaudrait la mort. S'Il accepte qu'elle soit condamnée à mort, cela n'irait pas avec son message d'amour et de pardon. Jésus gagne : « celui qui n'a jamais péché lui jette la première pierre ». Remarquez que Jésus ne pardonne ni à la femme ni aux accusateurs. Comme dans votre vie, tout est en suspens, ni coupé de Dieu, ni condamné, ni isolé. Seulement sortez de vos contradictions."},{"b":"serge","t":"Le rire est initiatique pendant le Carême. N'hésitez pas à méditer ET RIRE pendant les 40 jours du Carême. Le rire embellit le souffle, expanse les champs vibratoires et vous rend heureux. La vie est rieuse et vagabonde ; grâce à vous, elle ne sait pas à l'avance où elle va partir, tel est son but. Votre vie rieuse s'invente en avançant, en osant aller plus loin et plus haut.\n\nAvant tout : pardonner utilisant la politesse, le compliment, l'humour. Inutile d'avoir pendant le Carême une « face de Carême ». Tertullien disait que celui qui se venge de ses ennemis en leur faisant du bien se venge divinement, c'est-à-dire à la manière de Dieu. « Pardonne-nous comme nous pardonnons à ceux qui nous ont offensés. » Pardonner ne vient pas de la tête mais du cœur. Faites le nécessaire, Dieu alors fera l'impossible."},{"b":"mantra","l":"Mantra du Pardon","t":"« En Christ, je me pardonne à moi-même. »\n\n« Christ, je ne suis pas capable de pardonner aux autres et à moi-même, je te rends grâce d'avoir pardonné à ma place. »"},{"b":"mantra","l":"Mantra du Pardon — Carême","t":"« Christ, je ne suis pas capable de pardonner aux autres et à moi-même, je te rends grâce d'avoir pardonné à ma place. »"},{"b":"text","l":"Conclusion du Carême — Note de Serge","t":"Entreprise de décentrement de nous-mêmes pour nous centrer sur les autres et Dieu. Pendant le Carême : Demander à Christ de vous aider à résister aux tentations, de renforcer votre volonté. Croire en toutes circonstances que Divine Providence a des projets pour vous.\n\n— Ne vous surestimez pas car personne n'est à l'abri de la tentation\n— Restez humble\n— Faire du Christ le centre de votre vie\n— À l'entrée du Carême, se tenir à l'abri du Très-Haut\n— Les 40 jours dans le désert sont une épreuve pour savoir ce que vous avez dans le cœur\n\nChemin à suivre : Amour des autres · Pardon. À chacun de trouver la force de la Résurrection.\n\nLe secret de la vie est de durer. Il ne suffit pas de commencer, il faut savoir tenir. Savoir durer, là est le secret de la foi. L'important n'est pas de faire dans le prodigieux mais de tenir une foi tranquille chaque jour que Dieu fait."},{"b":"mantra","l":"Le Passé et l'Avenir","t":"« Le Passé appartient à la Divine Miséricorde et l'Avenir à la Divine Providence. Ainsi vous serez libre et disponible pour accueillir TOUTE LA JOIE QUE DIEU VOUS OFFRE AU PRÉSENT. »"},{"b":"text","l":"Cinq mots-clés du Carême","t":"La parole · La prière · La foi · Le pardon · Le partage"},{"b":"text","l":"Matières à travailler pendant le Carême","t":"Il existe 3 vertus théologales : La Foi / L'Espérance / La Charité. Auxquelles sont ajoutées 4 vertus cardinales (cardinale = charnière) : La Prudence / La Force / La Tempérance / La Justice.\n\nVoilà déjà une façon de TRAVAILLER, soit les vertus théologales, soit les 4 cardinales. Vous pouvez également VOUS SERVIR des 10 Paroles (à tort dites commandements — 10 commandements et 10 paroles, c'est tout à fait différent). Les 10 Paroles sont la Volonté de Dieu quant à la conduite de l'humain. Et Dieu laisse le choix. L'humain obéit ou non.\n\nÀ l'inverse, « luttez courageusement » contre un ou plusieurs des 7 péchés capitaux :\n1. La Paresse spirituelle ou l'acédie\n2. L'Avarice\n3. La Colère\n4. L'Envie\n5. La Gourmandise\n6. La Luxure\n7. L'Orgueil\n\nQuoi qu'il en soit, ne pratiquez pas votre travail seul. Ne faites pas le Carême tout seul. Vous avez Vierge Marie, Divine Providence et Christ qui sont là pour être mis en avant et vous éviter le ou les échecs.\n\nPendant le Carême, c'est le seul moment de l'année où vous décidez, par votre propre volonté, d'équilibrer vos Quatre Éléments. C'est le moment de donner plus de puissance à votre conscience, sinon vous repartez pour une vie répétitive. C'est perdre dans le désert tout ce qui est émotions, habitudes, besoin d'être aimé ; c'est entrer comme un adulte et sortir comme un enfant."},{"b":"text","l":"Pourquoi le Carême dure-t-il 40 jours ?","t":"Dans la Bible, les chiffres ne sont jamais faits pour compter ; ils sont faits pour suggérer, pour évoquer ; ils sont symboliques. On sait depuis toujours que les mamans attendent leur bébé pendant 40 semaines. Pour cela, 40 est devenu le symbole d'un temps de gestation, de maturation, de croissance.\n\nCe sont les 40 ans du peuple juif dans le désert pendant l'exode, le temps pour ce peuple d'esclave de devenir libre ; c'est l'apprentissage de la liberté. 40 jours de Moïse à la rencontre de Dieu : en redescendant de la Montagne, il était rayonnant. 40 jours d'Élie dans l'Horeb, un grand temps de conversion — il y découvre que « Notre Dieu est le son d'une poussière de silence ».\n\nComment calcule-t-on les 40 ? Du Mercredi des Cendres au Samedi Saint, sans compter les dimanches. Quand on vit un vrai carême, avec un véritable effort pendant la semaine, on est content de faire relâche le dimanche."},{"b":"text","l":"Trois méthodes données par Jésus pour vivre dans la Justice","t":"L'aumône apprend à se centrer vers les autres. La prière apprend à se centrer vers Dieu et sur Son Projet. Le jeûne décentre de vous-même, de ce que vous croyez importants, de ce à quoi vous êtes addicts.\n\nCe jour-là, deux questions vous sont posées : Quel e
