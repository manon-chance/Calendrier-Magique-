st le centre de votre vie ? Écouterez-vous la Parole de Dieu ? La priorité : à tout prix, retrouver le sens de l'entraide."},{"b":"text","l":"Liturgie du Mercredi des Cendres","t":"Le prêtre trace une croix de cendres sur le front de chaque fidèle en lui disant :"},{"b":"quote","t":"« Souviens-toi que tu es poussière et que tu retourneras en poussière »\n\nAutres phrases : « Convertissez-vous et croyez à la Bonne Nouvelle » (Marc 1,15) / « Laissez-vous réconcilier avec Dieu » (Saint Paul)"},{"b":"text","l":"Le nombre 40 — symbole initiatique","t":"40 jours de Moïse sur la montagne / 40 jours du peuple juif dans le désert (apprendre la liberté) / 40 jours de Jésus dans le désert / 40 jours après Pâques = l'Ascension / 13 et 40 partagent les mêmes significations d'épreuves initiatiques, de trépas, permettant la seconde naissance, la naissance spirituelle.\n\nAli Baba : confronté au nombre de quarante, épreuve qui attend le héros ou le saint.\n\nSelon le Talmud : Quarante jours avant, la naissance est décidée au ciel — si ce sera homme ou femme, qui sera son compagnon dans la vie."},{"b":"serge","t":"ISAAC — YITS'HAQ : « Celui qui rira » dont le futur sera fait de rire. Quand Dieu annonce à Abraham (âgé de 100 ans) et Sara (90 ans) qu'ils auront un fils, Abraham réagit en tombant sur sa face et se met à rire ! Et Sara se met à rire intérieurement. Dieu donne le nom d'ISAAC, message du rire. Dieu souligne la réaction étonnée des deux parents, mais aussi l'ouverture de la matière, antichambre de créativité et naissance dépendant du rire.\n\nDIEU RIT ET LE MONDE EST !\n\nAbra-ham ou le premier rire oblique = ENFANTEMENT. Méditez, priez et riez vous permet de traverser heureux le temps du désert du CARÊME. Traverser le Carême, c'est aller joyeux vers l'Évènement Pascal."},{"b":"text","l":"La couleur violette pendant le Carême","t":"La couleur liturgique est le violet — la couleur des empereurs et des rois dans l'empire méditerranéen. On l'appelait la « pourpre violette ». Quand il n'y a plus eu de roi en Israël, elle est devenue la couleur des prêtres. Dans le Livre des Nombres : chaque fidèle portait un fil de couleur pourpre dans la frange de son vêtement — manière de dire que nous sommes membres du peuple royal.\n\nLe quatrième dimanche de Carême, dit « Dimanche de Lætare », la couleur rose peut remplacer le violet. Depuis le VIIe siècle, le Carême est dans son calendrier actuel. Le jeûne : ne prendre qu'un repas quotidien en fin de journée, s'abstenir de nourriture le Vendredi et le Samedi Saints.\n\nN.B. : Jeûner, c'est apprendre à se décentrer de soi-même. Le meilleur jeûne = mettre en pièces tous les jougs que vous vous êtes créés."},{"b":"hi","t":"Selon le Talmud : Quarante jours avant la naissance, elle est décidée au ciel — si ce sera homme ou femme, qui sera son compagnon dans la vie. Le Carême : ce mot vient du latin « quadragesima », le quarantième jour ; temps de pénitence de 40 jours."},{"b":"text","l":"La Guématria de YITS'HAQ (Isaac)","t":"En hébreu, seules les consonnes sont inscrites dans l'écriture ; chaque lettre consonne est aussi un chiffre. Les voyelles sont ajoutées par le lecteur. L'utilisation de l'équivalence entre chiffres et lettres est appelée la GUÉMATRIA.\n\nDonc, Y.TS.H.Q. s'interprètent de la manière suivante :\n— Y = 10 : les dix épreuves subies par Abraham, ou les dix ans qu'Abraham a attendus pour avoir un enfant de Sarah\n— TS = 90 : l'âge de Sarah à la naissance d'Isaac\n— H = 8 : le huitième jour, le jour de la circoncision\n— Q = 100 : l'âge d'Abraham à la naissance d'Isaac\n\nTotal = 208 = 2 + 0 + 8 = 10, ou 1 + 0 = 1.\n\nMéditer, prier et rire vous permet de traverser heureux le temps du désert du CARÊME."},{"b":"serge","t":"Un nom de Dieu que l'on retrouve en Genèse 16,13 est « El-Roï » ; c'est le Dieu de vision, celui qui voit à fond votre conscience et votre personnalité. Seul Dieu El-Roï peut vous pénétrer aussi profondément.\n\nCette période de Carême est fondamentale pour votre progression spirituelle mais surtout elle permet de mettre Dieu en AVANT. C'est une période où vous pouvez alléger votre karma si vous augmentez votre champ de conscience, car votre SOI ne demande qu'à vous aider.\n\nAugmenter votre champ de conscience, c'est augmenter également votre imagination, tellement nécessaire dans l'Ère du Verseau."},{"b":"text","l":"Les Tentations de Jésus au désert — Note de Serge","t":"Contrairement à ce que l'on pense souvent, ce n'est pas Dieu qui teste l'homme mais le « diviseur » (traduction de diabolos). Jésus Lui-même, né de l'Esprit qui le remplit et le conduit, a été tenté ! La tentation n'est donc pas opposée à la vie spirituelle ; elle en fait partie.\n\nLe « diable » n'est pas décrit : on sait, et cela suffit, que c'est une puissance qui dépasse l'homme, qu'elle connaît bien, et qu'elle utilise ce qu'il aime pour le diviser.\n\nLa faim nous fait désirer des miracles ! Ce sont des mirages qui nous font quitter ce que nous sommes (division d'avec notre condition humaine), en nous faisant rêver d'un dieu magicien qui n'existe pas (division d'avec Dieu), pour satisfaire nos plaisirs égoïstes (division d'avec les autres).\n\nJésus ne transforme pas la pierre en pain, mais il multipliera les pains pour une foule. Les miracles de l'Évangile sont toujours tournés vers les autres, parce que Dieu est « pour nous ». Jésus refuse une fausse autorité de domination. La sienne, bien réelle, est celle de l'amour dont le signe le plus fort est le pardon.\n\nNous sommes dans le temps et c'est la durée qui vérifie la qualité de notre foi. Quarante jours de Carême pour partager cette victoire. Encore faut-il combattre. À vous de le suivre !"},{"b":"quote","t":"Thérèse de l'Enfant Jésus écrit dans une poésie :\n\n« Te prier pour demain, oh ! Non je ne le puis...\nConserve mon cœur pur, couvre-moi de ton ombre\nrien que pour aujourd'hui. »\n\nVivre en Dieu AUJOURD'HUI est la meilleure façon de vivre en Lui, demain et le restant de vos jours."},{"b":"quote","t":"Saint François de Sales sur l'ascèse du Carême :\n\n« Une continuelle et modérée sobriété est meilleure que les abstinences violentes faites à diverses reprises et entremêlées de grands relâchements. »\n\nL'important n'est pas de faire dans le prodigieux mais de tenir une foi tranquille chaque jour que Dieu fait. Le secret de la vie est de durer. Savoir durer, là est le secret de la foi."},{"b":"text","l":"La Miséricorde — le deuxième nom de l'Amour","t":"Le Pardon fait partie de la Miséricorde. La Miséricorde est le deuxième nom de l'Amour, capable de réparer, de purifier et de sanctifier.\n\nAu sujet de la Miséricorde :\n— Elle ne désespère jamais\n— Elle demande seulement à être accueillie. C'est sa seule limite\n— Elle dépasse la Justice\n— Elle complète la Justice car la Miséricorde est gratuite\n\nMoïse avait annoncé la règle : « Œil pour œil, dent pour dent ». Jésus est venu enseigner une nouvelle morale : au lieu de répondre toujours avec le couteau, l'épée, les humains doivent apprendre à utiliser des moyens plus nobles : la patience, la miséricorde et le sacrifice.\n\nLa seule parole de Jésus : « Père, pardonne-leur car ils ne savent pas ce qu'ils font... » Le pardon du Christ, comme celui de Dieu, est sans limite."},{"b":"serge","t":"Le Pardon, un mot difficile à dire. Dans ces cas, le mot « magique » est : PARDON ! Un vrai pardon venu du fond de votre cœur et de vos émotions.\n\n« Technique » que vous pouvez employer tout en étant SINCÈRE : la technique consiste à amener la victime à faire preuve de noblesse, de générosité afin qu'elle vous pardonne, vous absolve totalement. Cela vous libère de sa colère, chagrin ou amertume. Beaucoup de sincérité, un peu d'adresse et la vie est belle !\n\nRévélation : Le pardon de Dieu précède toujours votre pardon qui doit être sans condition. Si vous ne pardonnez pas, les dons que vous avez en vous s'en vont. En pardonnant, vous renforcez votre force d'aimer. Beaucoup de personnes n'ont pas assez d'amour dans leur vie : elles n'ont pas pardonné."},{"b":"hi","t":"**40 et 13 :** 13 (1+3) et 40 (4+0) ramènent tous deux au 4, et la 13e lettre hébraïque, Mem, vaut 40. Treize est le nombre du passage difficile d'un état à l'autre (Arcane XIII du Tarot : la mort symbolique). Quarante revient sans cesse : le Déluge, le jeûne de Moïse, les 40 jours de Jésus au désert, l'Ascension 40 jours après Pâques."},{"b":"serge","t":"**Les tentations du Carême** (Audio Chaîne Divine Énergie) : elles viennent très vite, dès les premiers jours, et changent selon les années (gourmandise, médisance, désirs…). On n'est jamais tenté au-delà de ses forces : la tentation est un examen qui rend plus fort. On peut succomber et se rattraper le lendemain. Autrefois, une « tête de carême » était une personne triste ; or je fais mon Carême joyeusement : quand vous êtes trop sérieux, c'est facile de vous avoir. Ce qui est réussi pendant le Carême dure toute l'année, car au printemps la graine prend racine."},{"b":"text","l":"Carême et Ramadan","t":"Les deux sont des temps forts de conversion : prière, partage, privation. Mais pour les chrétiens, ce n'est pas le jeûne qui est primordial, c'est la conversion intérieure en vue de Pâques ; pour les musulmans, le Ramadan est d'abord l'accomplissement d'un commandement du Coran, difficile mais non pénitentiel."}]},{"date":"Pendant le Carême","month":"Février","type":"ense","title":"Le Pardon — Base du Carême","sub":"La femme adultère · Isaac « celui qui rira » · Miséricorde","content":[{"b":"mantra","t":"« Christ, je ne suis pas capable de pardonner aux autres et à moi-même, je te rends grâce d'avoir pardonné à ma place ».","l":"Base du Carême — Le Pardon"},{"b":"text","l":"Qu'est-ce que le pardon ?","t":"C'est la violence propre à chacun qui bloque à l'intérieur. Pardonner, c'est continuer à accueillir, risquer un sourire, refuser de haïr et de se venger, continuer à proposer une alliance au-delà des infidélités de l'autre. Ce n'est pas oublier : les expériences passées se reproduisent. En pardonnant, vous entrez dans la douceur de l'Ère du Verseau ; sinon vous restez dans l'effort et la dureté."},{"b":"serge","t":"Je vous ai révélé et fait vivre que **le pardon dégage une énergie joyeuse.** Beaucoup disent : « J'ai toujours pardonné »… sauf à une personne. C'est le plus important pendant le Carême : pardonner, et voir les autres avec beaucoup plus d'amour. Y ajouter une petite privation (supprimer un morceau de gâteau, par exemple) : les petites privations sont aussi difficiles que les grandes."},{"b":"pratique","l":"Pratiquer le pardon","items":["Se demander : qu'est-ce qui me hérisse chez cette personne ? Le noter, puis pardonner à tout le monde","Pour une parole blessante, s'excuser ne suffit pas toujours : y mettre tout son cœur, sincèrement","Demander pardon pour les fautes d'hier et abandonner à Dieu les soucis de demain","Meilleures périodes : le Carême, l'Avent, avant la fin de l'année"]},{"b":"text","l":"La femme adultère","t":"Relire la page du 12 septembre de la Petite Voix : « Pense par toi-même, vis par toi-même et trouve une autre solution par toi-même. » Si ce n'est pas vous qui pensez, c'est le tentateur. Face aux accusateurs comme face au diviseur dans le désert, Jésus évite les pièges tendus. Il se redresse deux fois : pour parler aux accusateurs, puis à la femme. Les plus âgés partent les premiers."},{"b":"text","l":"Isaac, « celui qui rira »","t":"Abraham et Sarah, centenaire et nonagénaire, rient à l'annonce d'un fils : il s'appellera Isaac (Yitshaq), « celui qui rira ». **Dieu rit et le monde est !** Traverser le Carême, c'est aller joyeux vers Pâques, en se gardant de l'orgueil, en pratiquant la charité discrète et le PARDON À TOUS."},{"b":"text","l":"La Miséricorde (Cahiers de l'Hermétisme)","t":"Seuls le Pardon et l'Amour de Dieu vous renouvellent radicalement. Le regret sincère d'avoir mal agi fait que Divine Providence efface la faute comme si elle n'avait pas été commise. L'ordre : le pardon d'abord, puis la bienveillance, puis la miséricorde et la compassion. Ne pas pardonner, c'est quitter la Lumière et aller vers l'accusateur. Le pardon dépend de votre volonté ; la miséricorde est un don de Dieu."},{"b":"quote","t":"« Même raffinée, amoureusement mijotée, froide ou chaude, la vengeance est toujours un plat indigeste. » Pardonner ne vient pas de la tête mais du cœur. — Note de Serge, mai 2015"}]},{"date":"18 fév → 4 avr","month":"Février","type":"ense","title":"Carême — Notes de Serge pour avancer","sub":"Se nettoyer · Les 10 Paroles · Tentations au désert · Les 9 attaques · Questions-réponses","content":[{"b":"serge","t":"(Note de 2017) **Le Carême est fait pour se nettoyer.** On y entre avec ses bêtises, son immaturité, ses défauts ; on travaille dur pour se laver et en ressortir propre à Pâques — se récurer, se « désengrammer ». Prenez conscience de la personne réelle que vous êtes et demandez à Dieu de vous en libérer. C'est grâce à la Ténèbre que l'on devient Lumière."},{"b":"text","l":"Période de progression spirituelle (Audio du 9 mars 2019)","t":"Servez-vous des vertus et des « 10 Paroles », à tort appelées commandements. **On ne lutte pas contre le mal : on rajoute du bien.** Laissez le Soi prendre la première place : cela dépasse les religions, surtout pendant le Carême qui agit en plein SAS de l'Équinoxe de Printemps. Ne dites rien sur la façon dont vous vivez votre Carême, et méfiez-vous de l'ascèse et du jeûne à outrance."},{"b":"text","l":"Les tentations de Jésus au désert","t":"Ce n'est pas Dieu qui tente l'homme, mais le « diviseur » (diabolos). La vie avec Dieu n'est pas une promenade tranquille. La dernière tentation concerne Dieu Lui-même : Il n'est pas à notre service pour nous éviter les blessures, Il vient partager notre humanité. Pour qu'avec Lui nous cheminions de l'égoïsme à la fraternité, de la peur à la confiance, du cynisme à l'espérance."},{"b":"serge","t":"(Séminaire 2003) Si vous ne changez pas d'idées et d'habitudes pendant le Carême, vous repartez pour un même tour. Même le négatif, vous pouvez le remercier et le transformer en positif. Imaginez votre but comme déjà réalisé : c'est le moment de semer de nouvelles graines pour le printemps. Les humains s'endorment quand tout va bien et réagissent quand tout va mal ; c'est quand cela va bien qu'il faut faire mieux : des graines positives sur un sol positif."},{"b":"pratique","l":"Les 9 attaques contre vos négativités (Blog, Carême 2008)","items":["Décider de voir tout en positif et rendre grâce pour ce que vous avez","Imaginer, comme un jeu, comment améliorer votre existence et en visualiser les résultats","Vous faire de nouveaux amis","Leur donner envie de vous suivre","Semer des graines positives dans un sol positif","Demander à Dieu, avec émotion et conviction, une autre vie : « Demandez et vous recevrez »","Arrêter de douter que vous pouvez changer votre vie","Ignorer les critiques et ne pas traîner de « boulets » (personnes négatives ou peureuses)","Faire de votre Dieu votre plus puissant partenaire"]},{"b":"text","l":"Le jeûne, la prière, l'aumône","t":"Ne vous lancez pas dans des mortifications extraordinaires : celui qui veut trop en faire est guetté par l'orgueil ou le découragement. « À chaque jour suffit sa peine » : Dieu vous aime au présent, c'est aujourd'hui qu'il faut L'aimer. Il faut de la persévérance et de la régularité pour se dépouiller peu à peu."},{"b":"quote","l":"Méditation — la parabole du Fils prodigue et du « Veau Gras » (Luc 15, 11-32)","t":"Le fils cadet dilapide son héritage, puis revient : « Père, j'ai péché contre le Ciel et envers toi. » Le père court se jeter à son cou et fait tuer le veau gras : « Mon fils était mort et il est revenu à la vie. » À l'aîné jaloux, il répond : « Toi, mon enfant, tu es toujours avec moi, et tout ce qui est à moi est à toi. »\n\nPendant le Carême, profitez-en pour pardonner à TOUS."},{"b":"serge","t":"**Questions à Serge.** Comment vivre le Carême ? Comme vous le sentez, sinon vous imiterez les autres. C'est surtout une époque de réflexion et de méditation : 1 à 2 minutes par jour suffisent ; inutile de s'inventer des punitions. « Je n'ai pas réussi mon Carême » ? Personne ne réussit le Carême ! Pour le réussir comme Christ, il faudrait jeûner 40 jours et rencontrer le diable en personne. On fait ce que l'on peut : l'essentiel est un effort de volonté et un pas sur le chemin de la vertu."}]},{"date":"14 fév","month":"Février","type":"litu","title":"Saint-Valentin — Fête de l'Électromagnétisme","sub":"14 février · Fête de l'Amour · Énergie de réception","content":[{"b":"text","l":"Ce que c'est","t":"C'est le jour qui correspond au milieu exact du mois (28/2 = 14). Fête de l'amour, des amoureux. Fête de l'Électro(H)magnétisme(F). L'Amour, dépendant de l'Élément « Eau », il faut le laisser venir, c'est-à-dire être dans un état d'esprit de réception. Aucun effort : l'attirance est magnétique. C'est être ouvert à une nouvelle relation, se retrouver comme un enfant et partir à l'aventure."},{"b":"mantra","l":"Mantra donné par Serge pour le 14 février","t":"« Vive Marie ! Vive l'Amour »\n\n« Je rends Grâce à Vierge Marie d'avoir fait bénéficier l'humanité toute entière des Énergies d'Amour pour la Saint Valentin. »"},{"b":"text","l":"Question","t":"Quel est mon potentiel d'humour dans l'Amour ? La part d'humour dans le couple ?\n\nLe 14 février : Pourquoi ne pas vous faire à vous-même un cadeau d'Amour ?"}]},{"date":"26 fév","month":"Février","type":"cosm","title":"Lundi Pur","sub":"40 jours avant Pâques · Sphère de Yesod · La Lune","content":[{"b":"text","l":"Ce que c'est","t":"C'est le premier lundi qui suit le Mercredi des Cendres ou le premier dimanche de carême. Ce jour-là, le contact est plus facile avec la pureté de la Sphère de Yesod, donc la Lune. Yesod dans la Kabbale = la Lune, le plan astral, les émotions."},{"b":"hi","t":"Journée particulièrement propice pour la purification intérieure, travailler sur ses émotions et son plan astral. Se connecter à la Lune, au principe féminin, à l'intuition."}]}];
var D_MARS=[{"date":"Mars","month":"Mars","type":"mois","title":"Mois de Mars — CONQUÊTE · RENAISSANCE","sub":"Archange Raphaël · Sphère Hod-Mercure · Deux Éléments : Feu et Air","content":[{"b":"eileen","t":"« Ne mets pas ta sécurité dans les choses de cette vie, mais mets ta sécurité en Moi, la source du tout pouvoir et de toute force tout au fond de toi. »\n\nImage : Moulin à vent. Un grand vent soufflait et les ailes tournaient à grande vitesse. Puis le vent tomba et les ailes cessèrent de tourner, car elles dépendaient entièrement du vent pour leur mouvement."},{"b":"text","l":"MARS est le Dieu de la guerre. C'est le début de l'année romaine","t":"Deux Éléments importants : le FEU et l'AIR. Nature : La sève monte dans les arbres, les fleurs, les feuilles éclosent. Les graines germent. Période de renaissance : expansion de la parcelle divine, et se mettre en harmonie avec la Nature.\n\nArchange : Raphaël, archange de la guérison (Air) dans les problèmes d'argent et d'amour. Il travaille sur la Nature de manière curative (il vit dans la Sphère de Hod-Mercure). Sphère Bénie de Chebourah. Signe : BÉLIER (à partir du 21 mars). Dominé par MERCURE."},{"b":"text","l":"MARS, c'est le Mois","t":"— De la conquête, de la victoire, de la justice et de la rigueur\n— De régénération de la matière, des forces de croissance\n— De l'opportunité de changement\n— Pour éliminer la part d'endormissement en soi, réveiller et renforcer sa volonté\n— De transformation par les Quatre Éléments\n— De revitalisation de l'individu\n— De création\n— Mois durant lequel a lieu le CARÊME : Dans le désert, on se débarrasse\n— Symbole du Printemps : L'Abondance. Printemps = sourire = Pentagramme"},{"b":"mantra","l":"Mantra de Mars","t":"« En Christ Joie et Légèreté divines »"},{"b":"text","l":"ÉTAT D'ESPRIT DU PRINTEMPS","t":"— Être très léger, se détendre, s'amuser, surfer\n— Être ouvert et disponible\n— Avoir du détachement, foi en Dieu et en soi\n— Projeter une demande en périphérie et marcher sans se soucier\n— Ne pas être en guerre contre soi-même, affûter ses armes pour de nouvelles actions\n— Mettre l'ego à genoux"},{"b":"text","l":"QUALITÉS","t":"— Rigueur - tri\n— Volonté\n— Réfléchir sur certaines situations"},{"b":"text","l":"QUESTIONS","t":"— Avez-vous le désir de renaître ?\n— Qu'avez-vous envie de créer, surtout à partir du 14 mars ?\n— Quel regard nouveau portez-vous sur votre vie ?\n— Qu'avez-vous réalisé en changement depuis 1 an, depuis 5 ans ?"},{"b":"text","l":"MOTS-CLÉS","t":"— Conquête\n— Renaissance"},{"b":"text","l":"Réflexion du Mois de Mars","t":"La volonté doit toujours laisser en vous un fort désir de conquête. Avec de la volonté, l'échec est un barreau qui vous amènera au faîte de l'échelle de la victoire. Allez de l'avant toujours et encore plus, voilà ce qui est important. Qu'en pensez-vous ?\n\nPagedu 3 janvier (à relire en mars) : « L'Amour voit le meilleur chez l'autre. Garder son cœur ouvert et laisser couler l'amour. »"},{"b":"hi","t":"**MARS — Le bon côté et le mauvais côté :** Le bon côté : pouvoir de conquête et de justice (à voir à travers la Sphère Bénie de Tiphereth). Le mauvais côté : **tyrannie — jalousie.** Être vigilant sur ces deux pentes de Mars. L'Ère du Verseau, c'est la vie, le printemps. Printemps = sourire = Pentagramme.\n\nRenaissance = expansion de la parcelle divine. Plus elle est expansée, plus elle se calme, elle amène le silence, le vide, l'harmonie, l'abondance et ce dont j'ai besoin, je le reçois.\n\nL'important est de tenir une foi tranquille chaque jour que Dieu fait : **savoir durer, là est le secret de la foi.** NB : la plus grande tentation pendant le Carême, c'est de ne pas vouloir changer."},{"b":"serge","t":"MARS ! Synonyme de Printemps, de la Vie qui, partout et en tout, ressurgit (même dans les affaires et histoires d'argent). C'est le retour de l'Archange Raphaël. Son Nom signifie Dieu Guérisseur, Dieu guérisseur dans la Matière ! Vous voulez vous régénérer ? C'est le moment. Vous voulez régénérer vos proches ? Oui à distance avec la Magie Christique, cela est possible. Vous voulez régénérer vos affaires de cœur ou d'argent ?\n\nLa Magie Christique, à cette époque de l'année, atteint son apogée !\n\nJ'adore l'Équinoxe de Printemps, meilleur moment de l'année.\n\nCONCLUSION : Renaître comme un enfant et repartir simplement dans la vie. En tant qu'enfant, votre vie est vide. Mettre dans le vide un plein qui vous sert."},{"b":"text","l":"Note sur le Carême en Mars","t":"Le Carême est le moment de se souvenir que vous êtes tous des fils prodigues, avec un Père aimant, qui pardonne tout ; grâce à Christ, vous n'êtes plus des brebis égarées, mais des enfants sauvés. Moment idéal pour faire un effort sur soi en vue d'éliminer tout ce qui est source de blessure pour autrui. Il vous invite à voir qu'en toute situation, il y a toujours la possibilité de faire germer l'Amour. Le Carême vous invite à vaincre la violence par l'Amour."},{"b":"pratique","l":"En Mars","items":["Sentir l'état énergétique du Printemps : le feu jaillit de la Terre, début des grandes marées","Sortir les pensées semées en hiver","Prendre ses décisions uniquement en Lune montante","Pendant le Carême, mettre sa propre maison en ordre : voir ses limites, mais surtout le meilleur en chaque être humain"]}]},{"date":"8 mars","month":"Mars","type":"litu","title":"Journée de la Femme","sub":"Mantra offert par Serge","content":[{"b":"mantra","l":"Mantra offert par Serge pour le 8 mars","t":"« Bonheur Divin à toutes les femmes incarnées et désincarnées. »"},{"b":"serge","t":"La femme représente la moitié de l'humanité. Elle représente la moitié de l'homme. Donc, tous ceux qui n'ont pas de femme ou à l'inverse, les femmes qui n'ont pas de maris, c'est comme si vous marchez sur un pied. Ce n'est ni confortable, ni harmonieux. Essayez d'arranger cela. Trouvez votre autre moitié. Si vous ne la trouvez pas, c'est de votre faute, non celle de Dieu et des autres."}]},{"date":"5 mars","month":"Mars","type":"litu","title":"Mi-Carême — Le cap du Fils prodigue","sub":"Mantra foudroyant d'efficacité","content":[{"b":"text","l":"Vous êtes à la mi-carême","t":"Moment de faire le point pour maintenir le cap jusqu'à la Semaine Sainte. Ce cap est celui du Fils prodigue — il est excellent de relire la Parabole. Le Carême est le moment de se souvenir que vous êtes tous des fils prodigues, avec un Père aimant, qui pardonne tout. Le Carême est plus une démarche d'Amour de Dieu vers l'humain qu'un retour de l'humain vers Dieu. Comme un bon Père, Dieu vous attend avec tout Son Amour."},{"b":"text","l":"Le Carême est aussi le temps des tentations","t":"Jésus dans le désert subit une triple tentation : changer les pierres en pain, se jeter au bas d'une muraille, diriger les royaumes terrestres. Ces trois tentations récapitulent les tentations d'Adam au Paradis et d'Ismaël au désert, ainsi que celles auxquelles quotidiennement vous êtes confronté personnellement. Jésus a vaincu ces tentations pour vous permettre d'être capable de les vaincre à votre tour. Sa victoire sur le Tentateur au désert anticipe la victoire de la passion."},{"b":"mantra","l":"Mantra foudroyant de la Mi-Carême","t":"« Je te rends grâce Divine Providence de m'avoir pardonné et accueilli en Fils bien-aimé dans Ton Cœur et Ta Maison. »"},{"b":"serge","t":"Cette phrase est foudroyante d'efficacité. Elle peut guérir bien des maladies et autres dysharmonies ; elle réjouit le Cœur de Dieu et celui des Seigneurs du Karma sans oublier Jésus le Christ.\n\n« Il y a de la joie parmi les Anges de Dieu pour un seul pécheur qui se repent. » (Luc 15-10)"},{"b":"text","l":"Questions à se poser","t":"— Êtes-vous si sûr de vos résolutions ?\n— N'êtes-vous pas trop pusillanime, prêt à retourner dans les mêmes ornières ?\n— Votre force ? CHRIST ! Il peut être au plus petit de vos actes de pénitence."},{"b":"mantra","l":"Mantra foudroyant d'efficacité","t":"« Je te rends grâce Divine Providence de m'avoir pardonné\net accueilli en Fils bien-aimé dans Ton Cœur et Ta Maison. »\n\nCette phrase peut guérir bien des maladies et autres dysharmonies ; elle réjouit le Cœur de Dieu et celui des Seigneurs du Karma sans oublier Jésus le Christ."},{"b":"quote","t":"« Il y a de la joie parmi les Anges de Dieu pour un seul pécheur qui se repent. » (Luc 15-10)\n\nQuelles que soient ses faiblesses, le fils prodigue que vous êtes peut toujours rentrer à la Maison. Votre force ? CHRIST !"},{"b":"hi","t":"**Votre force ? Christ !** Il est présent dans le plus petit de vos actes de pénitence. Pour ne pas vous décourager, recentrez-vous sur Dieu et récitez le Notre Père : « Ne nous laisse pas entrer en tentation, mais délivre-nous du mal. » Sans Lui, le Tentateur n'a aucun mal à vous faire céder."}]},{"date":"14-21 mars","month":"Mars","type":"cosm","title":"SAS des 7 jours — Préparation à l'Équinoxe de Printemps","sub":"14 au 21 mars · Déstructuration des Éléments","content":[{"b":"text","l":"Ce que c'est","t":"SAS de sept jours pendant lesquels les Éléments sont déstructurés afin de permettre la venue d'un nouveau cycle. À cette période, tout se joue. On touche les fruits cet été. En étant en harmonie avec l'Équinoxe, on développe habileté, intelligence et subtilité."},{"b":"hi","t":"**Se référer au chapitre SAS Cosmiques** en tête de ce calendrier pour le protocole complet. Les 7 jours AVANT sont très importants, mais les 7 jours après, laissez-vous porter."}]},{"date":"20 mars","month":"Mars","type":"cosm","title":"Équinoxe de Printemps — Archange Raphaël entre","sub":"Cycle Matériel s'ouvre · Dieu Guérisseur · Sphère Hod-Mercure","content":[{"b":"text","l":"Signification cosmique","t":"Le premier cycle de l'année, ouvert par l'Équinoxe de Printemps, est de nature matérielle. La vie physique reprend son essor, la sève monte dans les arbres, les fleurs éclosent, les animaux s'accouplent. Ce cycle débute avec un programme axé sur la réalisation dans la matière.\n\nDurant cette période de six mois jusqu'au prochain Équinoxe du 21 septembre, les Énergies Cosmiques travaillent à la régénération de la matière. Donc le plan astral et le plan éthérique sont plus en activité.\n\nC'est la naissance de l'enfant (alors que le 21 décembre, c'est le début de la gestation). À cette période, avoir un regard nouveau."},{"b":"text","l":"Archange Raphaël","t":"Cet Équinoxe est sous l'influence de l'ARCHANGE RAPHAEL. Son nom signifie « DIEU GUÉRISSEUR ». L'Archange Raphaël vit dans la sphère HOD-MERCURE. Cet Archange et les Anges qui sont sous ses ordres travaillent la nature de façon curative. Il dirige par esprits, dévas interposés, la régénération et la croissance de la Nature. Le Mage travaille non pas en Yesod, mais en Hod-Mercure.\n\nLes Anciens choisissaient certains jours et des formules spéciales pour se lier à lui. Ainsi ils ont eu des révélations concernant les propriétés des plantes. Le Dieu grec de la médecine ASKLEPIOS — ou ESCULAPE — était en liaison avec les Forces d'HERMÈS ou de MERCURE. Ce n'est donc pas par hasard que le caducée d'Hermès est resté, depuis des millénaires, le symbole universel de la médecine."},{"b":"hi","t":"Si vous ne pratiquez pas la Kabbale et l'Arbre de Vie, beaucoup de Savoirs et de Pouvoirs vous sont fermés. Vous végéterez dans l'ignorance des Grandes Vérités. L'Enseignement que nous diffusons est révolutionnaire par sa simplicité et sa puissance."},{"b":"pratique","l":"Dès l'approche du Printemps","items":["Reliez-vous à l'Archange Raphaël","Demandez-lui de vous révéler les secrets des plantes, des graines et des fleurs, afin de bénéficier des bonnes influences qu'elles contiennent et répandent autour d'elles","Au printemps, la Nature ressuscite, rappelant à l'homme que lui aussi doit ressusciter, peut-être pas physiquement, mais spirituellement","De même que la sève monte dans la végétation pour la renouveler, l'homme doit travailler pour que la sève spirituelle pénètre en lui afin de vivifier ses corps subtils","Donc, à cette époque, se mettre en mode réception pour se laisser remplir par la sève du Printemps","Faire des exercices de rajeunissement (notamment ceux du premier livre de Franz Bardon) : pour tuer le vieil homme, renforcer la fermeté pour se libérer des émotions et permettre le détachement"]},{"b":"serge","t":"C'est le seul moyen de se restructurer, donc de s'élever de l'intérieur. En se servant des Énergies Cosmiques du 14 au 21 chaque fois et ensuite, du jour de l'Équinoxe et du solstice. Je travaille, comme Mage, les effets de la Lune dont les Énergies Cosmiques des Équinoxes et des Solstices. Si vous devez vous marier, ce sont de bonnes époques pour préparer votre mariage. De même, pour créer une entreprise parce que c'est la sève qui monte dans les arbres."},{"b":"hi","t":"Pour réussir votre année, il faut avoir CONSCIENCE des Énergies bénéfiques des différents mois de l'année, en particulier des mois de Mars, Avril et Mai. Mars, Avril et Mai = tiers de l'année = tiers du nombre 9 (Nombre de la Perfection)."},{"b":"serge","t":"RÉVÉLATION — Décodage du tableau de la Cène de Léonard de Vinci en rapport avec les Équinoxes et Solstices :\n\nVisualisez la Cène qui a été peinte par Léonard de Vinci. Tous les apôtres sont réunis pour ce dernier banquet et Jésus est au milieu. Si vous regardez bien, vous remarquerez que Jésus est au milieu et les apôtres sont en 4 groupes de 3 disciples.\n\nC'est donc le cycle de l'année : il y a d'abord l'Équinoxe de Printemps, ensuite le Solstice d'Été, ensuite vous repartez sur l'Équinoxe d'Automne, le Solstice d'Hiver et vous repartez.\n\nLéonard de Vinci avait des connaissances sur les solstices et équinoxes qui remontent assez loin."},{"b":"serge","t":"Audio « Équinoxe de Printemps » (Chaîne Divine Énergie) : c'est le temps de la régénération de la matière, la renaissance, l'occasion de changer. Pendant l'Équinoxe, on prend conscience de sa psychologie. **Principe : il faut mourir pour renaître** — se servir des Énergies Cosmiques du Printemps pour renaître."},{"b":"text","l":"Le Taureau, l'Agneau et la précession des Équinoxes","t":"Pâques, résurrection du Christ, correspond à la résurrection de la Nature : la vie d'un Initié suit la vie de la Terre et de l'Univers. Avec la précession des Équinoxes, le Soleil de Printemps change de signe environ tous les 2 151 ans. Il y a quatre mille ans, il ouvrait l'année dans le Taureau (Veau d'or, bœuf Apis, Taureau de Mithra) ; il est ensuite passé dans le Bélier, l'Agneau céleste. L'Apocalypse décrit ce mystère de l'Agneau, entouré des quatre animaux (Lion, Taureau, Homme-Verseau, Aigle), et la Vierge céleste couronnée d'étoiles, debout sur le Serpent."}]},{"date":"25 mars","month":"Mars","type":"litu","title":"L'Annonciation — Notre-Dame de Mars","sub":"9 mois avant Noël · Visite de l'Ange · Emmanuel = « Dieu avec nous »","content":[{"b":"text","l":"Ce que c'est","t":"Cette fête s'appelle aussi « Notre-Dame de Mars » ou « Visite de l'Ange ». Fête de l'incarnation. C'est 9 mois avant Noël. Annonce de la naissance d'un fils Roi."},{"b":"quote","t":"« Qui reste couverte par l'Ombre du Très-Haut » (Luc 1,35)\n\nLe texte de Luc, en I, 35, ajoute que cela dure trois mois. Bienheureusement (il ne pouvait en être autrement), ces trois mois sont les trois signes du **Soleil glorieux et victorieux.**\n\nMarie demeure avec Elizabeth encore trois mois puis, s'en retourne en sa maison (Luc 1,56) en attendant d'accoucher de Jésus, nommé par l'Archange Gabriel : Emmanuel."},{"b":"serge","t":"Emmanuel : « Dieu avec nous ». Curieusement ce nom « Emmanuel » ne sera jamais plus prononcé, indiquant ainsi une haute Initiation secrète. L'Église le place étonnamment le 25 mars ; étrange que l'Église en fasse un saint alors que c'est le Nom secret de Jésus. Cela dissimule un autre secret initiatique qui ne sera pas dévoilé aujourd'hui."},{"b":"quote","t":"Décodage de la page du 24 mars par Serge : « Si tu fais un pas, Dieu fera le reste du chemin. Du \"vouloir faire\" impatient, reviens au \"laisser faire\". » Pourquoi te préoccuper de l'avenir avec anxiété alors que tu ne sais pas si demain tu seras en vie ! Ouvre les yeux, profite de ce qui se passe chaque moment de chaque jour."}]},{"date":"29 mars","month":"Mars","type":"litu","title":"Dimanche des Rameaux — La Grande Semaine commence","sub":"Pâque fleurie · Jour de GLOIRE · Énergies Divines au maximum","content":[{"b":"text","l":"Ce que c'est","t":"Aussi appelé « La Pâque fleurie ». Jésus entre triomphalement à Jérusalem sur un âne blanc et les personnes lui jettent des rameaux. Il est dit dans l'Ancien Testament que le Messie qui viendrait entrerait dans Jérusalem sur un âne blanc. La Semaine Sainte est appelée autrefois la GRANDE SEMAINE, celle où l'Église revit la Passion et la mort du Seigneur. À cette époque de l'année, afflux d'Énergies Divines et Cosmiques autour de Pâques. À cette époque-là, Dieu vous entend plus."},{"b":"hi","t":"Les Rameaux, c'est le TRIOMPHE. **C'est un jour de GLOIRE.** Si vous désirez de la gloire, c'est un jour fait pour vous. Grande semaine de PARDON."},{"b":"pratique","l":"Ce que Serge dit pour toute la Semaine Sainte","items":["La vivre en conscience, en se réveillant chaque matin dans la JOIE","Grande semaine de PARDON","Chaque jour va vous amener à la renaissance. On redonne le potentiel de vie à la naissance de l'Équinoxe du Printemps","Considérer que les jours de cette Semaine Sainte sont très bénéfiques","Pendant cette période, demandez à Dieu de réaliser vos vœux et faites comme si c'était déjà réalisé — initiatiquement c'est la 8ème Dimension (c'est très secret)","Ne pas se remettre en question mais voir, avec détachement, les tentations du Carême et se remplir d'électromagnétisme","Voir si les engagements du carême sont bénéfiques","Enfin, amusez-vous à vous « éclater », à devenir le meilleur. Dans la journée, pensez plusieurs fois que vous êtes le meilleur !"]},{"b":"text","l":"Dimanche des Rameaux — contexte","t":"Jésus entre triomphalement à Jérusalem sur un âne blanc. Il est dit dans l'Ancien Testament que le Messie qui viendrait entrerait dans Jérusalem sur un âne blanc. En entrant dans Jérusalem ce jour-là, Jésus se présentait clairement comme le Messie. Considérez ce jour comme jours de GLOIRE personnelle. Si vous désirez de la gloire, c'est un jour fait pour vous.\n\nSerge a laissé une mine d'or pour gérer votre vie ainsi que des conseils précieux. La sagesse : ne pas s'identifier à ce que vous faites car c'est la vérité du moment."},{"b":"quote","t":"Lundi Saint — Psaume 26 : « Le Seigneur est ma Lumière et mon Salut. De qui aurais-je crainte ? Le Seigneur est le rempart de ma vie. Devant qui tremblerais-je ? »\n\nNote de Serge : Mon cœur est sans criante. Je garde confiance. La sagesse : ne pas s'identifier à ce que vous faites car c'est la vérité du moment."},{"b":"hi","t":"Avez-vous remarqué que lors de la Semaine Sainte, on ne fait pas mémoire des Saints ? Rappel : **Une seule bonne pensée renforcée par votre volonté peut changer votre vie.**"},{"b":"mantra","l":"Pour le Triduum de la Semaine Sainte","t":"« Christ toujours Vivant ! »\n\n« Joie ! Joie divine ! Joie Divine ! »"},{"b":"hi","t":"**N.B. : La Croix est en chacun de nous.**\n\nLors de cette dernière semaine : Être dans la JOIE car on aperçoit l'oasis (Pâques) où l'on va trouver l'abondance, la joie, le renouveau, la beauté, etc... toutes les couleurs. C'est fournir à son mental de la joie et de l'harmonie. Sortir du désert, c'est avoir tout perdu et maintenant, se poser la question : Que vais-je faire ?"},{"b":"text","l":"Le Triduum Pascal — ce que c'est","t":"— Jeudi Saint : Fête du repas de la Cène et première apparition de l'Eucharistie\n— Vendredi Saint : La Passion et la Mort de Jésus sur la Croix ou Crucifixion\n— Samedi Saint / Vigile Pascale : nuit du samedi au dimanche de Pâques, jour de la Résurrection, centre et espérance de la Foi chrétienne"}]}];
var D_AVRIL=[{"date":"Avril","month":"Avril","type":"mois","title":"Mois d'Avril — CONCRÉTISATION · SILENCE · INSPIRATION","sub":"Mois QUATRE · A.VRIL = Énergie de Vie Primordiale · Élément AIR","content":[{"b":"eileen","t":"« La foi vient avec la pratique. Vis par la foi jusqu'à ce qu'elle devienne semblable à du roc et soit inébranlable. Et trouve la liberté de l'esprit. »\n\nImage : Oisillon qui apprend à voler jusqu'à ce qu'il ait trouvé la liberté du vol et soit capable de planer à de grandes hauteurs et de voler sur de grandes distances sans aucun effort."},{"b":"text","l":"AVRIL dans le cycle","t":"Avec la première lettre d'Avril, « A » on prépare l'Élément AIR. Le Nombre 4 est le nombre de la Perfection et du Tétragrammaton, Dieu. Ce 4ème mois symbolise, après l'Équinoxe du Printemps, les 4 Éléments Universels : le Feu, l'Air, l'Eau, la Terre. Mois le plus méconnu — Il peut être dangereux. Élément : AIR (Imagination). Couleur : Bleu clair.\n\nLe meilleur emploi du mot AVRIL me paraît « A.VRIL » ; VRILL, l'Énergie de Vie Primordiale qui nourrit le monde visible. AVRIL est situé entre 2 MA : MARS et MAI."},{"b":"text","l":"MI et MA — secret initiatique","t":"Le « MI » : le mythe, mythologie – esprit, le culte de Mitra. Pour réaliser dans la matière (MA), il faut partir du « MI ». Si vous agissez dans la matière sans vous servir du « MI », c'est l'ego qui agit. Le « MI » et le « MA » sont étroitement liés. Tout ce qui se crée à partir du « MI » est bien transformé tandis que ce qui est créé par le « MA » est périssable. Le « MI » part de l'Akasha, traverse l'Astral, la matrice éthérique et se concrétise dans la matière (« MA »)."},{"b":"text","l":"AVRIL, c'est le Mois","t":"— De la concrétisation de Dieu sur la Terre, d'où l'importance du minéral (Le germe monte dans les plantes)\n— Discret et florissant en projets\n— Le Vril ; or, le Vril est une énergie terrestre très puissante\n— De l'Énergie de Vie Primordiale qui nourrit le monde visible\n— Riche pour la faculté de penser\n— De révélations sur notre vraie nature"},{"b":"pratique","l":"ACTIONS d'Avril","items":["Faire le tri avec les projets du Carême et voyez s'ils sont bons","Chercher ce que l'on veut concrétiser en Mai","Faire attention aux projets et ne les dévoilez pas — Réussir par le silence","Ne rien découvrir de votre personnalité et ne pas montrer ce que vous préparez","Ne pas prendre de risques","Réfléchir et voir ce que je veux concrétiser en Mai"]},{"b":"text","l":"QUESTIONS","t":"— Comment allez-vous renaître ?\n— Êtes-vous emporté par la synergie des habitudes et du passé ?\n— Avez-vous envie de changer vos formes de pensée ? (Se rappeler qu'à tout moment, par une pensée, on peut changer sa vie. En avril, c'est plus facile.)\n— Avez-vous vraiment envie de vous adapter, de changer ?"},{"b":"text","l":"DICTON initiatique","t":"« Ne te découvre pas d'un fil. » Ce dicton signifie initiatiquement : taire vos projets dans la matière, entamés ou créés au mois de Mars, à Pâques ou à l'Équinoxe du Printemps."},{"b":"text","l":"MOTS-CLÉS","t":"Concrétisation · Silence · Inspiration"},{"b":"hi","t":"**Attention !** En Avril, on prépare le 1er mai. Les Énergies du 1er Mai commencent 7 jours avant. La Réflexion du Mois : Votre source principale de malheur vient que votre vie actuelle n'est pas celle que votre mental aurait souhaitée. Dans ce cas une solution : Réveillez-vous en vous ! Mieux encore, ressuscitez-le ! Dans chaque être humain, Jésus le Christ est là, à la portée de chacun."},{"b":"serge","t":"Commentaire sur la page du 1er avril : Si vous possédez des croyances légères, elles ne vous possèdent pas. Si par contre, elles sont lourdes, alors quels qu'en soient les domaines ou les raisons, je vous plains. Toute question est une limitation. Je vous souhaite de vivre en paix avec vous-même, moins prisonnier du jugement des autres, plus près, encore plus près de votre âme divine.\n\nLa première croyance, la plus dangereuse, est de croire ce que vous pensez de vous. Si vous me demandiez ce que je pense de moi, je vous répondrai à deux niveaux : Le premier est que je suis Dieu et que je le vis profondément. À un niveau moins métaphysique, je vous répondrai que je ne pense rien de moi. Je suis neutre, je suis comme je suis avec mon caractère, mes qualités et mes défauts. C'est un constat, pas autre chose.\n\nVotre vie sur la terre ne peut pas s'étirer à l'infini lors d'une incarnation. Arrêtez donc de lutter contre vos propres croyances. Si, en Avril, le célèbre dicton dit : « Ne te découvre pas d'un fil », je vous conseillerai toutefois de vous dénuder intérieurement et de retrouver l'enfant que vous étiez."},{"b":"hi","t":"**1er Avril — Poisson d'Avril :** Méfiez-vous de ne pas tomber. Voyez ce qui ne va pas en soi pour s'en débarrasser. C'est le message du 1er Avril initiatique."},{"b":"eileen","t":"Conférence du 14 avril 2024 — Page du 14 avril dans la « Petite Voix » :\n\n« C'est important qu'il y ait équilibre dans toute situation, à tous les instants. Tu verras qu'il y a toujours un équilibre parfait lorsque tout ce que tu entreprends est fait sous Ma conduite.\n\nC'est pourquoi tu dois laisser la vie s'épanouir sans essayer de forcer quoi que ce soit car, ainsi, cela ne peut mal tourner et rien ne peut être fait au mauvais moment. Cela ne veut pas dire t'asseoir et ne rien faire.\n\nTu dois rester sans cesse en alerte ; tu dois garder ta conscience élevée ; tu dois t'attendre au meilleur, tu dois être sûr que tout est très, très bien.\n\nTu dois M'attendre dans la foi et la confiance absolues. Tu dois savoir sans l'ombre d'un doute que JE SUIS en permanence Ton guide et Ton compagnon.\n\nTu dois savoir que tout ce que tu fais est guidé par Moi et Moi seul, afin que chacun des pas que tu accomplis soit ferme et sûr et que chaque chose que tu fais soit faite dans l'amour. »\n\nDécodage : Fais le premier pas et Dieu fera le reste. Il faut bouger dans l'harmonie et dans l'équilibre. Se rappeler en permanence qu'Il est Votre guide et Votre compagnon, c'est très confortable et très rassurant. Si vous souhaitez faire des changements dans votre vie, prenez-Le avec vous comme associé et lui donnez 100% des parts. Le partage ne sert à rien. Laissez-Le faire à votre place : changement de vie, d'organisation et même les petites choses de votre vie quotidienne."},{"b":"mantra","l":"Commentaire de Serge sur la Petite Voix du 29 avril","t":"« Ouvre-toi au flot de Mon amour divin et de Ma lumière divine. Ouvre les portes de ton cœur et ne laisse rien arrêter ce flot. Garde ces portes grandes ouvertes afin que l'amour et la lumière puissent couler librement en toi et à travers toi, et que la force de vie reste toujours bien présente en toi. »\n\nDécodage : Faire confiance, avoir la Foi et plus d'ouverture. L'action, adaptée à chacun, empêche l'inertie. Puiser chaque jour en Dieu, dans l'amour et l'enthousiasme. Se sentir comme la Nature, l'Océan, illimité."},{"b":"hi","t":"**Conseil :** profitez de l'Énergie d'Avril, porteuse du renouveau de l'Équinoxe. Elle vous porte toute l'année et donne une super énergie matérielle. Vivez-la en conscience, joyeusement : elle porte sans effort."}]},{"date":"2 avr","month":"Avril","type":"litu","title":"Jeudi Saint — La Cène & l'Eucharistie","sub":"Institution de l'Eucharistie · Lavement des pieds · Testament de Jésus","content":[{"b":"text","l":"Le Jeudi Saint","t":"C'est le Jeudi précédant Pâques, et l'institution de l'Eucharistie. Jésus offre son corps et son sang pour le salut du monde. C'est le dernier soir. Jésus laisse un testament à ses Apôtres."},{"b":"text","l":"« Ceci est mon corps » — ce que Jésus a dit en araméen","t":"Durant le dernier repas, Jésus n'a certainement pas employé les mots « Ceci est mon corps » en français. Sa langue était l'araméen. Et en araméen, « mon corps » signifie « moi ». Portez votre attention sur ce que faisait Jésus au moment où il a dit ces mots, partageant le pain et le vin.\n\nL'intention de Jésus en donnant le pain et le vin devient plus claire lorsqu'on porte son attention sur les mots dits à Pierre lors du lavement des pieds : « Si je ne te lave pas les pieds, tu ne pourras avoir part avec moi ». Pierre n'a rien compris à l'intention de Jésus et a demandé à être lavé de la tête aux pieds. De même, lorsqu'il partage le pain, son intention n'est pas de les rassasier mais de les unir à Lui. « C'est moi », recevez-moi, devenez UN avec moi.\n\nCelui qui change le pain et le vin en corps et en sang du Christ est le Saint-Esprit. Le Saint-Esprit ne change pas seulement le pain et le vin en corps et en sang du Christ, il change aussi le peuple en Corps Mystique du Christ."},{"b":"text","l":"Le Lavement des pieds","t":"« Dieu de l'Univers se met à genoux » : Dieu se laisse voir à genoux aux yeux de ses créatures. Il sera obligé de lever la tête pour répondre à Pierre. C'est un Dieu qui se met aux pieds des hommes. Lavement des pieds = invitation au service. Position du serviteur. Avec lui, nous sommes invités à servir le monde pour le sauver."},{"b":"text","l":"L'Eucharistie — ce qu'elle est vraiment","t":"L'intention de Jésus n'était pas de rassasier mais d'unir ses apôtres à Lui. « C'est moi », recevez-moi, devenez UN avec moi. Le Saint-Esprit ne change pas seulement le pain et le vin en corps et sang du Christ, il change aussi le peuple en Corps Mystique du Christ.\n\nCelui qui change le pain et le vin en corps et en sang du Christ est le Saint-Esprit. Dans la troisième prière eucharistique, il est dit :"},{"b":"quote","t":"« Fortifie-nous avec son corps et son sang, remplis-nous de son Esprit-Saint pour que nous soyons un seul cœur et une seule âme dans le Christ. »\n\n« Celui qui s'unit au Seigneur est un seul esprit avec lui. » (1 Cor 6:17)\n\n« Ceci est mon corps livré pour vous. Faites ceci en mémoire de moi. »"},{"b":"pratique","l":"À faire ce jour","items":["Manger en CONSCIENCE après avoir béni le pain ou l'aliment ou rendu grâce — penser que c'est le Corps du Christ","Rendre grâce","À faire en SILENCE et avec le sens du SACRÉ","Bénir et rendre grâce = considérer que Divine Providence ou Divine Mère vous nourrit"]},{"b":"hi","t":"L'essentiel est la relation privée avec le Christ. « si quelqu'un n'a pas l'Esprit du Christ, il ne lui appartient pas » (Rom. 8:9). **Le plus important dans l'Eucharistie est l'Esprit-Saint.**"},{"b":"text","l":"Extrait des Enseignements Initiatiques — La Cène","t":"Jésus, au moment de la Cène, condensait tout l'amour qu'il portait à l'humanité et à Ses disciples. Saint Jean l'a bien compris ; il établit l'équivalence entre le lavement des pieds et l'institution eucharistique. Paul et Jean, de générations pourtant différentes, donneront beaucoup d'importance à l'eucharistie.\n\nJean consacre 5 chapitres au dernier repas de Jésus ! Mais ne dit rien sur l'institution eucharistique ! Peut-être donne-t-il plus d'importance au lavement des pieds. Dans les deux cas, eucharistie et lavement des pieds, il y a invitation à les renouveler.\n\nD'après Flavius Josèphe, les 12 pains sur la Table de la Cène représentaient les 12 mois de l'année.\n\nRetenez deux phrases de Jésus ce soir-là :\n— « Je suis au milieu de vous à la place de celui qui sert. » (Luc 22, 24-27)\n— « En vérité, en vérité, je vous le dis, un serviteur n'est pas plus grand que son maître. » (Jean 13, 13-16)\n\nCeci est valable à reproduire dans l'amour, pas que dans le rite ! « Ayant aimé les siens, Il les aima jusqu'au bout » (Jean 13, 1)"},{"b":"text","l":"La Didachè — Premier texte sur l'Eucharistie (fin 1er siècle)","t":"Texte retrouvé au XIXe siècle, révéré presque à l'égal des Évangiles au IIe siècle, puis disparu. Il décrit comment l'Eucharistie doit être célébrée :\n\n« Quant à l'Eucharistie, faites ainsi votre action de grâce. D'abord la coupe : Nous te rendons grâce, notre Père pour la Sainte vigne de David, Ton serviteur que tu nous as fait connaître par Jésus ton Enfant. À toi la gloire pour les siècles. Pour la fraction du pain : Nous te rendons grâce notre Père, pour la vie et la connaissance que tu nous as révélées par Jésus Ton enfant. »"},{"b":"text","l":"Ce que révèlent les Manuscrits de la Mer Morte","t":"Ce qui frappe dans les paroles de Paul mises dans la bouche de Jésus, ce sont les expressions fortes : sang, coupe, boire/faire boire et nouvelle alliance. Tous ces mots sont tirés de la tradition biblique mais très présents dans les Manuscrits de la Mer Morte de l'époque. Mais, curieusement, ils sont pris en contre-emploi.\n\nLa consommation du sang était, de longue date, un tabou pour les Juifs. La « coupe » au sens symbolique dans les Manuscrits et dans l'Apocalypse, c'est la coupe de la colère de Dieu. En français est conservée l'expression « La coupe est pleine », venue de Jérémie.\n\nIl semble que l'apôtre Paul a délibérément pratiqué un détournement afin de donner une valeur sacrificielle et rédemptrice à la mort de Jésus sur la Croix. Plusieurs indices donnent à penser que Jésus a partagé le pain et fait circuler la coupe, probablement sans prononcer la phrase sacro-sainte. L'Évangile de Jean a développé ce thème en faisant dire à Jésus : « Je suis le pain de la Vie »."},{"b":"text","l":"Le Disciple bien-aimé","t":"Lors de la scène du lavement des pieds, Jean, le Disciple bien-aimé, est tout près de Jésus : « Étendu sur le sein de Jésus » (Jean 13-23). Cette posture quasi-physique est signe qu'il serait l'héritier.\n\n« Ceci est Mon corps » : 4 mots en français, 5 en grec. Ce qui déclenchera la dispute entre catholiques et protestants.\n\nJérémias dira plus tard : « Le sang répandu par un innocent uni à Dieu possède un pouvoir d'expiation pour les autres. »\n\n« Ma vie, personne ne me l'enlève mais je la donne de moi-même. » (Jean 10, 18)"},{"b":"text","l":"L'Eucharistie : c'est l'Esprit-Saint qui agit","t":"À la messe, le prêtre ne parle pas au nom du Christ : il prie le Père au nom du peuple, en faisant mémoire de Jésus. Celui qui change le pain et le vin, c'est le Saint-Esprit ; et par Lui, le peuple devient le Corps mystique du Christ. « Transsubstantiation » veut dire transformation totale : il ne reste que l'apparence du pain, mais cette apparence est nécessaire, car sans signe il n'y a pas de sacrement. Recevoir la communion ne sert à rien s'il n'y a pas le Saint-Esprit."},{"b":"text","l":"La peur de communier","t":"Jusqu'en l'an 400, on communiait sans rupture. Puis les fidèles ont eu peur de recevoir l'hostie : une fois par an seulement (Latran IV, 1215). On s'est contenté de la « communion visuelle » ; en 1380 apparaît l'ostensoir. L'adoration de l'hostie a remplacé la célébration : l'Eucharistie est devenue un spectacle."}]},{"date":"3 avr","month":"Avril","type":"litu","title":"Vendredi Saint — La Passion et la Croix","sub":"« Tout est accompli » · Absence de jugement ce jour-là","content":[{"b":"text","l":"Signification","t":"La Passion et la mort de Jésus sur la Croix. Pour Jean, la Croix est le triomphe de l'Amour sur toute la haine de l'humanité. Croix = la plus haute révélation du Dieu d'Amour. Dans la Passion et la mort de Jésus, l'humanité nouvelle est née. La Passion du Christ n'est pas une défaite mais une victoire."},{"b":"quote","t":"Déclaration de Jésus : « Tout est accompli »\n\n« Le Verbe qui était la Lumière du monde descend dans le plus noir des Enfers — Mais c'est pour tout illuminer ! »\n\n« Sur la Croix, Il prend la violence du monde et la transmute désormais en Amour pour ce même monde. »\n\n« Il n'y a pas de plus grand amour que de donner sa vie pour ceux qu'on aime. »"},{"b":"text","l":"Symbolique de la Croix","t":"La Croix, instrument de supplice, se dresse désormais pour protéger le monde entier comme signe de Libération et d'Amour extrême. La Croix ansée des Égyptiens, la croix des Alchimistes (noces alchymiques des principes masculins et féminins — ces noces alchymiques donnent naissance à l'enfant philosophal, le cristal rouge naissant au croisement de la Croix), Krishna tenant des croix dans trois de ses six bras. Au pied de la Croix, sont Marie et Jean, archétypes du féminin et du masculin."},{"b":"pratique","l":"À faire ce jour","items":["Ce jour-là, faire un effort de volonté : absence de jugement et de critique","Au moment de la crucifixion, lever les yeux : croire en Lui et reconnaître l'amour de Dieu","À travers le chemin des réincarnations, il est bon de vous rappeler le Vendredi Saint","Le Chemin de Croix ne s'arrête pas à la mise au tombeau ; il conduit à la liberté de l'humanité et à la résurrection de chacun"]},{"b":"text","l":"Transubstantiation — ce que dit le Concile de Trente (1551)","t":"Au concile de Latran IV (1215), il a été établi que la transformation du pain en corps du Christ arrivait « par le pouvoir divin avec transubstantiation du pain en corps et du vin en sang ». Le Concile de Trente précise : « Dans le très Saint Sacrement de l'Eucharistie de façon véritable, réelle et substantielle, il y a le corps et le sang de Jésus-Christ avec son âme et sa divinité. » Ainsi, il n'y a plus de pain ; le pain est devenu corps du Christ. Il ne reste que l'apparence du pain. Ma chair est vraiment une nourriture et mon sang vraiment une boisson (Jean 6:55)."},{"b":"serge","t":"Jésus mourut vraisemblablement le 7 avril 30. Selon les indications de Marc et de Jean, la Paque coïncida avec le sabbat. Les spécialistes hésitent entre les années 30 et 33 ; la première convient mieux si l'on tient compte des indications chronologiques des Évangiles.\n\nConstatation de Serge : « Le Christ est ressuscité un jour ouvrable. » L'avez-vous remarqué ?"},{"b":"text","l":"Le Chemin de Croix — Note","t":"Le Chemin de Croix n'est pas une espèce de reportage sur la Passion du Christ mais une contemplation qui permet, station par station (il y en a quatorze), d'entrer progressivement dans le mystère de la Passion de Jésus.\n\nJésus devait porter uniquement la barre horizontale de la future croix, la barre verticale étant déjà dressée au sommet du Golgotha.\n\nLe Chemin de Croix ne s'arrête pas à la mise au tombeau ; il conduit à la liberté de l'humanité et à la résurrection de chacun. À travers le chemin des réincarnations, il est bon de vous rappeler le Vendredi Saint."},{"b":"text","l":"Le poisson Ichtus — symbole originel de la Croix","t":"L'origine de la Croix chrétienne n'est pas à l'origine la croix latine mais le Poisson Ichtus. Le Ichtus était utilisé comme symbole secret par les premiers chrétiens afin de se reconnaître entre eux. Il contient un acrostiche, pierre angulaire de la foi chrétienne : Iêsous Khristos Theou Huios Sôtêr = Jésus Christ Fils de Dieu Sauveur.\n\nPourquoi avoir choisi le poisson ? Parce qu'il a, toujours et toute sa croissance, LES YEUX OUVERTS !"},{"b":"text","l":"La Croix — le mémorial de la non-violence de Dieu","t":"La Croix, instrument de supplice, se dresse désormais pour protéger le monde entier comme signe de Libération et d'Amour extrême. Face à la haine, la Croix est le mémorial de la non-violence de Dieu : Celui qui meurt sur la Croix pourrait se défendre, il ne le fait pas.\n\nÀ Gethsémani, il a déjà refusé l'épée de Pierre : « Ne sais-tu pas que je puis recourir à mon Père qui m'enverrait plus de douze légions d'Anges ? »\n\nDes deux côtés de la Croix, Symbole de l'Arbre de Vie, sont dressées les croix des deux larrons : entre deux erreurs, se dresse la Vérité ; l'un des larrons s'identifie à la Miséricorde divine, l'autre à la Rigueur.\n\nAu pied de la Croix, sont Marie et Jean, archétypes du féminin et du masculin ; sur la Croix, celui qui n'est « ni homme ni femme », dit Paul, car dans cette mort, Jésus a reconquis l'Unité.\n\nCe n'est pas par hasard que le mot « Passion » qui évoque le martyre de Jésus, désigne aussi l'amour le plus fou."},{"b":"quote","t":"Épître de Saint Paul aux Philippiens :\n\n« Le Christ Jésus, Lui qui était dans la condition de Dieu, n'a pas jugé bon de revendiquer son droit d'être traité à l'égal de Dieu ; mais au contraire, il se dépouilla lui-même en prenant la condition de serviteur. Devenu semblable aux hommes, il s'est abaissé en devenant obéissant jusqu'à mourir, et à mourir sur une croix.\n\nC'est pourquoi Dieu l'a élevé au-dessus de tout ; il lui a conféré le Nom qui surpasse tous les noms, afin qu'au Nom de Jésus, aux cieux, sur terre et dans l'abîme, tout être vivant tombe à genoux. »"},{"b":"text","l":"La Passion selon chaque Évangéliste","t":"Dans l'étrange silence qui accompagne la mort de Jésus, seule une voix se fait entendre, celle d'un païen : « Vraiment cet homme était le Fils de Dieu » s'écrie le centurion romain.\n\nPour Luc : le reniement de Pierre (3 fois) — Jésus réconforte à l'avance celui qui le renie pour qu'il ne se décourage pas. Pour Jean : la Croix est le triomphe de l'Amour sur toute la haine de l'humanité.\n\nDans la Passion et la mort de Jésus, l'humanité nouvelle est née. La Passion du Christ n'est pas une défaite mais une victoire. C'est le Message d'Amour le plus absolu : « Je souffre pour toi, je meurs pour toi »."},{"b":"serge","t":"Date de la Crucifixion (Enseignement N°6, 2011) : selon Marc et Jean, cette année-là la Pâque tombait un sabbat. Cela s'est produit en 30 et en 33 ; les spécialistes penchent plutôt pour l'an 30. Chez Jean, Jésus est condamné à l'heure où l'on égorge les agneaux au Temple : il est le véritable agneau pascal."}]},{"date":"Nuit 4-5 avr","month":"Avril","type":"litu","title":"Vigile Pascale — Des Ténèbres à la Lumière","sub":"Nuit la plus sacrée · Feu nouveau · Cierge Pascal","content":[{"b":"text","l":"Ce que c'est","t":"La liturgie spécifique à Pâques commence par la Vigile Pascale. La nuit du matin du dimanche de Pâques : allumage du feu nouveau du Cierge Pascal, bénédiction des Fonts Baptismaux, lecture des prophéties et chant des litanies. Le Carême est terminé. L'accent est mis sur l'innocence retrouvée et sur la valeur de l'initiation chrétienne. Quand le jour est levé, arrive la Messe de la Résurrection.\n\nSouvent, la Vigile Pascale est l'occasion, pour les croyants, de recevoir le Sacrement du Baptême ou de la Confirmation. Symboliquement, la veillée pascale et son cierge traduisent la Résurrection du Christ, le renouvellement solennel de l'engagement de leur baptême. Le Christ, aussi appelé le Rédempteur, a vaincu pour les mortels le péché, le démon et la mort. Jésus-Christ s'est fait Agneau de Dieu, l'Agnus Dei, sacrifié lors de la crucifixion. Il enlève les péchés du monde par sa mort et sa résurrection."},{"b":"mantra","l":"Message de Serge pour la Vigile","t":"Dans la nuit du Samedi Saint à Pâques, on passe des Ténèbres à la Lumière. Christ est ressuscité et éternellement vivant ! Soyez de même. Vive la Vie qu'Il nous transmet."}]},{"date":"5 avr","month":"Avril","type":"cosm","title":"PÂQUES 2026 — La Renaissance Cosmique","sub":"Résurrection · Renaissance · Libération · Kundalini · Œuf Cosmique","content":[{"b":"text","l":"Trois mots pour le jour de Pâques","t":"RENAISSANCE — renaître, penser différemment, se mettre en harmonie avec les Énergies du Printemps, s'habiller avec beaucoup de couleur, réfléchir à sa vie en se débarrassant de tout ce qui n'est pas rentable.\n\nRÉSURRECTION — victoire sur la mort, premier matin de la victoire de l'humanité.\n\nLIBÉRATION — grand Passage, l'Ouverture, la délivrance de l'humain libéré de ses impasses. Dans le chapitre 10 de l'Évangile de Jean, Jésus dit qu'Il est à la fois le Bon Berger et la Porte ouverte, le Passage."},{"b":"text","l":"Ce que Pâques représente cosmiquement","t":"Pâques représente l'Œuf Cosmique, la Vie. Cet œuf s'ouvre tous les jours. C'est l'éveil, le renouveau, une nouvelle liberté, la renaissance qui demande de l'intelligence. C'est la période la plus efficace pour renaître dans la matière ; c'est comme si une nouvelle vie vous est offerte chaque année ! C'est aussi la re-naissance, la montée de l'Énergie, appelée Kundalini. C'est le symbole énergétique de la Résurrection. C'est à cette époque que renaît la vie et l'imagination."},{"b":"hi","t":"**Pâques est au centre de deux périodes de 40 jours :** 40 jours AVANT Pâques = le Carême (purification, désert). 40 jours APRÈS Pâques = l'Ascension (intégration, montée). Pâques est le commencement de l'année. **Les projets commencent entre Pâques et le 21 juin.** Les 14 premiers jours après Pâques sont des jours de réflexion : à faire avec légèreté. C'est une période où Dieu peut nous envoyer des opportunités."},{"b":"quote","t":"Paul à Colosses : « Ressuscités avec le Christ, cherchez les réalités d'en-haut, là où le Christ est assis à la droite de Dieu. Tendez vers les réalités d'en-haut, non pas vers celles de la terre. Car vous êtes morts, et votre vie reste cachée avec le Christ en Dieu. »\n\nRéalités d'en-haut : bienveillance, humilité, douceur, patience, pardon mutuel. Notre résurrection est accomplie. Il nous reste à égrener cette réalité profonde : restez ferme dans la Foi."},{"b":"quote","t":"Paul : « Purifez-vous des vieux ferments et vous serez une pâte nouvelle, vous qui êtes le pain de la Pâque. » Réalités d'en-haut : bienveillance, humilité, douceur, patience, pardon mutuel. Notre résurrection est accomplie. Il nous reste à égrener cette réalité profonde : restez ferme dans la Foi.\n\nDieu nous a confié les réalités terrestres. À nous de les transfigurer. La Pâque du Christ ouvre le chemin de la libération pour toute l'humanité."},{"b":"pratique","l":"À faire le jour de Pâques","items":["Dire « Joyeuses Pâques »","Boire un verre d'eau bénie","Manger en silence quelques bouchées en pensant que vous mangez le Corps du Christ et buvez son Sang — À faire Joyeusement","Préparer du pain et du vin chaud : cela permet de densifier les Énergies Divines reçues, de les concrétiser, de les sceller dans vos corps subtils","Pâques est un jour privilégié pour méditer et resserrer les liens familiaux et amicaux","Pour les croyants : « Dès cet instant, grâce à Christ je renais dans le Royaume et j'y reste. »"]},{"b":"mantra","l":"Parole de Jésus pour Pâques","t":"« Je suis venu pour que les hommes aient la vie et qu'ils l'aient en abondance. »"},{"b":"serge","t":"Note de Serge — Pâques 2023 : Pâques est vraiment le symbole de la renaissance. C'est le jour du papillon. C'est aussi tous les jours, la renaissance. Révélation : Pâques, c'est \"pas que…\", soit, \"pas que ce jour.\" Pâques c'est tous les matins. Il faut renaître tous les jours. On rend grâce à Dieu pour renaître : \"Donne-moi la force de renaître\".\n\nPâques, c'est la prise de conscience, c'est la Paix autour du Christ. C'est également le jour où l'œuf est cassé, c'est-à-dire on vole de ses propres ailes. C'est le jour du papillon.\n\nNote 2019 : La communion des fêtes de Pâques contribue à vous aider dans votre cheminement spirituel. D'une façon certaine, vous attirez à vous ce que vous pensez, dites et faites. Pensez à Dieu et vous attirez Divine Providence. La bonne attitude envers toute chose est nécessaire pour croître spirituellement. Il y a toujours du bon en toutes situations, aussi négatives paraissent-elles. Prenez le temps de chercher les états de grâce entre les difficultés et les obstacles. Avec de l'amour dans le cœur, vous n'êtes plus aveugle aux signes divins.\n\nNote 2017 : Qui renaît aujourd'hui ? Vous ou votre ego ? Êtes-vous prêt à vous abandonner à Divine Providence ? Êtes-vous prêt à être digne de l'enseignement divin de Lumière Divine ? Si vous êtes prêt à viser plus haut, plus léger, entrez dans une nouvelle vie maintenant et restez-y."},{"b":"quote","t":"Pour croire en la Résurrection individuelle, il faut combiner deux éléments : s'intéresser au sort de l'individu, et croire en un Dieu qui ne vous abandonne pas à la mort. Comme le disait Saint Anselme :\n\n« Il ne faut pas comprendre pour croire, il faut croire pour comprendre. »\n\nÀ Pâques, l'Énergie permet à l'ancien de renaître. Si le jeune peut renaître, l'ancien aussi car l'Énergie Cosmique est là. Cet immense secret est applicable chaque jour et pas uniquement à Pâques. Les brebis du Seigneur sont le contraire des moutons de Panurge."},{"b":"text","l":"Comment a été calculée la date de Pâques","t":"Depuis les premiers siècles, avec des calculs complexes, ils prennent en compte la date de l'Équinoxe de Printemps et le cycle lunaire. D'où déplacement de cette fête entre le 22 mars et le 25 avril (calendrier grégorien). Les projets commencent entre Pâques et le 21 juin. Les 14 premiers jours après Pâques sont des jours de réflexion : à faire avec légèreté. C'est une période où Dieu peut nous envoyer des opportunités."},{"b":"text","l":"Pâques et le calendrier essenien — secret historique","t":"Différence entre le calendrier juif (lunaire) et celui des Esséniens (solaire : 364 jours, 4 saisons de 13 semaines). Dans le calendrier essenien, les fêtes religieuses arrivent toujours le même jour de la semaine. La Pâque survient alors le mardi soir.\n\nLa Didachè : « Après avoir mangé la Pâque le mardi soir, nous allâmes à la montagne des Oliviers et ils prirent notre Seigneur Jésus. » (Chapitre XI)\n\nAinsi disparaissent toutes les anomalies entre les 4 Évangiles. Jésus a bien fêté un repas pascal mais en respectant le calendrier essenien ! Jean a raison lui aussi car il se réfère au calendrier juif officiel. Ceci explique comment tant d'événements ont pu se produire dans une période aussi courte entre l'arrestation et la crucifixion.\n\nCe dernier repas, la Cène, n'est donc pas un repas pascal mais un repas testamentaire ! Tout ceci est réel, émouvant, étonnant !"},{"b":"text","l":"RENAÎTRE, c'est","t":"— Penser différemment\n— Se mettre en harmonie avec les Énergies du Printemps\n— S'habiller, comme les petites fleurs, avec beaucoup de couleur\n— Réfléchir à sa vie en se débarrassant de tout ce qui n'est pas rentable\n— Renouvelez-vous vos expériences, vos aventures ?\n\nLa Renaissance de Pâques, c'est revoir complètement sa vie légèrement avec des fleurs sur la tête."},{"b":"text","l":"Symboles de Pâques","t":"— Les cloches : vont à Rome et reviennent (son + mouvement)\n— Œufs/lapin : symboles de fécondité\n— Agneau : sacrifice d'Abraham — Jésus s'est sacrifié pour prendre les péchés du monde\n— Colombe de la Paix\n— Couronne de petites fleurs sur la tête"},{"b":"serge","t":"Extrait — Enseignement Supérieur 2022 : Origine de Pâques — Sémira​mis et les œufs et lapins. Comme très souvent, l'Église a tout pris aux paiëns ou à d'autres religions. Pâques trouve son origine du temps de Sémiramis.\n\nNimrod mort, Sémiramis le déifie ; elle lui donne le nom de « dieu soleil » ou « Celui qui donne la vie ». Plus tard, il sera connu sous le nom de dieu Baal.\n\nL'origine de Pâques est liée à la naissance de Tammuz, fils illégitime de Sémiramis. Elle fait croire qu'il est une réincarnation de Nimrod. Le peuple étant à la recherche d'un sauveur, Sémiramis fait aussi croire qu'il est né de façon surnaturelle.\n\nTammuz meurt ; les larmes de sa mère l'ont « ressuscité » sous la forme d'une nouvelle végétation. Les lapins de Pâques ont été longtemps associés à la fertilité, donc à la déesse Ishtar.\n\nLes anciens babyloniens parlaient d'un œuf tombé du ciel dans la rivière Euphrate. Il aurait « éclos » grâce à Astarte/Sémiramis.\n\nNotez que le mot anglais « Easter » (Pâques) derive directement d'Ishtar."},{"b":"text","l":"Pesah — Pâques dans les trois religions monothéistes","t":"Pâques, bien avant, s'appelait Pesah. Chaque fois que les tribus au printemps s'apprêtaient à quitter leurs campements, elles offraient un sacrifice aux divinités. Ce sacrifice était destiné à la demande de fécondité des troupeaux.\n\nEn hébreu, existe un verbe « Pesah » ; il signifie « bondir », donc « sauter par-dessus les tentes et épargner ».\n\nL'agneau est un élément emblématique fort dans les trois religions monothéistes :\n— Pessah : fête durant laquelle les juifs consomment l'agneau pascal\n— Christianisme : l'agneau est le symbole de la crucifixion de Jésus\n— Tradition musulmane : l'agneau est rituellement immolé pour l'Aïd al-Adha en commémoration du sacrifice d'Abraham"},{"b":"serge","t":"Note de Serge — Pâques 2019 : Sur ce cheminement, évitez de vous condamner pour vos incapacités apparentes. L'astuce consiste à transformer vos faiblesses en forces, les vices en vertus, le négatif en positif.\n\nQue faites-vous de votre vie ? Voici le sujet de méditation de ce mois pascal. À l'aide d'une feuille de papier et d'un stylo, faites le point sur votre vie.\n\nDonnez-vous suffisamment de mouvements à votre vie ? Quand il n'y a pas assez de mouvements dans une vie, il ne peut y avoir de grands changements. Dieu a besoin de vous, à condition que vous soyez disponible et non pas figé sur vos chères habitudes.\n\nPréférez le T.G.V. dans votre vie au train-train... Je ne suis pas sponsorisé par la S.N.C.F. mais par le BON SENS !\n\nChacun de vous a un rôle spécifique à jouer dans le Plan Divin. Cherchez ce rôle jusqu'à le trouver et amusez-vous encore plus."},{"b":"text","l":"Le Bon Berger et la Porte (Jean 10)","t":"Pâques est le grand Passage, l'Ouverture. Dans le chapitre 10 de l'Évangile de Jean, Jésus dit qu'Il est à la fois le Bon Berger et la Porte.\n\nNon pas la porte qui ferme, isole, mais la porte ouverte, le Passage. « Si quelqu'un passe par Moi, il sera sauvé, il pourra aller et venir. »\n\nChrist est le Vrai, le Seul, l'Unique Berger ; Il connaît les humains chacun par leur nom et marche à leur tête ; Il a donné sa vie pour eux.\n\n« Je suis venu pour que les hommes aient la vie et qu'ils l'aient en abondance. »\n\nAlors réveille-toi et marche ! Sois fécond !"},{"b":"text","l":"Osiris et le pain-vin chaud","t":"Pâques, c'est tous les jours, la renaissance. Cf. Osiris dans l'Égypte ancienne : il meurt tous les soirs et renaît tous les matins. Le soleil est le symbole du Christ : il se couche le soir et le matin, il est là. Il faut renaître tous les jours.\n\nPréparez le pain et le vin chaud. Cela permettra de densifier les Énergies Divines que vous avez reçues, de les sceller dans vos corps subtils. Le seul plaisir dans la vie, c'est de changer. Donc, renaissez chaque matin."},{"b":"text","l":"L'Agneau de Dieu — d'Exode à Agni","t":"Par sa fragilité et sa candeur, l'agneau est, par excellence, le symbole de l'innocence. Dans l'Exode, les Hébreux tuent des agneaux et répandent leur sang sur les portes de leurs maisons, pour signaler à l'Ange de la Mort qu'ils font partie du peuple élu (Exode 12, 7-8).\n\nDe l'agneau à AGNI : Dieu du Veda, Agni établit la médiation entre les plans terrestres et spirituels. Agni est le feu sous toutes ses formes : dans le ciel (le Soleil), dans les bois, dans les demeures, dans la chaleur de la colère ou celle de la digestion (feu intérieur).\n\nAgni a été et est toujours célébré en divers endroits du globe : Atar chez les Iraniens, Ignis chez les Romains, Ogni chez les Slaves."},{"b":"text","l":"Les Quatre Nuits inscrites dans le Livre des Mémoires","t":"La nuit de la Pâque est importante : cette nuit durant laquelle Yahvé a veillé pour les faire sortir d'Égypte doit être, pour tous les Israélites, une veille pour Yahvé.\n\nQuatre nuits sont inscrites dans le Livre des Mémoires :\n— La première nuit, quand Yahvé se manifeste pour créer le monde\n— La deuxième nuit, quand Yahvé apparaît à Abraham âgé de cent ans\n— La troisième nuit, quand Yahvé apparaît aux yeux des Égyptiens (la sortie d'Égypte)\n— La quatrième nuit, quand arrivera la fin du monde"},{"b":"text","l":"La pureté rituelle au temps de Jésus","t":"Du temps de Jésus, le rituel de Pâques est parfois bien compliqué à cause de la « casherout », la pureté. Manger et boire deviennent actes de culte. Chaque repas est mémoire de « l'Alliance ».\n\nLe Talmud apprend 600 ordonnances afin de se laver les mains ! Rabbi Aquiba en prison utilisait sa maigre portion d'eau pour se laver les mains avant de manger.\n\nFlavius Josèphe dit des Esséniens : « Après avoir travaillé avec ardeur jusqu'à la cinquième heure, ils se rassemblent dans un même lieu, se ceignent les reins de pagnes de lin, se lavent le corps à l'eau froide et après cette purification, ils s'assemblent dans un local particulier où nul étranger à la secte n'est admis. » (Guerre des Juifs, II, 129-130)\n\nDans chaque repas, on pensait aux indigents et aux voyageurs ; chacun donnait une part."},{"b":"text","l":"Les irrégularités de la Passion — l'énigme résolue","t":"Un fait étonnant ! Il n'y a pas, à l'époque de Jésus, de repas pascal sans sacrifice d'agneau. Or, au dernier repas de Jésus, il n'est pas question d'agneau pascal ! Ce dernier repas est une violation certaine des lois juives.\n\nIl était interdit, d'après la juridiction juive, de juger un homme la nuit. De plus, il fallait, entre la sentence et l'exécution, 24 heures de délai.\n\nSi Jésus a été arrêté le mardi soir (calendrier essénien) et exécuté le vendredi après-midi, tout se tient ! On réconcilie les 4 évangélistes entre eux.\n\nÀ l'heure où des millions d'agneaux sont sacrifiés sous les cris d'allégresse de la fête, Jésus, à quelques centaines de mètres de là, est lui aussi agneau pascal sacrifié."},{"b":"text","l":"Un peu d'histoire — Easter, Ishtar et la Reine du Ciel","t":"Le mot Easter (traduction anglaise de Pâques) n'est pas un nom chrétien : il porte en lui-même son origine chaldéenne. Easter n'est pas autre chose qu'Astarté, la reine des Cieux, dont le nom retrouvé sur les monuments assyriens est « Ishtar ».\n\nLes galettes chaudes marquées d'une croix le Vendredi Saint, et les œufs coloriés de Pâques, figuraient dans les rites chaldéens. Cette coutume est confirmée par le récit biblique de Jérémie (7,18) :\n\n« Les fils ramassent le bois, les pères allument le feu, les femmes pétrissent la pâte pour faire des gâteaux à la Reine du Ciel. »\n\n« Pâque », de l'hébreu « Pessa'h » — « il passa par-dessus », d'où « passage »."},{"b":"text","l":"Le calcul de la date de Pâques — le comput","t":"Après le 1er Concile de Nicée en 325, il fut décidé que Pâques est célébrée le dimanche après la première pleine lune advenant pendant ou après l'Équinoxe de Printemps.\n\nLes églises occidentales adoptent le calendrier grégorien, alors que les orthodoxes utilisent toujours le calendrier julien — d'où les différences de dates.\n\nLe calcul est connu sous le nom de « comput ». La première méthode mathématique développée par Carl Friedrich Gauss avait quelques erreurs : en 1954 (la formule donnait le 25 avril au lieu du 18) et en 1981 (le 26 au lieu du 19 avril).\n\nEn France, le Lundi de Pâques est férié depuis la loi du 8 mars 1886."},{"b":"serge","t":"Note de Serge (Pâques 2019) : recherchez le calme, le silence intérieur ; il permet de trouver la Lumière de la Vérité, et là où il y a de la Lumière il n'y a pas de complications. Mais la Lumière est aussi mouvement : donnez-vous assez de mouvement à votre vie ? Sans mouvement, pas de grands changements. Si vous vous jugez petit, vous oubliez que Divine Providence a besoin de vous."}]},{"date":"5-12 avr","month":"Avril","type":"prat","title":"L'Octave de Pâques","sub":"8 jours · L'Œuf Cosmique s'ouvre chaque jour","content":[{"b":"text","l":"Ce que c'est","t":"Ce sont les 8 jours qui suivent Pâques. Cette semaine rappelle que la Résurrection se prolonge au-delà de Pâques. Chaque jour, c'est la Renaissance et l'ouverture à la Vie Cosmique. L'Œuf Cosmique s'ouvre tous les jours. Vous pensez bien que Dieu et Christ ne vous transmettent pas la Renaissance qu'un jour par an. Cela ne tient pas debout. Donc, tous les jours, Christ renaît en vous."},{"b":"mantra","l":"Mantra du Lundi de Pâques","t":"« Je bénéficie toujours des Énergies de la Renaissance du Christ toujours vivant. »"},{"b":"text","l":"Dimanche de Quasimodo — 2e dimanche de Pâques","t":"Ce deuxième Pâques ou octave de Pâques était connu naguère sous le nom de dimanche « in albis » parce qu'en ce jour, les nouveaux baptisés de la Nuit Pascale déposaient les vêtements blancs dont ils avaient alors été revêtus. C'est la fin de l'Octave Pascal. Depuis Jean-Paul II, c'est le Dimanche de la Divine Miséricorde. Attitude : se sentir comme un enfant."},{"b":"hi","t":"Note de Serge : le Lundi de Pâques n'est pas une fête initiatique, c'est une attaque des Ténèbres contre la Lumière. Restez vigilant, ancré dans les énergies de la veille."},{"b":"danger","t":"**Attention — Lundi de Pâques :** Lundi de Pâques n'est pas une fête initiatique, c'est une attaque des Ténèbres contre la Lumière. Restez dans les Énergies de la Renaissance du Christ Toujours Vivant.\n\nMantra du Lundi de Pâques : « Je bénéficie toujours des Énergies de la Renaissance du Christ toujours vivant. »"},{"b":"text","l":"Le dimanche « in albis »","t":"Ce deuxième dimanche de Pâques était connu naguère sous le nom de dimanche « in albis » parce qu'en ce jour, les nouveaux baptisés de la Nuit Pascale déposaient les vêtements blancs dont ils avaient été revêtus.\n\nOn l'appelle aussi « dimanche de Quasimodo », en raison des deux premiers mots de l'introït de la messe. Depuis Jean-Paul II, c'est le dimanche de la Divine Miséricorde.\n\nPendant cette semaine : mêmes prières que le jour de Pâques. La Résurrection se prolonge au-delà de Pâques. Faire en sorte que chaque jour soit dimanche."},{"b":"text","l":"Saint Thomas","t":"Le deuxième dimanche de Pâques est aussi consacré à Saint Thomas, à qui le Seigneur reproche son incrédulité face à la Résurrection. Ce dimanche montre l'amour miséricordieux de Divine Providence."}]}];
